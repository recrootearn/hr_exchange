{% extends "base.html" %}

{% block content %}

<div class="container mt-4">

    <div class="card shadow-lg border-0 rounded-4">

        <div class="card-body">

            <div class="d-flex justify-content-between align-items-center mb-4">

                <h2 class="fw-bold mb-0">
                    ➕ Add Notification Template
                </h2>

                <div>

                    <a href="/admin/install-default-notification-templates"
                       class="btn btn-success">

                        ⚡ Install Default Templates

                    </a>

                    <a href="/admin/notification-templates"
                       class="btn btn-secondary">

                        ← Back

                    </a>

                </div>

            </div>

            <form method="POST">

                <div class="mb-3">

                    <label class="form-label fw-bold">

                        Template Name

                    </label>

                    <input
                        type="text"
                        class="form-control"
                        name="name"
                        placeholder="Example: Welcome Candidate"
                        required>

                </div>

                <div class="mb-3">

                    <label class="form-label fw-bold">

                        Notification Title

                    </label>

                    <input
                        type="text"
                        class="form-control"
                        name="title"
                        placeholder="Example: Welcome to RecrootEarn"
                        required>

                </div>

                <div class="mb-3">

                    <label class="form-label fw-bold">

                        Notification Message

                    </label>

                    <textarea
                        class="form-control"
                        rows="6"
                        name="message"
                        placeholder="Write your notification..."
                        required></textarea>

                    <small class="text-muted">

                        Supported Variables:
                        {{first_name}},
                        {{last_name}},
                        {{full_name}},
                        {{amount}},
                        {{credits}},
                        {{wallet_balance}},
                        {{profile_completion}}

                    </small>

                </div>

                <div class="row">

                    <div class="col-md-6">

                        <div class="mb-3">

                            <label class="form-label fw-bold">

                                Audience

                            </label>

                            <select
                                class="form-select"
                                name="audience">

                                <option value="hr">

                                    👨‍💼 HR

                                </option>

                                <option value="candidate">

                                    👨‍🎓 Candidate

                                </option>

                                <option value="both">

                                    🌍 Both

                                </option>

                            </select>

                        </div>

                    </div>

                    <div class="col-md-6">

                        <div class="mb-3">

                            <label class="form-label fw-bold">

                                Open Link

                            </label>

                            <input
                                type="text"
                                class="form-control"
                                name="link"
                                value="/">

                        </div>

                    </div>

                </div>

                <div class="d-grid">

                    <button
                        class="btn btn-primary btn-lg">

                        💾 Save Template

                    </button>

                </div>

            </form>

        </div>

    </div>

</div>

{% endblock %}
