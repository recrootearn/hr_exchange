<form method="POST" enctype="multipart/form-data">

<div class="mb-3">
<label>Product Name</label>
<input type="text" class="form-control" name="name" required>
</div>

<div class="mb-3">
<label>Category</label>
<select class="form-select" name="category_id" required>

{% for c in categories %}

<option value="{{ c.id }}">

{{ c.name }}

</option>

{% endfor %}

</select>
</div>

<div class="mb-3">
<label>Description</label>
<textarea class="form-control"
name="description"
rows="5"
required></textarea>
</div>

<div class="row">

<div class="col-md-6">
<label>MRP</label>
<input type="number"
step="0.01"
class="form-control"
name="price"
required>
</div>

<div class="col-md-6">
<label>Selling Price</label>
<input type="number"
step="0.01"
class="form-control"
name="sale_price">
</div>

</div>

<div class="mt-3">

<label>Stock</label>

<input type="number"
class="form-control"
name="stock"
value="1">

</div>

<div class="mt-3">

<label>Images</label>

<input type="file"
name="images"
multiple
accept="image/*">

<small>

Maximum 5 images

</small>

</div>

<div class="mt-4">

<button class="btn btn-primary">

Save Product

</button>

</div>

</form>
