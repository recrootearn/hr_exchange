{% extends "base.html" %}

{% block title %}Business Settings{% endblock %}

{% block content %}

<div class="container mt-4">

    <h2 class="mb-4">
        ⚙️ Business Settings
    </h2>

    <form method="POST">

        <!-- ====================================== -->
        <!-- HR REFERRAL -->
        <!-- ====================================== -->

        <div class="card mb-4">

            <div class="card-header bg-primary text-white">
                HR Referral
            </div>

            <div class="card-body">

                <div class="row">

                    <div class="col-md-4 mb-3">
                        <label>HR → HR Reward (₹)</label>

                        <input
                            type="number"
                            class="form-control"
                            name="hr_to_hr_reward"
                            value="{{ settings.hr_to_hr_reward }}">
                    </div>

                    <div class="col-md-4 mb-3">
                        <label>Minimum Purchase (₹)</label>

                        <input
                            type="number"
                            class="form-control"
                            name="hr_minimum_purchase"
                            value="{{ settings.hr_minimum_purchase }}">
                    </div>

                    <div class="col-md-4 mb-3">
                        <label>Daily Referral Limit</label>

                        <input
                            type="number"
                            class="form-control"
                            name="hr_daily_referral_limit"
                            value="{{ settings.hr_daily_referral_limit }}">
                    </div>

                </div>

            </div>

        </div>

        <!-- ====================================== -->
        <!-- CANDIDATE REFERRAL -->
        <!-- ====================================== -->

        <div class="card mb-4">

            <div class="card-header bg-success text-white">
                Candidate Referral
            </div>

            <div class="card-body">

                <div class="row">

                    <div class="col-md-6 mb-3">
                        <label>HR → Candidate Reward (₹)</label>

                        <input
                            type="number"
                            class="form-control"
                            name="hr_to_candidate_reward"
                            value="{{ settings.hr_to_candidate_reward }}">
                    </div>

                    <div class="col-md-6 mb-3">
                        <label>Candidate → Candidate Reward (₹)</label>

                        <input
                            type="number"
                            class="form-control"
                            name="candidate_to_candidate_reward"
                            value="{{ settings.candidate_to_candidate_reward }}">
                    </div>

                    <div class="col-md-6 mb-3">
                        <label>Candidate Daily Referral Limit</label>

                        <input
                            type="number"
                            class="form-control"
                            name="candidate_daily_referral_limit"
                            value="{{ settings.candidate_daily_referral_limit }}">
                    </div>

                </div>

            </div>

        </div>

        <!-- ====================================== -->
        <!-- REVENUE SHARING -->
        <!-- ====================================== -->

        <div class="card mb-4">

            <div class="card-header bg-warning">
                Revenue Sharing
            </div>

            <div class="card-body">

                <div class="row">

                    <div class="col-md-3 mb-3">
                        <label>Discover HR %</label>

                        <input
                            type="number"
                            class="form-control"
                            name="discover_hr_share"
                            value="{{ settings.discover_hr_share }}">
                    </div>

                    <div class="col-md-3 mb-3">
                        <label>Discover Admin %</label>

                        <input
                            type="number"
                            class="form-control"
                            name="discover_admin_share"
                            value="{{ settings.discover_admin_share }}">
                    </div>

                    <div class="col-md-3 mb-3">
                        <label>Leads HR %</label>

                        <input
                            type="number"
                            class="form-control"
                            name="leads_hr_share"
                            value="{{ settings.leads_hr_share }}">
                    </div>

                    <div class="col-md-3 mb-3">
                        <label>Leads Admin %</label>

                        <input
                            type="number"
                            class="form-control"
                            name="leads_admin_share"
                            value="{{ settings.leads_admin_share }}">
                    </div>

                    <div class="col-md-3 mb-3">
                        <label>Self Candidate Admin %</label>

                        <input
                            type="number"
                            class="form-control"
                            name="self_candidate_admin_share"
                            value="{{ settings.self_candidate_admin_share }}">
                    </div>

                </div>

            </div>

        </div>

        <!-- ====================================== -->
        <!-- UNLOCK SETTINGS -->
        <!-- ====================================== -->

        <div class="card mt-4">
            <div class="card-header bg-info text-white">
                Lead Unlock Settings
            </div>

            <div class="card-body">

                <div class="row">

                    <div class="col-md-6 mb-3">
                        <label>Fresher (Paid Credits)</label>
                        <input type="number"
                               name="lead_fresher_paid"
                               class="form-control"
                               value="{{ settings.lead_fresher_paid }}">
            </div>

            <div class="col-md-6 mb-3">
                <label>Fresher (Free Credits)</label>
                <input type="number"
                       name="lead_fresher_free"
                       class="form-control"
                       value="{{ settings.lead_fresher_free }}">
            </div>

            <div class="col-md-6 mb-3">
                <label>Experienced (Paid Credits)</label>
                <input type="number"
                       name="lead_experienced_paid"
                       class="form-control"
                       value="{{ settings.lead_experienced_paid }}">
            </div>

            <div class="col-md-6 mb-3">
                <label>Experienced (Free Credits)</label>
                <input type="number"
                       name="lead_experienced_free"
                       class="form-control"
                       value="{{ settings.lead_experienced_free }}">
            </div>

        </div>

    </div>
</div>

<div class="card mt-3">
    <div class="card-header bg-dark text-white">
        Discover Unlock
    </div>

    <div class="card-body">

        <label>Discover Unlock Cost</label>

        <input type="number"
               name="discover_unlock_cost"
               class="form-control"
               value="{{ settings.discover_unlock_cost }}">

    </div>
</div>

        <!-- ====================================== -->
        <!-- WALLET -->
        <!-- ====================================== -->

        <div class="card mb-4">

            <div class="card-header bg-dark text-white">
                Wallet
            </div>

            <div class="card-body">

                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label>Minimum Withdrawal</label>

                        <input
                            type="number"
                            class="form-control"
                            name="minimum_withdrawal"
                            value="{{ settings.minimum_withdrawal }}">

                    </div>

                    <div class="col-md-6 mb-3">

                        <label>Maximum Daily Withdrawal</label>

                        <input
                            type="number"
                            class="form-control"
                            name="maximum_daily_withdrawal"
                            value="{{ settings.maximum_daily_withdrawal }}">

                    </div>

                </div>

            </div>

        </div>

        <h4>🎁 Daily Candidate Reward</h4>

        <label>
        <input type="checkbox" name="enable_daily_candidate_reward"
        {% if settings.enable_daily_candidate_reward %}checked{% endif %}>
        Enable Daily Reward
        </label>

        <label>Reward Amount (₹)</label>
        <input type="number"
        name="daily_candidate_reward"
        value="{{ settings.daily_candidate_reward }}">

        <label>
        <input type="checkbox" name="daily_reward_login"
        {% if settings.daily_reward_login %}checked{% endif %}>
        Login Required
        </label>

        <label>
        <input type="checkbox" name="daily_reward_apply"
        {% if settings.daily_reward_apply %}checked{% endif %}>
        Apply Job Required
        </label>

        <label>
        <input type="checkbox" name="daily_reward_follow"
        {% if settings.daily_reward_follow %}checked{% endif %}>
        Follow HR Required
        </label>

        <label>
        <input type="checkbox" name="daily_reward_referral"
        {% if settings.daily_reward_referral %}checked{% endif %}>
        Referral Required
        </label>

        <label>Referral Target</label>
        <input type="number"
        name="daily_referral_target"
        value="{{ settings.daily_referral_target }}">

        <!-- ====================================== -->
        <!-- FEATURE TOGGLES -->
        <!-- ====================================== -->

        <div class="card mb-4">

            <div class="card-header bg-secondary text-white">
                Feature Toggles
            </div>

            <div class="card-body">

                <div class="form-check">
                    <input class="form-check-input" type="checkbox" name="enable_hr_referral" {% if settings.enable_hr_referral %}checked{% endif %}>
                    <label class="form-check-label">Enable HR Referral</label>
                </div>

                <div class="form-check">
                    <input class="form-check-input" type="checkbox" name="enable_candidate_referral" {% if settings.enable_candidate_referral %}checked{% endif %}>
                    <label class="form-check-label">Enable Candidate Referral</label>
                </div>

                <div class="form-check">
                    <input class="form-check-input" type="checkbox" name="enable_revenue_sharing" {% if settings.enable_revenue_sharing %}checked{% endif %}>
                    <label class="form-check-label">Enable Revenue Sharing</label>
                </div>

                <div class="form-check">
                    <input class="form-check-input" type="checkbox" name="enable_discover" {% if settings.enable_discover %}checked{% endif %}>
                    <label class="form-check-label">Enable Discover</label>
                </div>

                <div class="form-check">
                    <input class="form-check-input" type="checkbox" name="enable_leads" {% if settings.enable_leads %}checked{% endif %}>
                    <label class="form-check-label">Enable Leads</label>
                </div>

                <div class="form-check">
                    <input class="form-check-input" type="checkbox" name="enable_wallet" {% if settings.enable_wallet %}checked{% endif %}>
                    <label class="form-check-label">Enable Wallet</label>
                </div>

                <div class="form-check">
                    <input class="form-check-input" type="checkbox" name="enable_withdrawals" {% if settings.enable_withdrawals %}checked{% endif %}>
                    <label class="form-check-label">Enable Withdrawals</label>
                </div>

            </div>

        </div>

        <button
            class="btn btn-success btn-lg w-100">

            💾 Save Business Settings

        </button>

    </form>

</div>

{% endblock %}
