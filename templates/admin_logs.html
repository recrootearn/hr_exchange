{% extends 'base.html' %}

{% block content %}

<h2 class="mb-4">
    Admin Logs
</h2>

<div class="stats-card">

    <table class="table table-bordered table-striped">

        <tr>

            <th>Action</th>

            <th>Date</th>

        </tr>

        {% for log in logs %}

        <tr>

            <td>{{ log.action }}</td>

            <td>{{ log.created_at }}</td>

        </tr>

        {% endfor %}

    </table>

</div>

{% endblock %}
