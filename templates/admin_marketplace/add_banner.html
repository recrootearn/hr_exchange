<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Add Homepage Banner | RecrootEarn</title>

<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

    background:#f4f7fb;
    color:#172033;
}

a{
    text-decoration:none;
    color:inherit;
}

.page{
    width:100%;
    max-width:1100px;
    margin:auto;
    padding:24px;
}

.topbar{
    display:flex;
    align-items:center;
    gap:14px;
    margin-bottom:24px;
}

.back-btn{
    width:44px;
    height:44px;
    border-radius:14px;
    background:#fff;
    border:1px solid #e5eaf2;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#2563eb;
    box-shadow:0 4px 15px rgba(15,23,42,.06);
}

.page-title h1{
    font-size:27px;
    font-weight:900;
}

.page-title p{
    color:#718096;
    margin-top:4px;
    font-size:14px;
}

.card{
    background:#fff;
    border-radius:24px;
    padding:26px;
    border:1px solid #e7ebf2;
    box-shadow:0 10px 35px rgba(15,23,42,.06);
}

.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
}

.field{
    display:flex;
    flex-direction:column;
    gap:8px;
}

.field.full{
    grid-column:1/-1;
}

label{
    font-size:14px;
    font-weight:800;
    color:#263247;
}

input,
textarea{
    width:100%;
    border:1px solid #dce3ed;
    border-radius:13px;
    padding:13px 14px;
    font-size:15px;
    outline:none;
    background:#fbfcfe;
    transition:.2s;
}

input:focus,
textarea:focus{
    border-color:#2563eb;
    background:#fff;
    box-shadow:0 0 0 4px rgba(37,99,235,.08);
}

textarea{
    min-height:110px;
    resize:vertical;
}

.file-box{
    border:2px dashed #d7deea;
    border-radius:18px;
    padding:22px;
    text-align:center;
    background:#f8fafc;
    cursor:pointer;
}

.file-box i{
    font-size:30px;
    color:#2563eb;
    margin-bottom:8px;
}

.file-box strong{
    display:block;
    margin-bottom:5px;
}

.file-box span{
    color:#718096;
    font-size:13px;
}

.file-box input{
    margin-top:15px;
    border:0;
    background:transparent;
}

.preview{
    display:none;
    margin-top:15px;
    border-radius:16px;
    overflow:hidden;
    background:#eef2f7;
}

.preview img{
    width:100%;
    max-height:300px;
    object-fit:cover;
    display:block;
}

.options{
    display:flex;
    align-items:center;
    gap:10px;
    margin-top:5px;
}

.options input{
    width:20px;
    height:20px;
}

.actions{
    display:flex;
    justify-content:flex-end;
    gap:12px;
    margin-top:26px;
    padding-top:20px;
    border-top:1px solid #edf0f5;
}

.btn{
    border:0;
    border-radius:13px;
    padding:13px 20px;
    font-size:14px;
    font-weight:800;
    cursor:pointer;
}

.btn-cancel{
    background:#eef2f7;
    color:#475569;
}

.btn-save{
    background:#2563eb;
    color:#fff;
    box-shadow:0 8px 20px rgba(37,99,235,.25);
}

@media(max-width:700px){

    .page{
        padding:14px;
    }

    .card{
        padding:18px;
        border-radius:20px;
    }

    .form-grid{
        grid-template-columns:1fr;
        gap:16px;
    }

    .field.full{
        grid-column:auto;
    }

    .page-title h1{
        font-size:22px;
    }

    .actions{
        flex-direction:column-reverse;
    }

    .btn{
        width:100%;
    }

}

</style>
</head>

<body>

<div class="page">

    <div class="topbar">

        <a href="/admin/marketplace/banners"
           class="back-btn">

            <i class="fas fa-arrow-left"></i>

        </a>

        <div class="page-title">

            <h1>Add Homepage Banner</h1>

            <p>
                Create a promotional banner for the public shop homepage.
            </p>

        </div>

    </div>


    <form
        method="POST"
        action="/admin/marketplace/banner/add"
        enctype="multipart/form-data"
        class="card">


        <div class="form-grid">


            <div class="field full">

                <label>
                    Banner Title
                </label>

                <input
                    type="text"
                    name="title"
                    placeholder="Great Freedom Sale"
                    required
                >

            </div>


            <div class="field full">

                <label>
                    Subtitle
                </label>

                <textarea
                    name="subtitle"
                    placeholder="Exciting offers on selected products..."
                ></textarea>

            </div>


            <div class="field">

                <label>
                    Button Text
                </label>

                <input
                    type="text"
                    name="button_text"
                    placeholder="Shop Now"
                >

            </div>


            <div class="field">

                <label>
                    Button Link
                </label>

                <input
                    type="text"
                    name="button_link"
                    placeholder="/shop/products"
                >

            </div>


            <div class="field">

                <label>
                    Display Order
                </label>

                <input
                    type="number"
                    name="display_order"
                    value="0"
                    min="0"
                >

            </div>


            <div class="field">

                <label>
                    Banner Image
                </label>

                <div class="file-box">

                    <i class="fas fa-cloud-arrow-up"></i>

                    <strong>
                        Upload Banner Image
                    </strong>

                    <span>
                        Recommended: wide homepage banner
                    </span>

                    <input
                        type="file"
                        name="image"
                        accept="image/*"
                        required
                        onchange="previewBanner(this)"
                    >

                </div>

                <div
                    class="preview"
                    id="imagePreview">

                    <img id="previewImage">

                </div>

            </div>


            <div class="field full">

                <div class="options">

                    <input
                        type="checkbox"
                        name="is_active"
                        id="is_active"
                        checked
                    >

                    <label for="is_active">
                        Show this banner on the homepage
                    </label>

                </div>

            </div>


        </div>


        <div class="actions">

            <a
                href="/admin/marketplace/banners"
                class="btn btn-cancel">

                Cancel

            </a>


            <button
                type="submit"
                class="btn btn-save">

                <i class="fas fa-plus"></i>
                &nbsp;
                Add Banner

            </button>

        </div>


    </form>

</div>


<script>

function previewBanner(input){

    const preview =
        document.getElementById("imagePreview");

    const image =
        document.getElementById("previewImage");

    if(
        input.files &&
        input.files[0]
    ){

        const reader =
            new FileReader();

        reader.onload =
            function(e){

                image.src =
                    e.target.result;

                preview.style.display =
                    "block";

            };

        reader.readAsDataURL(
            input.files[0]
        );

    }

}

</script>

</body>
</html>
