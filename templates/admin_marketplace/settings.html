{% extends "admin/base.html" %}

{% block title %}Marketplace Settings{% endblock %}

{% block content %}

<div class="container-fluid">

<h2 class="mb-4">

<i class="fas fa-cogs"></i>

Marketplace Settings

</h2>

<form method="POST">

<div class="row">

<!-- Marketplace -->

<div class="col-lg-6">

<div class="card shadow-sm mb-4">

<div class="card-header">

Marketplace

</div>

<div class="card-body">

<div class="form-check form-switch mb-3">

<input class="form-check-input"

type="checkbox"

name="marketplace_enabled"

{% if settings.marketplace_enabled %}checked{% endif %}>

<label>

Marketplace Enabled

</label>

</div>

<label>

Platform Commission %

</label>

<input

type="number"

step="0.01"

name="marketplace_commission"

class="form-control mb-3"

value="{{ settings.marketplace_commission }}">

<label>

Seller Payment Hold Days

</label>

<input

type="number"

name="seller_payment_hold_days"

class="form-control mb-3"

value="{{ settings.seller_payment_hold_days }}">

<label>

Minimum Order Amount

</label>

<input

type="number"

name="minimum_order_amount"

class="form-control mb-3"

value="{{ settings.minimum_order_amount }}">

<label>

Maximum Order Amount

</label>

<input

type="number"

name="maximum_order_amount"

class="form-control"

value="{{ settings.maximum_order_amount }}">

</div>

</div>

</div>

<!-- Shipping -->

<div class="col-lg-6">

<div class="card shadow-sm mb-4">

<div class="card-header">

Shipping

</div>

<div class="card-body">

<div class="form-check form-switch mb-3">

<input

class="form-check-input"

type="checkbox"

name="cod_enabled"

{% if settings.cod_enabled %}checked{% endif %}>

<label>

Cash On Delivery

</label>

</div>

<label>

Free Shipping Above

</label>

<input

type="number"

name="free_shipping_amount"

class="form-control mb-3"

value="{{ settings.free_shipping_amount }}">

<label>

Shipping Tax %

</label>

<input

type="number"

step="0.01"

name="shipping_tax_percent"

class="form-control"

value="{{ settings.shipping_tax_percent }}">

</div>

</div>

</div>

<!-- Returns -->

<div class="col-lg-6">

<div class="card shadow-sm mb-4">

<div class="card-header">

Returns

</div>

<div class="card-body">

<label>

Return Window (Days)

</label>

<input

type="number"

name="return_window_days"

class="form-control mb-3"

value="{{ settings.return_window_days }}">

<label>

Exchange Window (Days)

</label>

<input

type="number"

name="exchange_window_days"

class="form-control"

value="{{ settings.exchange_window_days }}">

</div>

</div>

</div>

<!-- Wallet -->

<div class="col-lg-6">

<div class="card shadow-sm mb-4">

<div class="card-header">

Wallet

</div>

<div class="card-body">

<label>

Minimum Withdrawal

</label>

<input

type="number"

name="minimum_withdrawal"

class="form-control mb-3"

value="{{ settings.minimum_withdrawal }}">

<label>

Maximum Daily Withdrawal

</label>

<input

type="number"

name="maximum_daily_withdrawal"

class="form-control"

value="{{ settings.maximum_daily_withdrawal }}">

</div>

</div>

</div>

<!-- Promotions -->

<div class="col-lg-6">

<div class="card shadow-sm mb-4">

<div class="card-header">

Promotions

</div>

<div class="card-body">

<label>

Product Promotion Price

</label>

<input

type="number"

name="product_promotion_price"

class="form-control mb-3"

value="{{ settings.product_promotion_price }}">

<label>

Shop Promotion Price

</label>

<input

type="number"

name="shop_promotion_price"

class="form-control mb-3"

value="{{ settings.shop_promotion_price }}">

<label>

Homepage Banner Price

</label>

<input

type="number"

name="homepage_banner_price"

class="form-control mb-3"

value="{{ settings.homepage_banner_price }}">

<label>

Promotion Duration (Days)

</label>

<input

type="number"

name="promotion_duration_days"

class="form-control"

value="{{ settings.promotion_duration_days }}">

</div>

</div>

</div>

<!-- Search -->

<div class="col-lg-6">

<div class="card shadow-sm mb-4">

<div class="card-header">

Search

</div>

<div class="card-body">

<label>

Products Per Page

</label>

<input

type="number"

name="maximum_products_per_page"

class="form-control mb-3"

value="{{ settings.maximum_products_per_page }}">

<div class="form-check form-switch">

<input

class="form-check-input"

type="checkbox"

name="enable_related_products"

{% if settings.enable_related_products %}checked{% endif %}>

<label>

Enable Related Products

</label>

</div>

</div>

</div>

</div>

<!-- Maintenance -->

<div class="col-lg-12">

<div class="card shadow-sm">

<div class="card-header bg-danger text-white">

Maintenance

</div>

<div class="card-body">

<div class="form-check form-switch">

<input

class="form-check-input"

type="checkbox"

name="marketplace_maintenance"

{% if settings.marketplace_maintenance %}checked{% endif %}>

<label>

Marketplace Maintenance Mode

</label>

</div>

<p class="text-muted mt-2">

Customers will not be able to browse or place orders while maintenance mode is enabled.

</p>

</div>

</div>

</div>

</div>

<div class="mt-4 text-end">

<button

class="btn btn-success btn-lg">

<i class="fas fa-save"></i>

Save Marketplace Settings

</button>

</div>

</form>

</div>

{% endblock %}
