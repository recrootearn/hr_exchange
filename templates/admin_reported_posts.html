{% extends "base.html" %}

{% block content %}

<div class="container mt-4">

<h3>🛡 Reported Posts</h3>

<table class="table table-bordered table-hover">

<thead>

<tr>

<th>ID</th>

<th>Company</th>

<th>Type</th>

<th>Reports</th>

<th>Action</th>

</tr>

</thead>

<tbody>

{% for post, total in reports %}

<tr>

<td>{{ post.id }}</td>

<td>{{ post.company_name }}</td>

<td>{{ post.post_type }}</td>

<td>

<span class="badge bg-danger">

{{ total }}

</span>

</td>

<td>

<a href="/admin/view-report/{{ post.id }}"
class="btn btn-info btn-sm">

View

</a>

<a href="/admin/delete-reported-post/{{ post.id }}"
class="btn btn-danger btn-sm"
onclick="return confirm('Delete this post?')">

Delete

</a>

</td>

</tr>

{% endfor %}

</tbody>

</table>

</div>

{% endblock %}
