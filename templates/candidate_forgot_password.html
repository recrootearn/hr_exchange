<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Candidate Forgot Password - RecrootEarn</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>

body{
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow-x:hidden;

    background:linear-gradient(
        135deg,
        #0057b8,
        #0074e8,
        #39d11f
    );

    font-family:Arial,sans-serif;
}

.forgot-box{

    width:100%;
    max-width:500px;

    background:white;

    border-radius:30px;

    padding:40px;

    box-shadow:
    0 25px 60px rgba(0,0,0,0.25);

    animation:fadeIn .6s ease;
}

.logo{
    text-align:center;
    margin-bottom:12px;
}

.logo img{
    width:220px;
    max-width:100%;
    height:auto;
}

.logo-sub{
    text-align:center;
    color:#6b7280;
    font-weight:600;
    margin-bottom:30px;
}

.page-title{
    text-align:center;
    font-size:32px;
    font-weight:800;
    color:#111827;
    margin-bottom:30px;
}

.input-box{
    position:relative;
    margin-bottom:20px;
}

.input-box i{
    position:absolute;
    left:18px;
    top:50%;
    transform:translateY(-50%);
    color:#6b7280;
}

.input-box input{

    width:100%;
    height:58px;

    border:1px solid #d1d5db;

    border-radius:14px;

    padding-left:55px;

    font-size:15px;

    background:#fafafa;
}

.input-box input:focus{

    outline:none;

    border-color:#0074e8;

    box-shadow:
    0 0 0 4px rgba(0,116,232,.15);
}

.verify-btn{

    width:100%;
    height:54px;

    border:none;

    border-radius:14px;

    background:
    linear-gradient(
        135deg,
        #0057b8,
        #0074e8
    );

    color:white;

    font-size:18px;

    font-weight:700;

    margin-top:10px;
}

.verify-btn:hover{
    opacity:.95;
}

.back-link{
    text-align:center;
    margin-top:20px;
}

.back-link a{
    color:#0d63c9;
    text-decoration:none;
    font-weight:700;
}

.back-link a:hover{
    text-decoration:underline;
}

@keyframes fadeIn{

    from{
        opacity:0;
        transform:translateY(20px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

@media(max-width:768px){

    body{
        padding:10px;
    }

    .forgot-box{
        width:100%;
        padding:25px;
        border-radius:28px;
    }

    .logo img{
        width:180px;
    }

    .page-title{
        font-size:28px;
    }
}

</style>

</head>

<body>

<div class="forgot-box">

    <div class="logo">
        <img src="{{ url_for('static', filename='images/logo.png') }}">
    </div>

    <div class="logo-sub">
        Recruit • Connect • Earn
    </div>

    <div class="page-title">
        Forgot Password
    </div>

    <form method="POST">

        <div class="input-box">
            <i class="fas fa-envelope"></i>

            <input
            type="email"
            name="email"
            placeholder="Registered Email"
            required>
        </div>

        <div class="input-box">
            <i class="fas fa-phone"></i>

            <input
            type="text"
            name="mobile"
            placeholder="Registered Mobile Number"
            required>
        </div>

        <button type="submit" class="verify-btn">
            Verify Account
        </button>

    </form>

    <div class="back-link">
        <a href="/candidate-login">
            ← Back to Candidate Login
        </a>
    </div>

</div>

</body>

</html>
