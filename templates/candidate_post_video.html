{% extends "base.html" %}

{% block content %}

<style>
.candidate-video-wrap{
    max-width:720px;
    margin:30px auto 60px;
    padding:0 16px;
}
.candidate-video-card{
    background:#fff;
    border:1px solid #e8edf5;
    border-radius:22px;
    padding:26px;
    box-shadow:0 10px 35px rgba(15,23,42,.07);
}
.candidate-video-title{
    font-size:25px;
    font-weight:800;
    color:#172033;
}
.candidate-video-subtitle{
    color:#6b7280;
    margin-top:7px;
}
.video-field{
    margin-top:20px;
}
.video-field label{
    display:block;
    font-weight:700;
    color:#253044;
    margin-bottom:8px;
}
.video-field input,
.video-field textarea{
    width:100%;
    border:1px solid #dfe5ee;
    border-radius:13px;
    padding:13px 14px;
    outline:none;
}
.video-field textarea{
    min-height:120px;
    resize:vertical;
}
.video-help{
    margin-top:7px;
    color:#7a8494;
    font-size:13px;
}
.video-submit{
    width:100%;
    margin-top:22px;
    border:0;
    border-radius:13px;
    padding:14px;
    background:#0b5ed7;
    color:#fff;
    font-weight:800;
    font-size:15px;
}
.video-submit:hover{
    opacity:.94;
}
</style>

<div class="candidate-video-wrap">

    <div class="candidate-video-card">

        <div class="candidate-video-title">
            🎥 Post a Candidate Video
        </div>

        <div class="candidate-video-subtitle">
            Share your skills, introduction, achievements or career journey.
        </div>

        <form
            method="POST"
            action="{{ url_for('candidate_post_video') }}"
            enctype="multipart/form-data"
        >

            <div class="video-field">

                <label for="candidate_video">
                    Video
                </label>

                <input
                    id="candidate_video"
                    type="file"
                    name="candidate_video"
                    accept="video/*"
                    required
                >

                <div class="video-help">
                    Maximum duration: 60 seconds.
                </div>

            </div>

            <div class="video-field">

                <label for="location">
                    Location
                </label>

                <input
                    id="location"
                    type="text"
                    name="location"
                    value="{{ candidate.city or '' }}"
                    maxlength="150"
                    placeholder="Where was this video posted from?"
                    required
                >

                <div class="video-help">
                    This location will be shown publicly with your video.
                </div>

            </div>

            <div class="video-field">

                <label for="caption">
                    Caption
                </label>

                <textarea
                    id="caption"
                    name="caption"
                    maxlength="2000"
                    placeholder="Tell recruiters and other candidates about this video..."
                ></textarea>

            </div>

            <div class="video-field">

                <label for="hashtags">
                    Hashtags
                </label>

                <input
                    id="hashtags"
                    type="text"
                    name="hashtags"
                    maxlength="500"
                    placeholder="#Hiring #Python #Marketing"
                >

            </div>

            <button
                type="submit"
                class="video-submit"
            >
                Post Video
            </button>

        </form>

    </div>

</div>

{% endblock %}
