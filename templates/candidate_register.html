<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Candidate Registration - RecrootEarn</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body{ min-height:100vh; display:flex; justify-content:center; align-items:center; background:linear-gradient(135deg, #0057b8, #0074e8, #39d11f); font-family:Arial,sans-serif; }
        .card-box{ width:100%; max-width:500px; background:white; border-radius:25px; padding:35px; box-shadow:0 20px 50px rgba(0,0,0,.25); }
        .logo{ text-align:center; margin-bottom:15px; }
        .logo img{ width:220px; max-width:100%; }
        .tagline{ text-align:center; color:#6b7280; margin-bottom:25px; }
        .title{ text-align:center; font-size:28px; font-weight:700; margin-bottom:25px; }
        .form-control{ height:52px; border-radius:12px; }
        .btn-register{ width:100%; height:52px; border:none; border-radius:12px; background:linear-gradient(135deg, #0057b8, #0074e8); color:white; font-weight:700; margin-top:10px; }
        .login-link{ text-align:center; margin-top:20px; }
        .login-link a{ text-decoration:none; color:#0d63c9; font-weight:700; }
    </style>
</head>
<body>

<div class="card-box">
    <div class="logo">
        <img src="{{ url_for('static', filename='images/logo.png') }}">
    </div>
    <div class="title">Candidate Registration</div>

    <form method="POST" enctype="multipart/form-data">
        <div class="mb-3">
            <input type="text" class="form-control" name="full_name" placeholder="Full Name" required>
        </div>
        <div class="mb-3">
            <input type="tel" name="mobile" class="form-control" maxlength="10" placeholder="Enter Mobile Number" required>
            <small id="mobileStatus"></small>
            
            <div id="otpSection" class="mt-3">
                <div id="msg91Captcha" class="mt-3 mb-3 d-flex justify-content-center"></div>
                <button type="button" class="btn btn-primary w-100" id="sendOtpBtn">Send OTP</button>
                <div id="otpBox" style="display:none;">
                    <input type="text" id="otp" maxlength="6" class="form-control mt-3" placeholder="Enter 6 Digit OTP">
                    <button type="button" class="btn btn-success w-100 mt-3" id="verifyOtpBtn">Verify OTP</button>
                    <button type="button" class="btn btn-link w-100" id="resendOtpBtn">Resend OTP</button>
                </div>
                <small id="otpStatus" class="d-block mt-2"></small>
            </div>
        </div>

        <div class="mb-3"><input type="email" class="form-control" name="email" placeholder="Email Address" required></div>
        <div class="mb-3"><input type="date" class="form-control" name="dob" required></div>
        <div class="mb-3"><input type="text" class="form-control" name="city" placeholder="City" required></div>
        <div class="mb-3"><input type="password" class="form-control" name="password" placeholder="Password" required></div>

        <input type="hidden" id="msg91AccessToken" name="msg91_access_token">
        <input type="hidden" id="msg91ReqId" name="msg91_req_id">
        <button type="submit" class="btn-register" id="registerBtn" disabled>Create Candidate Account</button>
    </form>
</div>

<script>
    let msg91ReqId = "";
    
    // VERIFY OTP LOGIC
    document.getElementById("verifyOtpBtn").onclick = function () {
        let otp = document.getElementById("otp").value;
        
        window.verifyOtp(otp, function(data) {
            console.log("Verified:", data);
            document.getElementById("otpStatus").innerHTML = "<span class='text-success'>OTP Verified!</span>";
            document.getElementById("msg91AccessToken").value = data.accessToken || "";
            document.getElementById("msg91ReqId").value = msg91ReqId;
            document.getElementById("registerBtn").disabled = false;
        }, function(error) {
            document.getElementById("otpStatus").innerHTML = "<span class='text-danger'>Invalid OTP.</span>";
        }, msg91ReqId);
    };

    // ... (Keep your existing Send/Resend/Validation scripts) ...
</script>

<script>
    var configuration = {
        widgetId: "36676a676343313137323133",
        tokenAuth: "546033TFUN4xUNi6a436063P1",
        identifier: "",
        exposeMethods: true,
        captchaRenderId: "msg91Captcha",
        success: function(data){ 
            if(data.reqId) msg91ReqId = data.reqId; 
        }
    };
</script>
<script src="https://verify.msg91.com/otp-provider.js" onload="initSendOTP(configuration)"></script>

</body>
</html>
