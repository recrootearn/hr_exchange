<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Candidate Registration - RecrootEarn</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(
        135deg,
        #0057b8,
        #0074e8,
        #39d11f
    );
    font-family:Arial,sans-serif;
}

.card-box{
    width:100%;
    max-width:500px;
    background:white;
    border-radius:25px;
    padding:35px;
    box-shadow:0 20px 50px rgba(0,0,0,.25);
}

.logo{
    text-align:center;
    margin-bottom:15px;
}

.logo img{
    width:220px;
    max-width:100%;
}

.tagline{
    text-align:center;
    color:#6b7280;
    margin-bottom:25px;
}

.title{
    text-align:center;
    font-size:28px;
    font-weight:700;
    margin-bottom:25px;
}

.form-control{
    height:52px;
    border-radius:12px;
}

.btn-register{
    width:100%;
    height:52px;
    border:none;
    border-radius:12px;
    background:linear-gradient(
        135deg,
        #0057b8,
        #0074e8
    );
    color:white;
    font-weight:700;
    margin-top:10px;
}

.login-link{
    text-align:center;
    margin-top:20px;
}

.login-link a{
    text-decoration:none;
    color:#0d63c9;
    font-weight:700;
}

</style>

</head>
<body>

<div class="card-box">

    <div class="logo">
        <img src="{{ url_for('static', filename='images/logo.png') }}">
    </div>

    <div class="tagline">
        Recruit • Connect • Earn
    </div>

    <div class="title">
        Candidate Registration
    </div>

    <form method="POST" enctype="multipart/form-data">

        <div class="mb-3">
            <input
            type="text"
            class="form-control"
            name="full_name"
            placeholder="Full Name"
            required>
        </div>

        <div class="mb-3">
            <input
            type="tel"
            name="mobile"
            class="form-control"
            maxlength="10"
            inputmode="numeric"
            placeholder="Enter Mobile Number"
            required
            oninput="
            this.value=this.value.replace(/[^0-9]/g,'');
            if(this.value.length>0 && !/^[6-9]/.test(this.value)){
                this.value='';
            }
            this.value=this.value.slice(0,10);
            ">

            <small id="mobileStatus"></small>

            <div id="otpSection" class="mt-3">

    <div
    id="msg91Captcha"
    class="mt-3 mb-3 d-flex justify-content-center">
    </div>

    <button
        type="button"
        class="btn btn-primary w-100"
        id="sendOtpBtn">

        Send OTP

    </button>

    <div
        id="otpBox"
        style="display:none;">

        <input
            type="text"
            id="otp"
            maxlength="6"
            class="form-control mt-3"
            placeholder="Enter 6 Digit OTP">

        <button
            type="button"
            class="btn btn-success w-100 mt-3"
            id="verifyOtpBtn">

            Verify OTP

        </button>

        <button
            type="button"
            class="btn btn-link w-100"
            id="resendOtpBtn">

            Resend OTP

        </button>

    </div>

    <small
        id="otpStatus"
        class="d-block mt-2">
    </small>

</div>

        </div>

        <div class="mb-3">
            <input
            type="email"
            class="form-control"
            name="email"
            placeholder="Email Address"
            required>

            <small id="emailStatus"></small>
        </div>

        <div class="mb-3">
            <input
            type="date"
            class="form-control"
            name="dob"
            placeholder="DOB"
            required>
        </div>

        <div class="mb-3">
            <input
            type="text"
            class="form-control"
            name="city"
            placeholder="City"
            required>
        </div>

        <div class="mb-3">

        <label class="form-label">

        Qualification

        </label>

        <select
        class="form-control"
        name="qualification"
        required>

        <option value="">Select Qualification</option>

        <option>10th Pass</option>

        <option>12th Pass</option>

        <option>ITI</option>

        <option>Diploma</option>

        <option>B.A.</option>

        <option>B.Com.</option>

        <option>B.Sc.</option>

        <option>BCA</option>

        <option>BBA</option>

        <option>BE</option>

        <option>B.Tech</option>

        <option>MBBS</option>

        <option>LLB</option>

        <option>M.A.</option>

        <option>M.Com.</option>

        <option>M.Sc.</option>

        <option>MCA</option>

        <option>MBA</option>

        <option>ME</option>

        <option>M.Tech</option>

        <option>PhD</option>

        <option>Other</option>

        </select>

        </div>

        <div class="mb-3">
            <label class="form-label">
                Referral Code (Optional)
        </label>

        <input
            type="text"
            name="referral_code"
            value="{{ referral_code }}"
            class="form-control"
            placeholder="Enter Referral Code">
        </div>

        <div class="mb-3">

        <label class="form-label">

        Profile Photo (Optional)

        </label>

        <input
        type="file"
        class="form-control"
        name="profile_photo"
        accept=".jpg,.jpeg,.png">

        </div>

        <div class="mb-3">
            <input
            type="text"
            class="form-control"
            name="username"
            placeholder="Username"
            style="text-transform:uppercase;"
            oninput="this.value=this.value.toUpperCase().replace(/\s/g,'')"
            required>

            <small id="usernameStatus"></small>
        </div>

        <div class="mb-3">

            <label class="form-label">
            Resume (Optional)
            </label>

            <input
            type="file"
            name="resume_file"
        accept=".pdf,.doc,.docx,.jpg,.jpeg,.png"
            class="form-control">

        </div>

        <div class="mb-3">
            <input
            type="password"
            class="form-control"
            name="password"
            placeholder="Password"
            required>
        </div>

        <input
        type="hidden"
        id="msg91AccessToken"
        name="msg91_access_token">

        <input
        type="hidden"
        id="msg91ReqId"
        name="msg91_req_id">

        <button
        type="submit"
        class="btn-register"
        id="registerBtn"
        disabled>

        Create Candidate Account

        </button>

    </form>

    <div class="login-link">
        Already have an account?
        <a href="/candidate-login">Login</a>
    </div>

</div>

<script>

document.querySelector('[name="username"]').addEventListener('blur', function(){

    fetch('/check-username?username=' + this.value.toUpperCase())

    .then(r => r.json())

    .then(data => {

        const s = document.getElementById('usernameStatus');

        if(data.exists){

            s.innerHTML = '❌ Username already taken';
            s.style.color = 'red';

        }else{

            s.innerHTML = '✅ Username available';
            s.style.color = 'green';

        }

    });

});

document.querySelector('[name="mobile"]').addEventListener('blur', function(){

    fetch('/check-mobile?mobile=' + this.value)

    .then(r => r.json())

    .then(data => {

        const s = document.getElementById('mobileStatus');

        if(data.exists){

            s.innerHTML = '❌ Mobile already registered';
            s.style.color = 'red';

        }else{

            s.innerHTML = '✅ Mobile available';
            s.style.color = 'green';

        }

    });

});

document.querySelector('input[name="email"]').addEventListener('blur', function () {

    fetch('/check-email?email=' + encodeURIComponent(this.value))

    .then(r => r.json())

    .then(data => {

        const s = document.getElementById('emailStatus');

        if(data.exists){

            s.innerHTML = "❌ Email already registered";
            s.style.color = "red";

        }else{

            s.innerHTML = "✅ Email available";
            s.style.color = "green";

        }

    });

});

</script>

<script>
document.querySelector('input[name="mobile"]').addEventListener("input", function () {

    this.value = this.value.replace(/\D/g, "");

    if (this.value.length === 1 && !/[6-9]/.test(this.value)) {
        this.value = "";
    }

    if (this.value.length > 10) {
        this.value = this.value.slice(0, 10);
    }

});
</script>

<script>

let candidateOtpVerified = false;

// ==========================
// SEND OTP
// ==========================

document.getElementById("sendOtpBtn").onclick = function () {

    let mobile = document.querySelector("[name='mobile']").value.trim();

    if (!/^[6-9]\d{9}$/.test(mobile)) {

        document.getElementById("otpStatus").innerHTML =
        "<span class='text-danger'>Enter valid mobile number.</span>";

        return;
    }

    fetch("/check-mobile?mobile=" + mobile)

    .then(r => r.json())

    .then(data => {

        if(data.exists){

            document.getElementById("otpStatus").innerHTML =
            "<span class='text-danger'>Mobile already registered.</span>";

            return;
        }

        if(!window.isCaptchaVerified()){

            document.getElementById("otpStatus").innerHTML =
            "<span class='text-danger'>Please complete captcha.</span>";

            return;
        }

        document.getElementById("otpStatus").innerHTML =
        "<span class='text-primary'>Sending OTP...</span>";

        window.sendOtp(

            "91"+mobile,

            function(response){

                console.log(response);

                msg91ReqId =
                    response.reqId ||
                    response.requestId ||
                    "";

                document.getElementById("msg91ReqId").value =
                    msg91ReqId;

                document.getElementById("otpBox").style.display =
                    "block";

                document.getElementById("otpStatus").innerHTML =
                "<span class='text-success'>OTP Sent Successfully.</span>";

            },

            function(error){

                console.log(error);

                document.getElementById("otpStatus").innerHTML =
                "<span class='text-danger'>Unable to send OTP.</span>";

            }

        );

    });

};



// ==========================
// RESEND OTP
// ==========================

document.getElementById("resendOtpBtn").onclick = function () {

    if(msg91ReqId==""){

        document.getElementById("otpStatus").innerHTML =
        "<span class='text-danger'>Send OTP first.</span>";

        return;

    }

    window.retryOtp(

        null,

        function(data){

            console.log(data);

            document.getElementById("otpStatus").innerHTML =
            "<span class='text-success'>OTP Resent.</span>";

        },

        function(error){

            console.log(error);

            document.getElementById("otpStatus").innerHTML =
            "<span class='text-danger'>Unable to resend OTP.</span>";

        },

        msg91ReqId

    );

};

</script>

<script>

let candidateOtpVerified = false;
let msg91ReqId = "";
let msg91AccessToken = "";

var configuration = {

    widgetId: "36676a676343313137323133",

    tokenAuth: "546033TFUN4xUNi6a436063P1",

    identifier: "",

    exposeMethods: true,

    captchaRenderId: "msg91Captcha",

    success: function(data){

        console.log("MSG91 Success", data);

        window.msg91Data = data;

        if(data.accessToken){
            msg91AccessToken = data.accessToken;
        }

        if(data.reqId){
            msg91ReqId = data.reqId;
        }

        if(data.requestId){
            msg91ReqId = data.requestId;
        }

    },

    failure:function(error){

        console.log("MSG91 Error",error);

        document.getElementById("otpStatus").innerHTML =
        "<span class='text-danger'>MSG91 Initialization Failed</span>";

    }

};

</script>

<script
src="https://verify.msg91.com/otp-provider.js"
onload="initSendOTP(configuration)">
</script>

</body>
</html>
