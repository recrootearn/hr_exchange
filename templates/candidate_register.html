<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Candidate Registration - RecrootEarn</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(
        135deg,
        #0057b8,
        #0074e8,
        #39d11f
    );
    font-family:Arial,sans-serif;
}

.card-box{
    width:100%;
    max-width:500px;
    background:white;
    border-radius:25px;
    padding:35px;
    box-shadow:0 20px 50px rgba(0,0,0,.25);
}

.logo{
    text-align:center;
    margin-bottom:15px;
}

.logo img{
    width:220px;
    max-width:100%;
}

.tagline{
    text-align:center;
    color:#6b7280;
    margin-bottom:25px;
}

.title{
    text-align:center;
    font-size:28px;
    font-weight:700;
    margin-bottom:25px;
}

.form-control{
    height:52px;
    border-radius:12px;
}

.btn-register{
    width:100%;
    height:52px;
    border:none;
    border-radius:12px;
    background:linear-gradient(
        135deg,
        #0057b8,
        #0074e8
    );
    color:white;
    font-weight:700;
    margin-top:10px;
}

.login-link{
    text-align:center;
    margin-top:20px;
}

.login-link a{
    text-decoration:none;
    color:#0d63c9;
    font-weight:700;
}

</style>

</head>
<body>

<div class="card-box">

    <div class="logo">
        <img src="{{ url_for('static', filename='images/logo.png') }}">
    </div>

    <div class="tagline">
        Recruit • Connect • Earn
    </div>

    <div class="title">
        Candidate Registration
    </div>

    <form method="POST" enctype="multipart/form-data">

        <div class="mb-3">
            <input
            type="text"
            class="form-control"
            name="full_name"
            placeholder="Full Name"
            required>
        </div>

        <div class="mb-3">
            <input
            type="tel"
            name="mobile"
            class="form-control"
            maxlength="10"
            inputmode="numeric"
            placeholder="Enter Mobile Number"
            required
            oninput="
            this.value=this.value.replace(/[^0-9]/g,'');
            if(this.value.length>0 && !/^[6-9]/.test(this.value)){
                this.value='';
            }
            this.value=this.value.slice(0,10);
            ">

            <small id="mobileStatus"></small>

            <div id="otpSection" class="mt-3">

    <button
        type="button"
        class="btn btn-primary w-100"
        id="sendOtpBtn">

        Send OTP

    </button>

    <div
        id="otpBox"
        style="display:none;">

        <input
            type="text"
            id="otp"
            maxlength="6"
            class="form-control mt-3"
            placeholder="Enter 6 Digit OTP">

        <button
            type="button"
            class="btn btn-success w-100 mt-3"
            id="verifyOtpBtn">

            Verify OTP

        </button>

        <button
            type="button"
            class="btn btn-link w-100"
            id="resendOtpBtn">

            Resend OTP

        </button>

    </div>

    <small
        id="otpStatus"
        class="d-block mt-2">
    </small>

</div>

        </div>

        <div class="mb-3">
            <input
            type="email"
            class="form-control"
            name="email"
            placeholder="Email Address"
            required>

            <small id="emailStatus"></small>
        </div>

        <div class="mb-3">
            <input
            type="date"
            class="form-control"
            name="dob"
            placeholder="DOB"
            required>
        </div>

        <div class="mb-3">
            <input
            type="text"
            class="form-control"
            name="city"
            placeholder="City"
            required>
        </div>

        <div class="mb-3">

        <label class="form-label">

        Qualification

        </label>

        <select
        class="form-control"
        name="qualification"
        required>

        <option value="">Select Qualification</option>

        <option>10th Pass</option>

        <option>12th Pass</option>

        <option>ITI</option>

        <option>Diploma</option>

        <option>B.A.</option>

        <option>B.Com.</option>

        <option>B.Sc.</option>

        <option>BCA</option>

        <option>BBA</option>

        <option>BE</option>

        <option>B.Tech</option>

        <option>MBBS</option>

        <option>LLB</option>

        <option>M.A.</option>

        <option>M.Com.</option>

        <option>M.Sc.</option>

        <option>MCA</option>

        <option>MBA</option>

        <option>ME</option>

        <option>M.Tech</option>

        <option>PhD</option>

        <option>Other</option>

        </select>

        </div>

        <div class="mb-3">
            <label class="form-label">
                Referral Code (Optional)
        </label>

        <input
            type="text"
            name="referral_code"
            value="{{ referral_code }}"
            class="form-control"
            placeholder="Enter Referral Code">
        </div>

        <div class="mb-3">

        <label class="form-label">

        Profile Photo (Optional)

        </label>

        <input
        type="file"
        class="form-control"
        name="profile_photo"
        accept=".jpg,.jpeg,.png">

        </div>

        <div class="mb-3">
            <input
            type="text"
            class="form-control"
            name="username"
            placeholder="Username"
            style="text-transform:uppercase;"
            oninput="this.value=this.value.toUpperCase().replace(/\s/g,'')"
            required>

            <small id="usernameStatus"></small>
        </div>

        <div class="mb-3">

            <label class="form-label">
            Resume (Optional)
            </label>

            <input
            type="file"
            name="resume_file"
        accept=".pdf,.doc,.docx,.jpg,.jpeg,.png"
            class="form-control">

        </div>

        <div class="mb-3">
            <input
            type="password"
            class="form-control"
            name="password"
            placeholder="Password"
            required>
        </div>

        <button class="btn-register">
            Create Candidate Account
        </button>

    </form>

    <div class="login-link">
        Already have an account?
        <a href="/candidate-login">Login</a>
    </div>

</div>

<script>

document.querySelector('[name="username"]').addEventListener('blur', function(){

    fetch('/check-username?username=' + this.value.toUpperCase())

    .then(r => r.json())

    .then(data => {

        const s = document.getElementById('usernameStatus');

        if(data.exists){

            s.innerHTML = '❌ Username already taken';
            s.style.color = 'red';

        }else{

            s.innerHTML = '✅ Username available';
            s.style.color = 'green';

        }

    });

});

document.querySelector('[name="mobile"]').addEventListener('blur', function(){

    fetch('/check-mobile?mobile=' + this.value)

    .then(r => r.json())

    .then(data => {

        const s = document.getElementById('mobileStatus');

        if(data.exists){

            s.innerHTML = '❌ Mobile already registered';
            s.style.color = 'red';

        }else{

            s.innerHTML = '✅ Mobile available';
            s.style.color = 'green';

        }

    });

});

document.querySelector('input[name="email"]').addEventListener('blur', function () {

    fetch('/check-email?email=' + encodeURIComponent(this.value))

    .then(r => r.json())

    .then(data => {

        const s = document.getElementById('emailStatus');

        if(data.exists){

            s.innerHTML = "❌ Email already registered";
            s.style.color = "red";

        }else{

            s.innerHTML = "✅ Email available";
            s.style.color = "green";

        }

    });

});

</script>

<script>
document.querySelector('input[name="mobile"]').addEventListener("input", function () {

    this.value = this.value.replace(/\D/g, "");

    if (this.value.length === 1 && !/[6-9]/.test(this.value)) {
        this.value = "";
    }

    if (this.value.length > 10) {
        this.value = this.value.slice(0, 10);
    }

});
</script>

<script>

var configuration = {

    widgetId: "36676a676343313137323133",

    tokenAuth: "546033TFUN4xUNi6a436063P1",

    identifier: null,

    exposeMethods: true,

    success: function (data) {

        console.log("MSG91 Success:", data);

        window.msg91Data = data;

    },

    failure: function (error) {

        console.log("MSG91 Error:", error);

    }

};

</script>

<script
src="https://verify.msg91.com/otp-provider.js"
onload="initSendOTP(configuration)">
</script>

<script>

let candidateOtpVerified = false;

// SEND OTP

document.getElementById("sendOtpBtn").onclick = function () {

    let mobile = document.querySelector('[name="mobile"]').value.trim();

    if (!/^[6-9]\d{9}$/.test(mobile)) {

        document.getElementById("otpStatus").innerHTML =
            "<span class='text-danger'>Enter a valid mobile number.</span>";

        return;

    }

    fetch("/check-mobile?mobile=" + mobile)

    .then(r => r.json())

    .then(data => {

        if (data.exists) {

            document.getElementById("otpStatus").innerHTML =
            "<span class='text-danger'>Mobile already registered.</span>";

            return;

        }

        window.sendOtp(

            "91" + mobile,

            function(data){

                console.log("MSG91 SEND OTP", data);

                msg91ReqId =
                    data.reqId ||
                    data.requestId ||
                    "";

                document.getElementById("otpBox").style.display = "block";

                document.getElementById("otpStatus").innerHTML =
                "<span class='text-success'>OTP Sent Successfully.</span>";

            },

            function(error){

                console.log(error);

                document.getElementById("otpStatus").innerHTML =
                "<span class='text-danger'>Unable to send OTP.</span>";

            }

        );

    });

};

// VERIFY OTP

document.getElementById("verifyOtpBtn").onclick = function () {

    let mobile = document.querySelector('[name="mobile"]').value.trim();

    let otp = document.getElementById("otp").value.trim();

    fetch("/candidate-verify-otp", {

        method: "POST",

        headers: {
            "Content-Type": "application/x-www-form-urlencoded"
        },

        body:
            "mobile=" + encodeURIComponent(mobile)
            + "&otp=" + encodeURIComponent(otp)

    })

    .then(r => r.json())

    .then(data => {

        document.getElementById("otpStatus").innerHTML = data.message;

        if (data.success) {

            let candidateOtpVerified = false;

            let msg91ReqId = "";

            let msg91AccessToken = "";

            document.getElementById("verifyOtpBtn").disabled = true;

            document.getElementById("sendOtpBtn").disabled = true;

            document.getElementById("otp").readOnly = true;

        }

    });

};


// RESEND OTP

document.getElementById("resendOtpBtn").onclick = function () {

    let mobile = document.querySelector('[name="mobile"]').value.trim();

    fetch("/candidate-resend-otp", {

        method: "POST",

        headers: {
            "Content-Type": "application/x-www-form-urlencoded"
        },

        body: "mobile=" + encodeURIComponent(mobile)

    })

    .then(r => r.json())

    .then(data => {

        document.getElementById("otpStatus").innerHTML = data.message;

    });

};

</script>

</body>
</html>
