<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
Candidate Registration - RecrootEarn
</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
rel="stylesheet">

<style>

body{

    min-height:100vh;

    display:flex;

    justify-content:center;

    align-items:center;

    background:linear-gradient(
        135deg,
        #0057b8,
        #0074e8,
        #39d11f
    );

    font-family:Arial,sans-serif;

}

.card-box{

    width:100%;

    max-width:500px;

    background:white;

    border-radius:25px;

    padding:35px;

    box-shadow:0 20px 50px rgba(0,0,0,.25);

}

.logo{

    text-align:center;

    margin-bottom:15px;

}

.logo img{

    width:220px;

    max-width:100%;

}

.tagline{

    text-align:center;

    color:#6b7280;

    margin-bottom:25px;

}

.title{

    text-align:center;

    font-size:28px;

    font-weight:700;

    margin-bottom:25px;

}

.form-control{

    height:52px;

    border-radius:12px;

}

.btn-register{

    width:100%;

    height:52px;

    border:none;

    border-radius:12px;

    background:linear-gradient(
        135deg,
        #0057b8,
        #0074e8
    );

    color:white;

    font-weight:700;

    margin-top:10px;

}

.login-link{

    text-align:center;

    margin-top:20px;

}

.login-link a{

    text-decoration:none;

    color:#0d63c9;

    font-weight:700;

}

</style>

</head>

<body>

<div class="card-box">

    <div class="logo">

        <img
        src="{{ url_for('static', filename='images/header_logo.png') }}">

    </div>

    <div class="tagline">

        Recruit • Connect • Earn

    </div>

    <div class="title">

        Candidate Registration

    </div>

    <form
    method="POST">

<div class="mb-3">

    <label class="form-label">
        Mobile Number
    </label>

    <input
        type="tel"
        id="mobile"
        name="mobile"
        class="form-control"
        maxlength="10"
        inputmode="numeric"
        placeholder="Enter Mobile Number"
        required
        oninput="
            this.value=this.value.replace(/[^0-9]/g,'');
            if(this.value.length>0 && !/^[6-9]/.test(this.value)){
                this.value='';
            }
            this.value=this.value.slice(0,10);
        ">

    <button
        type="button"
        id="verifyMobileBtn"
        class="btn btn-primary w-100 mt-3">

        Verify Mobile Number

    </button>

    <small
        id="mobileStatus"
        class="d-block mt-2">
    </small>

    <div
        id="otpStatus"
        class="alert alert-success mt-2"
        style="display:none;">
    </div>

    <input
        type="hidden"
        id="msg91AccessToken"
        name="msg91AccessToken">

    <input
        type="hidden"
        id="mobileVerified"
        value="0">

</div>

<div class="mb-3">

    <label class="form-label">
        Referral Code (Optional)
    </label>

    <input
        type="text"
        name="referral_code"
        value="{{ referral_code }}"
        class="form-control"
        placeholder="Enter Referral Code">

</div>

<div class="mb-3">

    <label class="form-label">
        Password
    </label>

    <input
        type="password"
        class="form-control"
        name="password"
        placeholder="Create Password"
        required>

</div>

<button
    type="submit"
    class="btn-register"
    id="registerBtn"
    disabled>

    Create Candidate Account

</button>

</form>

<div class="login-link">

    Already have an account?

    <a href="/candidate-login">

        Login

    </a>

</div>

</div>

<script>

document
.querySelector('input[name="mobile"]')
.addEventListener("input", function(){

    this.value = this.value.replace(/\D/g, "");

    if(
        this.value.length == 1 &&
        !/[6-9]/.test(this.value)
    ){
        this.value = "";
    }

    if(this.value.length > 10){
        this.value = this.value.slice(0,10);
    }

});

document
.querySelector('input[name="mobile"]')
.addEventListener("blur", function(){

    let mobile = this.value.trim();

    if(mobile.length != 10){
        return;
    }

    fetch("/check-mobile?mobile=" + mobile)

    .then(r => r.json())

    .then(data=>{

        let status =
        document.getElementById("mobileStatus");

        if(data.exists){

            status.innerHTML =
            "❌ Mobile already registered";

            status.style.color = "red";

            document
            .getElementById("verifyMobileBtn")
            .disabled = true;

        }

        else{

            status.innerHTML =
            "✅ Mobile available";

            status.style.color = "green";

            document
            .getElementById("verifyMobileBtn")
            .disabled = false;

        }

    });

});

</script>

<script>

var configuration = {

    widgetId:
    "36676a676343313137323133",

    tokenAuth:
    "546033TFUN4xUNi6a436063P1",

    identifier:"",

    exposeMethods:false,

success: function(data){

    console.log(data);

    document.getElementById("msg91AccessToken").value =
        data.accessToken || data.token || "";

    document.getElementById("mobileVerified").value = "1";

    // SAVE OTP VERIFIED SESSION IN FLASK
    fetch("/candidate-otp-success",{

        method:"POST",

        headers:{
            "Content-Type":"application/json"
        },

        body:JSON.stringify({

            mobile:document.getElementById("mobile").value

        })

    })

    .then(r=>r.json())

    .then(res=>{

        console.log(res);

        document.getElementById("registerBtn").disabled=false;

        document.getElementById("verifyMobileBtn").disabled=true;

        document.getElementById("mobile").readOnly=true;

        document.getElementById("otpStatus").style.display="block";

        document.getElementById("otpStatus").innerHTML=
            "✅ Mobile Number Verified Successfully";

    });

},

failure:function(error){

    console.log(error);

    alert("OTP Verification Failed.");

}

};

</script>

<script src="https://verify.msg91.com/otp-provider.js"></script>

<script>

document.getElementById("verifyMobileBtn").onclick=function(){

    let mobile=document.getElementById("mobile").value.trim();

    if(mobile.length!=10){

        alert("Enter valid mobile number.");

        return;

    }

    fetch("/check-mobile?mobile="+mobile)

    .then(r=>r.json())

    .then(data=>{

        if(data.exists){

            document.getElementById("mobileStatus").innerHTML=
                "❌ Mobile already registered";

            document.getElementById("mobileStatus").style.color="red";

            return;

        }

        document.getElementById("mobileStatus").innerHTML=
            "✅ Mobile available";

        document.getElementById("mobileStatus").style.color="green";

        configuration.identifier="91"+mobile;

        initSendOTP(configuration);

    });

};

</script>

</body>

</html>
