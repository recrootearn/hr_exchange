<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Candidate Registration - RecrootEarn</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(
        135deg,
        #0057b8,
        #0074e8,
        #39d11f
    );
    font-family:Arial,sans-serif;
}

.card-box{
    width:100%;
    max-width:500px;
    background:white;
    border-radius:25px;
    padding:35px;
    box-shadow:0 20px 50px rgba(0,0,0,.25);
}

.logo{
    text-align:center;
    margin-bottom:15px;
}

.logo img{
    width:220px;
    max-width:100%;
}

.tagline{
    text-align:center;
    color:#6b7280;
    margin-bottom:25px;
}

.title{
    text-align:center;
    font-size:28px;
    font-weight:700;
    margin-bottom:25px;
}

.form-control{
    height:52px;
    border-radius:12px;
}

.btn-register{
    width:100%;
    height:52px;
    border:none;
    border-radius:12px;
    background:linear-gradient(
        135deg,
        #0057b8,
        #0074e8
    );
    color:white;
    font-weight:700;
    margin-top:10px;
}

.login-link{
    text-align:center;
    margin-top:20px;
}

.login-link a{
    text-decoration:none;
    color:#0d63c9;
    font-weight:700;
}

</style>

</head>
<body>

<div class="card-box">

    <div class="logo">
        <img src="{{ url_for('static', filename='images/logo.png') }}">
    </div>

    <div class="tagline">
        Recruit • Connect • Earn
    </div>

    <div class="title">
        Candidate Registration
    </div>

    <form method="POST" enctype="multipart/form-data">

        <div class="mb-3">
            <input
            type="text"
            class="form-control"
            name="full_name"
            placeholder="Full Name"
            required>
        </div>

        <div class="mb-3">
            <input
            type="text"
            class="form-control"
            name="mobile"
            placeholder="Mobile Number"
            required>

            <small id="mobileStatus"></small>
        </div>

        <div class="mb-3">
            <input
            type="email"
            class="form-control"
            name="email"
            placeholder="Email Address"
            required>
        </div>

        <div class="mb-3">
            <input
            type="date"
            class="form-control"
            name="dob"
            required>
        </div>

        <div class="mb-3">
            <input
            type="text"
            class="form-control"
            name="city"
            placeholder="City"
            required>
        </div>

        <div class="mb-3">

        <label class="form-label">

        Qualification

        </label>

        <select
        class="form-control"
        name="qualification"
        required>

        <option value="">Select Qualification</option>

        <option>10th Pass</option>

        <option>12th Pass</option>

        <option>ITI</option>

        <option>Diploma</option>

        <option>B.A.</option>

        <option>B.Com.</option>

        <option>B.Sc.</option>

        <option>BCA</option>

        <option>BBA</option>

        <option>BE</option>

        <option>B.Tech</option>

        <option>MBBS</option>

        <option>LLB</option>

        <option>M.A.</option>

        <option>M.Com.</option>

        <option>M.Sc.</option>

        <option>MCA</option>

        <option>MBA</option>

        <option>ME</option>

        <option>M.Tech</option>

        <option>PhD</option>

        <option>Other</option>

        </select>

        </div>

        <div class="mb-3">

        <label class="form-label">

        Profile Photo (Optional)

        </label>

        <input
        type="file"
        class="form-control"
        name="profile_photo"
        accept=".jpg,.jpeg,.png">

        </div>

        <div class="mb-3">
            <input
            type="text"
            class="form-control"
            name="username"
            placeholder="Username"
            required>

            <small id="usernameStatus"></small>
        </div>

        <div class="mb-3">

            <label class="form-label">
            Resume (Optional)
            </label>

            <input
            type="file"
            name="resume_file"
        accept=".pdf,.doc,.docx,.jpg,.jpeg,.png"
            class="form-control">

        </div>

        <div class="mb-3">
            <input
            type="password"
            class="form-control"
            name="password"
            placeholder="Password"
            required>
        </div>

        <button class="btn-register">
            Create Candidate Account
        </button>

    </form>

    <div class="login-link">
        Already have an account?
        <a href="/candidate-login">Login</a>
    </div>

</div>

<script>

document.querySelector('[name="username"]').addEventListener('blur', function(){

    fetch('/check-username?username=' + this.value)

    .then(r => r.json())

    .then(data => {

        const s = document.getElementById('usernameStatus');

        if(data.exists){

            s.innerHTML = '❌ Username already taken';
            s.style.color = 'red';

        }else{

            s.innerHTML = '✅ Username available';
            s.style.color = 'green';

        }

    });

});

document.querySelector('[name="mobile"]').addEventListener('blur', function(){

    fetch('/check-mobile?mobile=' + this.value)

    .then(r => r.json())

    .then(data => {

        const s = document.getElementById('mobileStatus');

        if(data.exists){

            s.innerHTML = '❌ Mobile already registered';
            s.style.color = 'red';

        }else{

            s.innerHTML = '✅ Mobile available';
            s.style.color = 'green';

        }

    });

});

</script>

</body>
</html>
