<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>

Verify Mobile - RecrootEarn

</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
rel="stylesheet">

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

min-height:100vh;

display:flex;

justify-content:center;

align-items:center;

padding:20px;

background:
linear-gradient(
135deg,
#0057b8,
#0074e8,
#39d11f
);

font-family:Arial,sans-serif;

}

.verify-box{

width:100%;

max-width:500px;

background:#fff;

padding:35px;

border-radius:25px;

box-shadow:
0 20px 60px rgba(0,0,0,.25);

}

.logo{

text-align:center;

margin-bottom:15px;

}

.logo img{

width:220px;

max-width:100%;

}

.subtitle{

text-align:center;

color:#6b7280;

margin-bottom:20px;

}

.title{

text-align:center;

font-size:30px;

font-weight:700;

margin-bottom:30px;

color:#111827;

}

.form-label{

font-weight:600;

margin-bottom:8px;

}

.input-box{

position:relative;

}

.input-box i{

position:absolute;

left:18px;

top:50%;

transform:translateY(-50%);

color:#9ca3af;

}

.form-control{

height:54px;

border-radius:14px;

padding-left:48px;

}

.btn-primary{

height:52px;

border-radius:12px;

font-weight:700;

}

.btn-success{

height:52px;

border-radius:12px;

font-weight:700;

}

.btn-link{

text-decoration:none;

}

#otpBox{

display:none;

}

#otpStatus{

display:none;

}

#continueBtn{

display:none;

}

</style>

</head>

<body>

<div class="verify-box">

<div class="logo">

<img
src="{{ url_for('static', filename='images/logo.png') }}">

</div>

<div class="subtitle">

Recruit • Connect • Earn

</div>

<div class="title">

Verify Mobile Number

</div>

<div class="mb-3">

<label class="form-label">

Mobile Number

</label>

<div class="input-box">

<i class="fas fa-phone"></i>

<input
type="tel"
id="mobile"
name="mobile"
class="form-control"
maxlength="10"
inputmode="numeric"
placeholder="Enter Mobile Number"
required
oninput="
this.value=this.value.replace(/[^0-9]/g,'');
if(this.value.length>0 && !/^[6-9]/.test(this.value)){
this.value='';
}
this.value=this.value.slice(0,10);
">

</div>

<small
id="mobileStatus"
class="d-block mt-2">
</small>

</div>

<button
type="button"
id="verifyMobileBtn"
class="btn btn-primary w-100">

Verify Mobile Number

</button>

<div
id="otpStatus"
class="alert alert-success mt-3">

</div>

<input
type="hidden"
id="msg91AccessToken"
name="msg91AccessToken">

<input
type="hidden"
id="mobileVerified"
value="0">

<button
type="button"
id="continueBtn"
class="btn btn-success w-100 mt-3">

Continue Registration

</button>

<div class="text-center mt-4">

Already have an account?

<a
href="/candidate-login"
style="
text-decoration:none;
font-weight:700;
">

Login

</a>

</div>

</div>

<script>

document.querySelector('#mobile').addEventListener('blur', function(){

    fetch('/check-mobile?mobile=' + this.value)

    .then(r => r.json())

    .then(data => {

        const s =
        document.getElementById('mobileStatus');

        if(data.exists){

            s.innerHTML =
            "❌ Mobile already registered";

            s.style.color =
            "red";

            document.getElementById(
            "verifyMobileBtn"
            ).disabled = true;

        }else{

            s.innerHTML =
            "✅ Mobile available";

            s.style.color =
            "green";

            document.getElementById(
            "verifyMobileBtn"
            ).disabled = false;

        }

    });

});

</script>

<script>

var configuration = {

    widgetId: "36676a676343313137323133",

    tokenAuth: "546033TFUN4xUNi6a436063P1",

    identifier: "",

    exposeMethods: false,

    success: function(data){

        console.log("MSG91 SUCCESS", data);

        document.getElementById("msg91AccessToken").value =
            data.accessToken || data.token || "";

        document.getElementById("mobileVerified").value = "1";

        document.getElementById("mobile").readOnly = true;

        document.getElementById("verifyMobileBtn").disabled = true;

        document.getElementById("otpStatus").style.display = "block";

        document.getElementById("otpStatus").className =
            "alert alert-success mt-3";

        document.getElementById("otpStatus").innerHTML =
            "✅ Mobile Number Verified Successfully.";

        document.getElementById("continueBtn").style.display =
            "block";

    },

    failure: function(error){

        console.log(error);

        document.getElementById("otpStatus").style.display =
            "block";

        document.getElementById("otpStatus").className =
            "alert alert-danger mt-3";

        document.getElementById("otpStatus").innerHTML =
            "OTP Verification Failed.";

    }

};

</script>

<script
src="https://verify.msg91.com/otp-provider.js">
</script>

<script>

document.getElementById("verifyMobileBtn").onclick = function(){

    var mobile =
    document.getElementById("mobile").value.trim();

    if(mobile.length != 10){

        alert("Enter valid mobile number.");

        return;

    }

    configuration.identifier = "91" + mobile;

    initSendOTP(configuration);

};

</script>

<script>

document.getElementById("continueBtn").onclick = function(){

    if(document.getElementById("mobileVerified").value != "1"){

        alert("Please verify your mobile number first.");

        return;

    }

    // Save verified mobile in session
    fetch("/candidate-otp-success",{

        method:"POST",

        headers:{
            "Content-Type":"application/json"
        },

        body:JSON.stringify({

            mobile:document.getElementById("mobile").value,

            accessToken:document.getElementById("msg91AccessToken").value

        })

    })

    .then(response => response.json())

    .then(data => {

        if(data.success){

            window.location = "/candidate-register";

        }else{

            alert(data.message || "Unable to continue.");

        }

    })

    .catch(error => {

        console.log(error);

        alert("Server Error.");

    });

};

</script>

</body>

</html>
