<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Withdraw</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-4">

<div class="card shadow">

<div class="card-body">

<h3 class="mb-4">
Withdraw Request
</h3>

<div class="alert alert-info">

Wallet Balance :
<b>
₹{{ "%.2f"|format(candidate.wallet_balance) }}
</b>

<br>

Minimum Withdrawal :
<b>
₹{{ settings.minimum_withdrawal }}
</b>

</div>

<form method="POST">

<div class="mb-3">

<label>
UPI ID
</label>

<input
type="text"
name="upi"
class="form-control"
required>

</div>

<div class="mb-3">

<label>
Amount
</label>

<input
type="number"
name="amount"
class="form-control"
min="{{ settings.minimum_withdrawal }}"
step="1"
required>

</div>

<button
class="btn btn-success w-100">

Submit Withdrawal Request

</button>

</form>

</div>

</div>

</div>

</body>

</html>
