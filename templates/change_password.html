<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>

Create New Password

</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
rel="stylesheet">

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

min-height:100vh;

display:flex;
justify-content:center;
align-items:center;

padding:30px 15px;

background:
linear-gradient(
135deg,
#0057b8,
#0074e8,
#39d11f
);

font-family:Arial,sans-serif;

}

.password-card{

width:100%;
max-width:560px;

background:#fff;

border-radius:32px;

padding:50px 38px;

box-shadow:
0 20px 60px rgba(0,0,0,.25);

animation:fadeIn .4s ease;

}

.logo{

text-align:center;

margin-bottom:22px;

}

.logo img{

width:230px;

max-width:100%;

}

.subtitle{

text-align:center;

font-size:17px;

color:#6b7280;

margin-bottom:28px;

}

.title{

text-align:center;

font-size:44px;

font-weight:800;

line-height:1.2;

color:#111827;

margin-bottom:18px;

}

.desc{

text-align:center;

font-size:20px;

line-height:1.6;

color:#6b7280;

margin-bottom:35px;

}

.input-box{
    position:relative;
}

.left-icon{

    position:absolute;

    left:18px;

    top:50%;

    transform:translateY(-50%);

    color:#94a3b8;

    pointer-events:none;

}

.toggle-password{

    position:absolute;

    right:18px;

    top:50%;

    transform:translateY(-50%);

    cursor:pointer;

    color:#6b7280;

    font-size:18px;

    z-index:10;

}

.form-control{

height:68px;

padding-left:58px;

padding-right:58px;

font-size:20px;

border-radius:18px;

background:#fafafa;

border:1px solid #d1d5db;

}

.form-control:focus{

background:#fff;

border-color:#0074e8;

box-shadow:0 0 0 4px rgba(0,116,232,.15);

}

.save-btn{

width:100%;

height:66px;

border:none;

border-radius:18px;

background:
linear-gradient(
135deg,
#0057b8,
#0074e8
);

font-size:24px;

font-weight:700;

color:#fff;

transition:.25s;

}

.save-btn:hover{

transform:translateY(-2px);

}

@keyframes fadeIn{

from{

opacity:0;

transform:translateY(20px);

}

to{

opacity:1;

transform:translateY(0);

}

}

@media(max-width:768px){

.password-card{

padding:35px 24px;

border-radius:28px;

}

.logo img{

width:190px;

}

.subtitle{

font-size:16px;

}

.title{

font-size:38px;

}

.desc{

font-size:18px;

}

.form-control{

height:64px;

font-size:18px;

}

.save-btn{

height:62px;

font-size:22px;

}

}

</style>

</head>

<body>

<div class="password-card">

<div class="logo">

<img
src="{{ url_for('static', filename='images/logo.png') }}">

</div>

<div class="subtitle">

Recruit • Connect • Earn

</div>

<div class="title">

Create New Password

</div>

<div class="desc">

Your mobile number has been verified successfully.

</div>

<form method="POST">

<div class="input-box">

<i class="fas fa-lock left-icon"></i>

<input
type="password"
name="password"
id="password"
class="form-control"
placeholder="New Password"
required>

<i
id="togglePassword"
class="fas fa-eye toggle-password">
</i>

</div>

<div class="input-box">

<i class="fas fa-lock left-icon"></i>

<input
type="password"
name="confirm_password"
id="confirm_password"
class="form-control"
placeholder="Confirm New Password"
required>

<i
id="toggleConfirmPassword"
class="fas fa-eye toggle-password">
</i>

</div>

<div

id="passwordMessage"

class="text-center mt-2 mb-4"

style="
display:none;
font-size:18px;
font-weight:700;
line-height:1.5;">

</div>

<button

type="submit"

class="save-btn"

id="updateBtn">

Update Password

</button>

</form>

<div
class="text-center mt-4">

<a

href="/login"

style="
text-decoration:none;
font-size:18px;
font-weight:700;
color:#0d63c9;">

<i class="fas fa-arrow-left me-2"></i>

Back to Login

</a>

</div>

<script>

const password =
document.getElementById("password");

const confirmPassword =
document.getElementById("confirm_password");

const message =
document.getElementById("passwordMessage");

const updateBtn =
document.getElementById("updateBtn");

function validatePassword(){

    const pass=password.value.trim();

    const confirm=confirmPassword.value.trim();

    if(pass==="" && confirm===""){

        message.style.display="none";

        updateBtn.disabled=false;

        updateBtn.style.opacity="1";

        updateBtn.style.cursor="pointer";

        return;

    }

    message.style.display="block";

    if(pass.length<6){

        message.innerHTML=
        "❌ Password must be at least 6 characters.";

        message.style.color="#dc3545";

        updateBtn.disabled=true;

        updateBtn.style.opacity=".65";

        updateBtn.style.cursor="not-allowed";

        return;

    }

    if(confirm===""){

        message.innerHTML=
        "⚠️ Please confirm your password.";

        message.style.color="#f59e0b";

        updateBtn.disabled=true;

        updateBtn.style.opacity=".65";

        updateBtn.style.cursor="not-allowed";

        return;

    }

    if(pass!==confirm){

        message.innerHTML=
        "❌ Passwords do not match.";

        message.style.color="#dc3545";

        updateBtn.disabled=true;

        updateBtn.style.opacity=".65";

        updateBtn.style.cursor="not-allowed";

        return;

    }

    message.innerHTML=
    "✅ Passwords match. You can now update your password.";

    message.style.color="#16a34a";

    updateBtn.disabled=false;

    updateBtn.style.opacity="1";

    updateBtn.style.cursor="pointer";

}

password.addEventListener("input",validatePassword);

confirmPassword.addEventListener("input",validatePassword);

</script>

<script>

<script>

document.getElementById("togglePassword").onclick=function(){

    let input=document.getElementById("password");

    if(input.type==="password"){

        input.type="text";

        this.classList.replace("fa-eye","fa-eye-slash");

    }else{

        input.type="password";

        this.classList.replace("fa-eye-slash","fa-eye");

    }

};

document.getElementById("toggleConfirmPassword").onclick=function(){

    let input=document.getElementById("confirm_password");

    if(input.type==="password"){

        input.type="text";

        this.classList.replace("fa-eye","fa-eye-slash");

    }else{

        input.type="password";

        this.classList.replace("fa-eye-slash","fa-eye");

    }

};

</script>

</body>

</html>
