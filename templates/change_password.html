<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>

Change Password

</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
rel="stylesheet">

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

min-height:100vh;

display:flex;

justify-content:center;

align-items:center;

padding:20px;

background:

linear-gradient(
135deg,
#0057b8,
#0074e8,
#39d11f
);

font-family:Arial,sans-serif;

}

.password-card{

width:100%;
max-width:500px;

background:#fff;

border-radius:30px;

padding:45px;

box-shadow:
0 20px 60px rgba(0,0,0,.25);

animation:fadeIn .5s ease;

}

.logo{

text-align:center;

margin-bottom:15px;

}

.logo img{

width:220px;

max-width:100%;

}

.subtitle{

text-align:center;

color:#6b7280;

margin-bottom:25px;

font-size:15px;

}

.title{

text-align:center;

font-size:32px;

font-weight:800;

margin-bottom:10px;

color:#111827;

}

.desc{

text-align:center;

color:#6b7280;

margin-bottom:30px;

}

.input-box{

position:relative;

margin-bottom:20px;

}

.input-box i{

position:absolute;

left:18px;

top:50%;

transform:translateY(-50%);

color:#94a3b8;

}

.form-control{

height:56px;

padding-left:50px;

border-radius:15px;

border:1px solid #d1d5db;

background:#fafafa;

}

.form-control:focus{

border-color:#0074e8;

box-shadow:
0 0 0 4px rgba(0,116,232,.15);

background:#fff;

}

.save-btn{

width:100%;

height:56px;

border:none;

border-radius:15px;

background:

linear-gradient(
135deg,
#0057b8,
#0074e8
);

color:white;

font-size:18px;

font-weight:700;

}

.save-btn:hover{

transform:translateY(-2px);

}

@keyframes fadeIn{

from{

opacity:0;

transform:translateY(20px);

}

to{

opacity:1;

transform:translateY(0);

}

}

@media(max-width:768px){

.password-card{

padding:25px;

border-radius:24px;

}

.logo img{

width:170px;

}

.title{

font-size:28px;

}

}

</style>

</head>

<body>

<div class="password-card">

<div class="logo">

<img
src="{{ url_for('static', filename='images/logo.png') }}">

</div>

<div class="subtitle">

Recruit • Connect • Earn

</div>

<div class="title">

Create New Password

</div>

<div class="desc">

Your mobile number has been verified successfully.

</div>

<form method="POST">

<div class="input-box">

<i class="fas fa-lock"></i>

<input

type="password"

name="password"

id="password"

class="form-control"

placeholder="New Password"

required>

</div>

<div class="input-box">

<i class="fas fa-lock"></i>

<input

type="password"

name="confirm_password"

id="confirm_password"

class="form-control"

placeholder="Confirm New Password"

required>

</div>

<div
id="passwordMessage"
class="mb-3"
style="display:none;font-weight:600;">

</div>

<button

type="submit"

class="save-btn"

id="updateBtn">

Update Password

</button>

</form>

<div
class="text-center mt-4">

<a

href="/login"

style="
text-decoration:none;
font-weight:700;
color:#0d63c9;">

<i class="fas fa-arrow-left"></i>

Back to Login

</a>

</div>

<script>

const password =
document.getElementById("password");

const confirmPassword =
document.getElementById("confirm_password");

const message =
document.getElementById("passwordMessage");

const updateBtn =
document.getElementById("updateBtn");

function validatePassword(){

    let pass=password.value;

    let confirm=confirmPassword.value;

    message.style.display="block";

    if(pass.length===0 && confirm.length===0){

        message.style.display="none";

        updateBtn.disabled=false;

        return;

    }

    if(pass.length<6){

        message.innerHTML=
        "❌ Password must be at least 6 characters.";

        message.style.color="#dc3545";

        updateBtn.disabled=true;

        return;

    }

    if(confirm===""){

        message.innerHTML=
        "⚠️ Confirm your password.";

        message.style.color="#f59e0b";

        updateBtn.disabled=true;

        return;

    }

    if(pass!==confirm){

        message.innerHTML=
        "❌ Passwords do not match.";

        message.style.color="#dc3545";

        updateBtn.disabled=true;

        return;

    }

    message.innerHTML=
    "✅ Passwords match.";

    message.style.color="#16a34a";

    updateBtn.disabled=false;

}

password.addEventListener(
"keyup",
validatePassword
);

confirmPassword.addEventListener(
"keyup",
validatePassword
);

</script>

<script>

function addToggle(inputId){

    const input=document.getElementById(inputId);

    const wrapper=input.parentElement;

    wrapper.style.position="relative";

    const eye=document.createElement("i");

    eye.className="fas fa-eye";

    eye.style.position="absolute";
    eye.style.right="18px";
    eye.style.top="50%";
    eye.style.transform="translateY(-50%)";
    eye.style.cursor="pointer";
    eye.style.color="#6b7280";

    wrapper.appendChild(eye);

    eye.onclick=function(){

        if(input.type==="password"){

            input.type="text";

            eye.className="fas fa-eye-slash";

        }else{

            input.type="password";

            eye.className="fas fa-eye";

        }

    };

}

addToggle("password");

addToggle("confirm_password");

</script>

</body>

</html>
