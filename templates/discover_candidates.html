{% extends "base.html" %}

{% block content %}

<style>
.page-title { font-size:28px; font-weight:700; margin-bottom:20px; }
.search-box { background:white; padding:15px; border-radius:18px; margin-bottom:20px; box-shadow:0 4px 12px rgba(0,0,0,.06); }
.candidate-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:18px; }
.candidate-card { background:white; border-radius:22px; padding:20px; text-align:center; box-shadow:0 4px 15px rgba(0,0,0,.08); }

.discover-tabs { display:flex; gap:10px; margin-bottom:20px; }
.discover-tab { flex:1; border:none; padding:12px; border-radius:12px; background:#e5e7eb; font-weight:600; cursor:pointer; }
.discover-tab.active { background:#2563eb; color:white; }

/* Mobile Fix: Stack buttons vertically */
@media (max-width: 768px) {
    .discover-tabs { flex-direction: column; }
    .discover-tab { width: 100%; padding: 15px; }
}
</style>

<h2 class="page-title">🔍 Discover Candidates</h2>

<div class="discover-tabs">
    <button type="button" class="discover-tab active" onclick="showSection('all', this)">All</button>
    <button type="button" class="discover-tab" onclick="showSection('candidate', this)">Candidates</button>
    <button type="button" class="discover-tab" onclick="showSection('hr', this)">HR Profiles</button>
</div>

<script>
function showSection(type, btn) {
    // Reset buttons
    document.querySelectorAll('.discover-tab').forEach(tab => tab.classList.remove('active'));
    btn.classList.add('active');

    const hrs = document.querySelectorAll('.hr-section');
    const candidates = document.querySelectorAll('.candidate-section');

    // Filtering logic
    hrs.forEach(x => {
        x.style.display = (type === 'all' || type === 'hr') ? 'block' : 'none';
    });

    candidates.forEach(x => {
        x.style.display = (type === 'all' || type === 'candidate') ? 'block' : 'none';
    });
}
</script>

{% endblock %}
