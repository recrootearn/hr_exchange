{% extends "base.html" %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card shadow-sm border-0 rounded-4">
                <div class="card-body p-4 p-md-5">
                    <h2 class="fw-bold mb-4">Edit Profile</h2>
                    
                    <div class="mb-5 bg-light p-3 rounded-3">
                        <div class="d-flex justify-content-between mb-2">
                            <span class="fw-semibold">Profile Completion</span>
                            <span class="fw-bold text-primary">{{ profile_completion }}%</span>
                        </div>
                        <div class="progress" style="height: 10px;">
                            <div class="progress-bar bg-primary" role="progressbar" style="width: {{ profile_completion }}%;"></div>
                        </div>
                        <small class="text-muted mt-2 d-block">Complete your profile to increase recruiter visibility.</small>
                    </div>

                    <form method="POST" enctype="multipart/form-data">
                        <div class="text-center mb-4">
                            {% if candidate.profile_photo %}
                                <img src="{{ url_for('static', filename='uploads/' + candidate.profile_photo) }}" 
                                     class="rounded-circle border border-3 border-white shadow-sm mb-3" width="140" height="140" style="object-fit: cover;">
                            {% endif %}
                            <label class="d-block form-label fw-bold">Update Profile Photo</label>
                            <input type="file" name="profile_photo" class="form-control form-control-sm w-50 mx-auto">
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Full Name</label>
                                <input type="text" name="full_name" class="form-control" value="{{ candidate.full_name }}">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">City</label>
                                <input type="text" name="city" class="form-control" value="{{ candidate.city or '' }}">
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label text-muted">Username</label>
                                <input type="text" class="form-control bg-light" value="{{ candidate.username }}" readonly>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label text-muted">Mobile Number</label>
                                <input type="text" class="form-control bg-light" value="{{ candidate.mobile }}" readonly>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" name="email" class="form-control" value="{{ candidate.email }}">
                        </div>

                        <div class="mb-4">
                            <label class="form-label">Qualification</label>
                            <select name="qualification" class="form-select">
                                {% for qual in ["10th Pass", "12th Pass", "Diploma", "ITI", "B.A.", "B.Com.", "B.Sc.", "BCA", "BBA", "B.Tech", "MBA", "M.Tech", "MCA", "PhD"] %}
                                    <option value="{{ qual }}" {% if candidate.qualification == qual %}selected{% endif %}>{{ qual }}</option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="border-top pt-4 mb-4">
                            <div class="mb-3">
                                <label class="form-label">Career Level</label>
                                <select id="career_level" name="career_level" class="form-select">
                                    <option value="Fresher" {% if candidate.career_level=="Fresher" %}selected{% endif %}>Fresher</option>
                                    <option value="Experienced" {% if candidate.career_level=="Experienced" %}selected{% endif %}>Experienced</option>
                                </select>
                            </div>

                            <div id="experienceBox" class="bg-light p-3 rounded">
                                <div class="row">
                                    <div class="col-md-6 mb-3"><label class="form-label">Company</label><input type="text" name="company_name" class="form-control" value="{{ candidate.company_name or '' }}"></div>
                                    <div class="col-md-6 mb-3"><label class="form-label">Designation</label><input type="text" name="designation" class="form-control" value="{{ candidate.designation or '' }}"></div>
                                </div>
                                <div class="row">
                                    <div class="col-md-6 mb-3"><label class="form-label">From Year</label><input type="text" name="experience_from" class="form-control" value="{{ candidate.experience_from or '' }}"></div>
                                    <div class="col-md-6 mb-3"><label class="form-label">To Year</label><input type="text" name="experience_to" class="form-control" value="{{ candidate.experience_to or '' }}"></div>
                                </div>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Skills</label>
                            <textarea name="skills" class="form-control" rows="3" placeholder="e.g. Python, Sales, Marketing">{{ candidate.skills or '' }}</textarea>
                        </div>

                        <button type="submit" class="btn btn-primary btn-lg w-100 mt-3 shadow-sm">
                            <i class="fas fa-save me-2"></i>Save Profile
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const career = document.getElementById("career_level");
    const box = document.getElementById("experienceBox");
    function toggleExperience() {
        box.style.display = (career.value === "Experienced") ? "block" : "none";
    }
    career.addEventListener("change", toggleExperience);
    toggleExperience();
</script>
{% endblock %}
