{% extends "base.html" %}

{% block content %}

<div class="candidate-card"><h2 class="mb-4">
    Candidate Profile
</h2>

<div class="mb-4">

    <div class="d-flex justify-content-between">

        <strong>

            Profile Completion

        </strong>

        <strong>

            {{ profile_completion }}%

        </strong>

    </div>

    <div class="progress mt-2">

        <div
            class="progress-bar bg-success"
            role="progressbar"
            style="width: {{ profile_completion }}%;">

            {{ profile_completion }}%

        </div>

    </div>

    <small class="text-muted">

        Complete your profile to increase recruiter visibility.

    </small>

</div>

<form method="POST">

    <div class="mb-3">

        <label class="form-label">
            City
        </label>

        <input
            type="text"
            name="city"
            class="form-control"
            placeholder="City"
            value="{{ candidate.city or '' }}">

    </div>

    <div class="mb-3 text-center">

        {% if candidate.profile_photo %}

            <img src="{{ url_for('static', filename='uploads/' + candidate.profile_photo) }}"
                 class="rounded-circle mb-3"
                 width="130"
                 height="130">

        {% endif %}

        <label class="form-label">

            Profile Photo

        </label>

        <input
            type="file"
            name="profile_photo"
            class="form-control">

    </div>

    <div class="mb-3">

        <label>Full Name</label>

        <input
            type="text"
            name="full_name"
            class="form-control"
            value="{{ candidate.full_name }}">

    </div>

    <div class="mb-3">

        <label>Username</label>

        <input
            type="text"
            class="form-control"
            value="{{ candidate.username }}"
            readonly>

    </div>

    <div class="mb-3">

        <label>Mobile Number</label>

        <input
            type="text"
            class="form-control"
            value="{{ candidate.mobile }}"
            readonly>

    </div>

    <div class="mb-3">

        <label>Email</label>

        <input
            type="email"
            name="email"
            class="form-control"
            value="{{ candidate.email }}">

    </div>

    <div class="mb-3">

        <label>Date of Birth</label>

        <input
            type="date"
            name="dob"
            class="form-control"
            value="{{ candidate.dob }}">

    </div>

    <div class="mb-3">

        <label>Qualification</label>

        <select
            name="qualification"
            class="form-control">

            <option value="10th Pass">10th Pass</option>

            <option value="12th Pass">12th Pass</option>

            <option value="Diploma">Diploma</option>

            <option value="ITI">ITI</option>

            <option value="B.A.">B.A.</option>

            <option value="B.Com.">B.Com.</option>

            <option value="B.Sc.">B.Sc.</option>

            <option value="BCA">BCA</option>

            <option value="BBA">BBA</option>

            <option value="B.Tech">B.Tech</option>

            <option value="MBA">MBA</option>

            <option value="M.Tech">M.Tech</option>

            <option value="MCA">MCA</option>

            <option value="PhD">PhD</option>

        </select>

    </div>

    <div class="mb-3">

        <label>Resume</label>

        <input
            type="file"
            name="resume_file"
            class="form-control">

    </div>

    <div class="mb-3">

        <label class="form-label">

            Career Level

        </label>

        <select
            id="career_level"
            name="career_level"
            class="form-control">

            <option value="Fresher"
            {% if candidate.career_level=="Fresher" %}selected{% endif %}>

                Fresher

            </option>

            <option value="Experienced"
            {% if candidate.career_level=="Experienced" %}selected{% endif %}>

                Experienced

            </option>

        </select>

    </div>

    <div id="experienceBox">

    <div class="mb-3">

    <label>

    Company Name

    </label>

    <input
    type="text"
    name="company_name"
    class="form-control"
    value="{{ candidate.company_name or '' }}">

    </div>

    <div class="mb-3">

    <label>

    Designation

    </label>

    <input
    type="text"
    name="designation"
    class="form-control"
    value="{{ candidate.designation or '' }}">

    </div>

    <div class="row">

    <div class="col-md-6">

    <label>

    From Year

    </label>

    <input
    type="text"
    name="experience_from"
    class="form-control"
    value="{{ candidate.experience_from or '' }}">

    </div>

    <div class="col-md-6">

    <label>

    To Year

    </label>

    <input
    type="text"
    name="experience_to"
    class="form-control"
    value="{{ candidate.experience_to or '' }}">

    </div>

    </div>

    </div>

    <div class="mb-3">

        <label class="form-label">
            Skills
        </label>

        <textarea
            name="skills"
            class="form-control"
            rows="4"
            placeholder="Python, Excel, Recruitment, Sales, Marketing...">{{ candidate.skills or '' }}</textarea>

    </div>

    <div class="mb-3">

        <label class="form-label">
            About Me
        </label>

        <textarea
            name="about_me"
            class="form-control"
            rows="5"
            placeholder="Write a short introduction about yourself...">{{ candidate.about_me or '' }}</textarea>

    </div>

    <div class="mb-3">

    <label>

    Education

    </label>

    <textarea
    name="education"
    class="form-control"
    rows="4">{{ candidate.education or '' }}</textarea>

    </div>

    <div class="mb-3">

    <label>

    Interested Fields
    (Max 5)

    </label>

    <select
    multiple
    name="interested_fields"
    class="form-control">

    <option>Healthcare</option>

    <option>IT</option>

    <option>Finance</option>

    <option>Banking</option>

    <option>Education</option>

    <option>Automobile</option>

    <option>Sales</option>

    <option>Marketing</option>

    <option>Human Resources</option>

    <option>Retail</option>

    <option>Manufacturing</option>

    <option>Stock Market</option>

    <option>Advisory</option>

    <option>Customer Support</option>

    <option>Others</option>

    </select>

    </div>

    <button
        type="submit"
        class="btn btn-primary btn-lg">

        <i class="fas fa-save"></i>
        Save Profile

    </button>

    <script>

    const career=document.getElementById("career_level");

    const box=document.getElementById("experienceBox");

    function toggleExperience(){

        if(career.value=="Experienced"){

            box.style.display="block";

        }else{

            box.style.display="none";

        }

    }

    toggleExperience();

    career.addEventListener(
    "change",
    toggleExperience
    );

    </script>

</form>

</div>{% endblock %}
