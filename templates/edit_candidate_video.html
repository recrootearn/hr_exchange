{% extends "base.html" %}
{% block content %}
<div class="container py-4" style="max-width:700px;">
  <div class="card border-0 shadow-sm" style="border-radius:18px;">
    <div class="card-body p-4">
      <h3 class="fw-bold mb-4">Edit Video</h3>
      <form method="POST">
        <div class="mb-3">
          <label class="form-label fw-bold">Caption / Description</label>
          <textarea name="description" class="form-control" rows="4">{{ video.description or '' }}</textarea>
        </div>
        <div class="mb-3">
          <label class="form-label fw-bold">Video Caption</label>
          <textarea name="video_caption" class="form-control" rows="3">{{ video.video_caption or '' }}</textarea>
        </div>
        <div class="mb-3">
          <label class="form-label fw-bold">CTA Type</label>
          <input name="cta_type" class="form-control" value="{{ video.cta_type or '' }}">
        </div>
        <div class="mb-4">
          <label class="form-label fw-bold">CTA URL</label>
          <input name="cta_url" class="form-control" value="{{ video.cta_url or '' }}">
        </div>
        <div class="d-flex gap-2">
          <a href="{{ url_for('candidate_profile') }}" class="btn btn-light flex-fill">Cancel</a>
          <button class="btn btn-primary flex-fill" type="submit">Save Changes</button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
