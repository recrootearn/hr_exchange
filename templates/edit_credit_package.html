{% extends "base.html" %}

{% block content %}

<div class="container">

<div class="card shadow">

<div class="card-header bg-warning">

<h3>

✏ Edit Credit Package

</h3>

</div>

<div class="card-body">

<form method="POST">

<div class="row">

<div class="col-md-6 mb-3">

<label>Package Name</label>

<input
type="text"
name="package_name"
class="form-control"
value="{{ package.package_name }}"
required>

</div>

<div class="col-md-6 mb-3">

<label>Credits</label>

<input
type="number"
name="credits"
class="form-control"
value="{{ package.credits }}"
required>

</div>

<div class="col-md-6 mb-3">

<label>Price (₹)</label>

<input
type="number"
name="price"
class="form-control"
value="{{ package.price }}"
required>

</div>

<div class="col-md-6 mb-3">

<label>Badge</label>

<input
type="text"
name="badge"
class="form-control"
value="{{ package.badge }}">

</div>

<div class="col-md-6 mb-3">

<label>Description</label>

<input
type="text"
name="description"
class="form-control"
value="{{ package.description }}">

</div>

<div class="col-md-6 mb-3">

<label>Display Order</label>

<input
type="number"
name="display_order"
class="form-control"
value="{{ package.display_order }}">

</div>

<div class="col-md-6 mb-3">

<label>Background Color</label>

<input
type="color"
name="color"
class="form-control form-control-color"
value="{{ package.color }}">

</div>

<div class="col-md-6 mb-3">

<label>Status</label>

<select
name="is_active"
class="form-control">

<option value="1"
{% if package.is_active %}selected{% endif %}>
Active
</option>

<option value="0"
{% if not package.is_active %}selected{% endif %}>
Disabled
</option>

</select>

</div>

</div>

<hr>

<button
class="btn btn-warning">

<i class="fas fa-save"></i>

Update Package

</button>

<a
href="/admin-credit-packages"
class="btn btn-secondary">

Cancel

</a>

</form>

</div>

</div>

</div>

{% endblock %}
