<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Edit Job - RecrootEarn</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
rel="stylesheet">

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>

body{
    min-height:100vh;

    background:
    linear-gradient(
        135deg,
        #0057b8,
        #0074e8,
        #39d11f
    );

    display:flex;
    justify-content:center;
    align-items:center;

    padding:30px;

    font-family:Arial,sans-serif;
}

.edit-card{

    width:100%;
    max-width:850px;

    background:white;

    border-radius:30px;

    padding:40px;

    box-shadow:
    0 25px 60px rgba(0,0,0,.25);

}

.logo{
    text-align:center;
    margin-bottom:10px;
}

.logo img{
    width:220px;
}

.subtitle{
    text-align:center;
    color:#6b7280;
    margin-bottom:25px;
}

.page-title{

    text-align:center;

    font-size:34px;

    font-weight:800;

    margin-bottom:30px;

    color:#111827;
}

.form-label{
    font-weight:700;
    margin-bottom:8px;
}

.form-control{

    border-radius:14px;

    min-height:55px;

    border:1px solid #d1d5db;

    padding:12px 16px;
}

textarea.form-control{
    min-height:220px;
}

.form-control:focus{

    border-color:#0074e8;

    box-shadow:
    0 0 0 4px rgba(0,116,232,.15);
}

.btn-save{

    width:100%;

    height:58px;

    border:none;

    border-radius:14px;

    background:
    linear-gradient(
        135deg,
        #0057b8,
        #0074e8
    );

    color:white;

    font-size:18px;

    font-weight:700;

    margin-top:15px;
}

.btn-save:hover{
    transform:translateY(-2px);
}

.back-btn{

    display:inline-block;

    margin-bottom:25px;

    text-decoration:none;

    color:#0057b8;

    font-weight:700;
}

.salary-preview{

    margin-top:10px;

    display:inline-block;

    background:#dcfce7;

    color:#15803d;

    padding:8px 16px;

    border-radius:30px;

    font-weight:700;
}

@media(max-width:768px){

    .edit-card{
        padding:25px;
        border-radius:20px;
    }

    .page-title{
        font-size:28px;
    }

    .logo img{
        width:170px;
    }

}

/* Edge to Edge Mobile Layout */
@media (max-width:768px){

    .container,
    .container-fluid,
    .content,
    .main-content,
    .page-content{
        width:100% !important;
        max-width:100% !important;
        padding-left:0 !important;
        padding-right:0 !important;
        margin:0 !important;
    }

    .post-job-wrapper{
        width:100%;
        max-width:100%;
        margin:0 !important;
        padding:0 !important;
    }

    .post-job-card{
        width:100%;
        border-radius:0;
        box-shadow:none;
        margin:0;
    }

}

</style>

</head>

<body>

<div class="edit-card">

    <a href="/feed" class="back-btn">
        <i class="fas fa-arrow-left"></i>
        Back To Feed
    </a>

    <div class="logo">

        <img
        src="{{ url_for('static', filename='images/logo.png') }}">

    </div>

    <div class="subtitle">
        Recruit • Connect • Earn
    </div>

    <div class="page-title">
        Edit Job Post
    </div>

    <form method="POST">

        <div class="mb-3">

            <label class="form-label">
                Job Title
            </label>

            <input
            type="text"
            name="job_title"
            value="{{ job.job_title }}"
            class="form-control"
            required>

        </div>

        <div class="mb-3">

            <label class="form-label">
                Salary
            </label>

            <input
            type="text"
            name="salary"
            value="{{ job.salary }}"
            class="form-control"
            required>

            <div class="salary-preview">
                ₹ {{ job.salary }}
            </div>

        </div>

        <div class="mb-3">

            <label class="form-label">
                Location
            </label>

            <input
            type="text"
            name="location"
            value="{{ job.location }}"
            class="form-control"
            required>

        </div>

        <div class="mb-3">

            <label class="form-label">
                Job Description
            </label>

            <textarea
            name="description"
            class="form-control"
            required>{{ job.description }}</textarea>

        </div>

        <button
        type="submit"
        class="btn-save">

            <i class="fas fa-save"></i>
            Save Changes

        </button>

    </form>

</div>

</body>

</html>
