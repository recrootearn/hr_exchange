{% extends "base.html" %}

{% block content %}

<div class="container mt-4">

    <div class="card shadow rounded-4">

        <div class="card-body">

            <h2 class="mb-4">
                ✏️ Edit Notification Template
            </h2>

            <form method="POST">

                <div class="mb-3">

                    <label class="form-label">
                        Template Name
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        name="name"
                        value="{{ template.name }}"
                        required>

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Notification Title
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        name="title"
                        value="{{ template.title }}"
                        required>

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Notification Message
                    </label>

                    <textarea
                        class="form-control"
                        rows="6"
                        name="message"
                        required>{{ template.message }}</textarea>

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Audience
                    </label>

                    <select
                        class="form-select"
                        name="audience">

                        <option value="hr"
                            {% if template.audience=="hr" %}selected{% endif %}>
                            HR
                        </option>

                        <option value="candidate"
                            {% if template.audience=="candidate" %}selected{% endif %}>
                            Candidate
                        </option>

                        <option value="both"
                            {% if template.audience=="both" %}selected{% endif %}>
                            Both
                        </option>

                    </select>

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Open Link
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        name="link"
                        value="{{ template.link }}">

                </div>

                <div class="d-flex gap-2">

                    <button
                        type="submit"
                        class="btn btn-success">

                        💾 Update Template

                    </button>

                    <a
                        href="/admin/notification-templates"
                        class="btn btn-secondary">

                        Cancel

                    </a>

                </div>

            </form>

        </div>

    </div>

</div>

{% endblock %}
