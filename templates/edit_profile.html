<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1">

<title>Edit Profile</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

<style>

<body>

<div class="container-fluid py-4">

<div class="row justify-content-center">

<div class="col-xl-7 col-lg-8 col-md-10 col-12">

<div class="card shadow-lg border-0">

<div class="card-body p-lg-5 p-4">

<div class="text-center mb-4">

{% if current_user.profile_photo %}

<img
src="/static/uploads/{{ current_user.profile_photo }}"
class="rounded-circle shadow"
style="
width:110px;
height:110px;
object-fit:cover;
border:4px solid #fff;
">

{% else %}

<img
src="/static/uploads/default.png"
class="rounded-circle shadow"
style="
width:110px;
height:110px;
object-fit:cover;
border:4px solid #fff;
">

{% endif %}

<h2 class="fw-bold mt-3">

Edit Profile

</h2>

<p class="text-light mb-0">

Update your profile information

</p>

</div>

{% if profile_completion %}

<div class="mb-4">

<div class="d-flex justify-content-between">

<span>

Profile Completion

</span>

<strong>

{{ profile_completion }}%

</strong>

</div>

<div
class="progress mt-2"
style="
height:10px;
border-radius:20px;
">

<div
class="progress-bar bg-success"
style="
width:{{ profile_completion }}%;
border-radius:20px;
">

</div>

</div>

</div>

{% endif %}

<form
method="POST"
enctype="multipart/form-data">

<!-- First Name -->

<div class="mb-3">

<label class="form-label">

First Name

</label>

<input
type="text"
name="first_name"
class="form-control"
value="{{ current_user.first_name }}">

</div>

<!-- Last Name -->

<div class="mb-3">

<label class="form-label">

Last Name

</label>

<input
type="text"
name="last_name"
class="form-control"
value="{{ current_user.last_name }}">

</div>

<!-- Mobile -->

<div class="mb-3">

<label class="form-label">

Mobile Number

</label>

<input
type="text"
class="form-control"
value="{{ current_user.mobile }}"
readonly>

</div>

<!-- Email -->

<div class="mb-3">

<label class="form-label">

Email Address

</label>

<input
type="email"
name="email"
class="form-control"
value="{{ current_user.email }}">

</div>

<!-- Company -->

<div class="mb-3">

<label class="form-label">

Company Name

</label>

<input
type="text"
name="company"
class="form-control"
value="{{ current_user.company }}">

</div>

<!-- Company City -->

<div class="mb-3">

<label class="form-label">

Company City

</label>

<input
type="text"
name="company_city"
class="form-control"
value="{{ current_user.company_city }}">

</div>

<!-- Company Address -->

<div class="mb-3">

<label class="form-label">

Full Company Address

</label>

<textarea
name="full_company_address"
class="form-control"
rows="4">{{ current_user.full_company_address }}</textarea>

</div>

<!-- Company Website -->

<div class="mb-3">

<label class="form-label">

Company Website

</label>

<input
type="text"
name="company_website"
class="form-control"
placeholder="https://company.com"
value="{{ current_user.company_website }}">

</div>

<!-- HR Type -->

<div class="mb-4">

<label class="form-label">

HR Type

</label>

<select
name="hr_type"
class="form-select">

<option value="Company HR"
{% if current_user.hr_type=="Company HR" %}
selected
{% endif %}>

Company HR

</option>

<option value="Consultancy HR"
{% if current_user.hr_type=="Consultancy HR" %}
selected
{% endif %}>

Consultancy HR

</option>

</select>

</div>

<!-- Change Profile Photo -->

<div class="mb-4">

<label class="form-label">

Profile Photo

</label>

{% if current_user.profile_photo %}

<div class="text-center mb-3">

<img
src="/static/uploads/{{ current_user.profile_photo }}"
class="rounded-circle shadow"
style="
width:120px;
height:120px;
object-fit:cover;
border:4px solid #ffffff;
">

</div>

{% endif %}

<input
type="file"
name="photo"
class="form-control">

<small class="text-light">

Upload JPG, JPEG or PNG image.

</small>

</div>

<!-- MSME Certificate -->

<div class="mb-4">

<label class="form-label">

MSME Certificate

</label>

{% if current_user.msme_certificate %}

<div class="mb-2">

<a
href="/static/uploads/{{ current_user.msme_certificate }}"
target="_blank"
class="btn btn-success w-100">

View Uploaded MSME Certificate

</a>

</div>

{% endif %}

<input
type="file"
name="msme_certificate"
class="form-control">

</div>

<!-- Gumasta Certificate -->

<div class="mb-4">

<label class="form-label">

Gumasta Certificate

</label>

{% if current_user.gumasta_certificate %}

<div class="mb-2">

<a
href="/static/uploads/{{ current_user.gumasta_certificate }}"
target="_blank"
class="btn btn-primary w-100">

View Uploaded Gumasta Certificate

</a>

</div>

{% endif %}

<input
type="file"
name="gumasta_certificate"
class="form-control">

</div>

<!-- Update Button -->

<button
type="submit"
class="btn-save mt-4">

Update Profile

</button>

</form>

</div>

</div>

</div>

</div>

</div>

<script>

const photoInput =
document.querySelector('input[name="photo"]');

if(photoInput){

photoInput.addEventListener(
'change',
function(e){

let file=e.target.files[0];

if(!file) return;

let reader=new FileReader();

reader.onload=function(event){

let img=new Image();

img.onload=function(){

let canvas=document.createElement("canvas");

let maxSize=800;

let width=img.width;

let height=img.height;

if(width>height){

if(width>maxSize){

height*=maxSize/width;

width=maxSize;

}

}else{

if(height>maxSize){

width*=maxSize/height;

height=maxSize;

}

}

canvas.width=width;

canvas.height=height;

let ctx=canvas.getContext("2d");

ctx.drawImage(

img,

0,

0,

width,

height

);

canvas.toBlob(function(blob){

let compressedFile=new File(

[blob],

file.name,

{

type:"image/jpeg"

}

);

let dt=new DataTransfer();

dt.items.add(compressedFile);

photoInput.files=dt.files;

},

"image/jpeg",

0.8

);

};

img.src=event.target.result;

};

reader.readAsDataURL(file);

});

}

</script>

</body>

</html>

</style>

</head>
