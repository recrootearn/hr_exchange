<!DOCTYPE html>
<html>

<head>

<title>Edit Profile</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
rel="stylesheet">

<style>

body{

    background:
    linear-gradient(
    135deg,
    #0f172a,
    #1e1b4b,
    #581c87
    );

    min-height:100vh;

    display:flex;

    justify-content:center;

    align-items:center;

    padding:40px;

    font-family:Arial;
}

.card{

    width:100%;
    max-width:650px;

    border:none;

    border-radius:30px;

    padding:40px;

    background:rgba(255,255,255,0.1);

    backdrop-filter:blur(20px);

    color:white;
}

.form-control{

    height:55px;

    border-radius:14px;

    margin-bottom:20px;
}

.btn-save{

    width:100%;

    height:60px;

    border:none;

    border-radius:16px;

    background:
    linear-gradient(
    135deg,
    #6366f1,
    #a855f7
    );

    color:white;

    font-size:18px;

    font-weight:700;
}

</style>

</head>

<body>

<div class="card">

    <h1 class="mb-4 text-center">

        Edit Profile

    </h1>

    <form
    method="POST"
    enctype="multipart/form-data">

        <!-- First Name -->

<label class="form-label">First Name</label>

<input
type="text"
class="form-control"
value="{{ current_user.first_name }}"
disabled>

<!-- Last Name -->

<label class="form-label mt-3">Last Name</label>

<input
type="text"
class="form-control"
value="{{ current_user.last_name }}"
disabled>

<!-- Mobile -->

<label class="form-label mt-3">Mobile Number</label>

<input
type="text"
class="form-control"
value="{{ current_user.mobile }}"
disabled>

<!-- Username -->

<label class="form-label mt-3">Username</label>

<input
type="text"
class="form-control"
value="{{ current_user.username }}"
disabled>

<!-- Email -->

<label class="form-label mt-3">Email</label>

<input
type="email"
name="email"
class="form-control"
value="{{ current_user.email }}">

<!-- Company Name -->

<label class="form-label mt-3">Company Name</label>

<input
type="text"
name="company"
class="form-control"
value="{{ current_user.company }}">

<!-- Company City -->

<label class="form-label mt-3">Company City</label>

<input
type="text"
name="company_city"
class="form-control"
value="{{ current_user.company_city }}">

<!-- Full Company Address -->

<label class="form-label mt-3">Full Company Address</label>

<textarea
name="full_company_address"
class="form-control"
rows="4">{{ current_user.full_company_address }}</textarea>

<!-- Company Website -->

<label class="form-label mt-3">Company Website</label>

<input
type="text"
name="company_website"
class="form-control"
value="{{ current_user.company_website }}"
placeholder="https://company.com">

<!-- HR Type -->

<label class="form-label mt-3">HR Type</label>

<select
name="hr_type"
class="form-control">

<option value="Consultancy HR"
{% if current_user.hr_type=="Consultancy HR" %}
selected
{% endif %}>
Consultancy HR
</option>

<option value="Company HR"
{% if current_user.hr_type=="Company HR" %}
selected
{% endif %}>
Company HR
</option>

</select>

<!-- Profile Photo -->

<label class="form-label mt-3">
Change Profile Photo
</label>

<input
type="file"
name="photo"
class="form-control">

<!-- MSME -->

<label class="form-label mt-3">
MSME Certificate
</label>

{% if current_user.msme_certificate %}

<a
href="/static/uploads/{{ current_user.msme_certificate }}"
target="_blank"
class="btn btn-success w-100 mb-3">

View MSME Certificate

</a>

{% else %}

<div class="alert alert-secondary">
Not Uploaded
</div>

{% endif %}

<!-- Gumasta -->

<label class="form-label">
Gumasta Certificate
</label>

{% if current_user.gumasta_certificate %}

<a
href="/static/uploads/{{ current_user.gumasta_certificate }}"
target="_blank"
class="btn btn-primary w-100 mb-3">

View Gumasta Certificate

</a>

{% else %}

<div class="alert alert-secondary">
Not Uploaded
</div>

{% endif %}

<!-- Save -->

<button
type="submit"
class="btn-save">

Update Profile

</button>

<hr>

<a
href="/delete-account"
class="btn btn-danger w-100"
onclick="return confirm('Are you sure you want to permanently delete your account? This action cannot be undone.')">

Delete Account

</a>

</form>

<script>

document.querySelector('input[name="photo"]').addEventListener(
'change',
function(e){

    let file = e.target.files[0];

    if(!file) return;

    let reader = new FileReader();

    reader.onload = function(event){

        let img = new Image();

        img.onload = function(){

            let canvas =
            document.createElement('canvas');

            let maxSize = 800;

            let width = img.width;
            let height = img.height;

            if(width > height){

                if(width > maxSize){
                    height *= maxSize / width;
                    width = maxSize;
                }

            }else{

                if(height > maxSize){
                    width *= maxSize / height;
                    height = maxSize;
                }

            }

            canvas.width = width;
            canvas.height = height;

            let ctx = canvas.getContext('2d');

            ctx.drawImage(
                img,
                0,
                0,
                width,
                height
            );

            canvas.toBlob(function(blob){

                let compressedFile =
                new File(
                    [blob],
                    file.name,
                    {
                        type:'image/jpeg'
                    }
                );

                let dt =
                new DataTransfer();

                dt.items.add(compressedFile);

                document.querySelector(
                    'input[name="photo"]'
                ).files = dt.files;

            },'image/jpeg',0.8);

        };

        img.src = event.target.result;

    };

    reader.readAsDataURL(file);

});

</script>

</body>

</html>
