<!DOCTYPE html>
<html>

<head>

<title>Edit Profile</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
rel="stylesheet">

<style>

body{

    background:
    linear-gradient(
    135deg,
    #0f172a,
    #1e1b4b,
    #581c87
    );

    min-height:100vh;

    display:flex;

    justify-content:center;

    align-items:center;

    padding:40px;

    font-family:Arial;
}

.card{

    width:100%;
    max-width:650px;

    border:none;

    border-radius:30px;

    padding:40px;

    background:rgba(255,255,255,0.1);

    backdrop-filter:blur(20px);

    color:white;
}

.form-control{

    height:55px;

    border-radius:14px;

    margin-bottom:20px;
}

.btn-save{

    width:100%;

    height:60px;

    border:none;

    border-radius:16px;

    background:
    linear-gradient(
    135deg,
    #6366f1,
    #a855f7
    );

    color:white;

    font-size:18px;

    font-weight:700;
}

</style>

</head>

<body>

<div class="card">

    <h1 class="mb-4 text-center">

        Edit Profile

    </h1>

    <form
    method="POST"
    enctype="multipart/form-data">

        <input
        type="text"
        name="first_name"
        class="form-control"
        value="{{ current_user.first_name }}"
        placeholder="First Name">

        <input
        type="text"
        name="last_name"
        class="form-control"
        value="{{ current_user.last_name }}"
        placeholder="Last Name">

        <input
        type="text"
        name="mobile"
        class="form-control"
        value="{{ current_user.mobile }}"
        placeholder="Mobile">

        <input
        type="email"
        name="email"
        class="form-control"
        value="{{ current_user.email }}"
        placeholder="Email">

        <input
        type="text"
        name="company"
        class="form-control"
        value="{{ current_user.company }}"
        placeholder="Company">

        <input
        type="text"
        name="hr_type"
        class="form-control"
        value="{{ current_user.hr_type }}"
        placeholder="HR Type">

        <input
        type="file"
        name="photo"
        class="form-control">

        <button class="btn-save">

            Save Changes

        </button>

    </form>

</div>

<script>

document.querySelector('input[name="photo"]').addEventListener(
'change',
function(e){

    let file = e.target.files[0];

    if(!file) return;

    let reader = new FileReader();

    reader.onload = function(event){

        let img = new Image();

        img.onload = function(){

            let canvas =
            document.createElement('canvas');

            let maxSize = 800;

            let width = img.width;
            let height = img.height;

            if(width > height){

                if(width > maxSize){
                    height *= maxSize / width;
                    width = maxSize;
                }

            }else{

                if(height > maxSize){
                    width *= maxSize / height;
                    height = maxSize;
                }

            }

            canvas.width = width;
            canvas.height = height;

            let ctx = canvas.getContext('2d');

            ctx.drawImage(
                img,
                0,
                0,
                width,
                height
            );

            canvas.toBlob(function(blob){

                let compressedFile =
                new File(
                    [blob],
                    file.name,
                    {
                        type:'image/jpeg'
                    }
                );

                let dt =
                new DataTransfer();

                dt.items.add(compressedFile);

                document.querySelector(
                    'input[name="photo"]'
                ).files = dt.files;

            },'image/jpeg',0.8);

        };

        img.src = event.target.result;

    };

    reader.readAsDataURL(file);

});

</script>

</body>

</html>
