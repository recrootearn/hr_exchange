<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>

Forgot Password

</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
rel="stylesheet">

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>

body{

margin:0;

min-height:100vh;

display:flex;

justify-content:center;

align-items:center;

padding:15px;

background:

linear-gradient(

135deg,

#0057b8,

#0074e8,

#39d11f

);

font-family:Arial,sans-serif;

}

.forgot-card{

width:100%;

max-width:500px;

background:#fff;

border-radius:30px;

padding:40px;

box-shadow:

0 25px 60px rgba(0,0,0,.25);

animation:fadeIn .5s ease;

}

.logo{

text-align:center;

margin-bottom:15px;

}

.logo img{

width:220px;

max-width:100%;

}

.subtitle{

text-align:center;

font-size:15px;

color:#6b7280;

margin-bottom:25px;

font-weight:600;

}

.page-title{

text-align:center;

font-size:32px;

font-weight:800;

color:#111827;

margin-bottom:8px;

}

.page-text{

text-align:center;

color:#6b7280;

margin-bottom:30px;

}

.input-box{

position:relative;

margin-bottom:20px;

}

.input-box i{

position:absolute;

left:18px;

top:50%;

transform:translateY(-50%);

color:#6b7280;

font-size:18px;

}

.input-box input{

width:100%;

height:58px;

border:1px solid #d1d5db;

border-radius:15px;

padding-left:55px;

font-size:16px;

background:#fafafa;

transition:.3s;

}

.input-box input:focus{

outline:none;

border-color:#0074e8;

box-shadow:

0 0 0 4px rgba(0,116,232,.15);

background:#fff;

}

.verify-btn{

width:100%;

height:56px;

border:none;

border-radius:15px;

background:

linear-gradient(

135deg,

#0057b8,

#0074e8

);

color:#fff;

font-size:18px;

font-weight:700;

transition:.3s;

}

.verify-btn:hover{

transform:translateY(-2px);

}

.back-link{

margin-top:22px;

text-align:center;

}

.back-link a{

text-decoration:none;

font-weight:700;

color:#0d63c9;

}

.back-link a:hover{

text-decoration:underline;

}

@keyframes fadeIn{

from{

opacity:0;

transform:translateY(20px);

}

to{

opacity:1;

transform:translateY(0);

}

}

@media(max-width:768px){

.forgot-card{

padding:25px;

border-radius:24px;

}

.logo img{

width:170px;

}

.page-title{

font-size:28px;

}

}

</style>

</head>

<body>

<div class="forgot-card">

<div class="logo">

<img
src="{{ url_for('static', filename='images/logo.png') }}">

</div>

<div class="subtitle">

Recruit • Connect • Earn

</div>

<div class="page-title">

Forgot Password

</div>

<div class="page-text">

Verify your mobile number using OTP to reset your password.

</div>

<form id="forgotForm">

<div class="input-box">

<i class="fas fa-phone"></i>

<input

type="text"

id="mobile"

maxlength="10"

placeholder="Registered Mobile Number"

required>

</div>

<div
id="otpSection"
style="display:none;">

<div class="input-box">

<i class="fas fa-shield-alt"></i>

<input

type="text"

id="otp"

maxlength="6"

placeholder="Enter 6 Digit OTP">

</div>

</div>

<div
id="passwordSection"
style="display:none;">

<div class="input-box">

<i class="fas fa-lock"></i>

<input

type="password"

id="password"

placeholder="New Password">

</div>

<div class="input-box">

<i class="fas fa-lock"></i>

<input

type="password"

id="confirm_password"

placeholder="Confirm New Password">

</div>

</div>

<button

type="button"

id="actionBtn"

class="verify-btn"

onclick="sendOTP()">

Send OTP

</button>

</form>

<div class="back-link">

<a href="/login">

<i class="fas fa-arrow-left"></i>

Back to Login

</a>

</div>

</div>

<script>

function sendOTP(){

let mobile=document.getElementById("mobile").value.trim();

if(mobile.length!=10){

alert("Please enter a valid 10 digit mobile number.");

return;

}

fetch("/send-forgot-otp",{

method:"POST",

headers:{
"Content-Type":"application/x-www-form-urlencoded"
},

body:"mobile="+encodeURIComponent(mobile)

})

.then(res=>res.json())

.then(data=>{

alert(data.message);

if(data.success){

document.getElementById("otpSection").style.display="block";

document.getElementById("mobile").readOnly=true;

document.getElementById("actionBtn").innerHTML="Verify OTP";

document.getElementById("actionBtn").onclick=verifyOTP;

}

})

.catch(()=>{

alert("Something went wrong.");

});

}

function verifyOTP(){

let mobile=document.getElementById("mobile").value.trim();

let otp=document.getElementById("otp").value.trim();

if(otp.length!=6){

alert("Please enter valid OTP.");

return;

}

fetch("/verify-forgot-otp",{

method:"POST",

headers:{
"Content-Type":"application/x-www-form-urlencoded"
},

body:

"mobile="+encodeURIComponent(mobile)+

"&otp="+encodeURIComponent(otp)

})

.then(res=>res.json())

.then(data=>{

alert(data.message);

if(data.success){

document.getElementById("passwordSection").style.display="block";

document.getElementById("otp").readOnly=true;

document.getElementById("actionBtn").innerHTML="Change Password";

document.getElementById("actionBtn").onclick=changePassword;

}

})

.catch(()=>{

alert("Something went wrong.");

});

}

function changePassword(){

let password=document.getElementById("password").value;

let confirm=document.getElementById("confirm_password").value;

if(password.length<6){

alert("Password must be at least 6 characters.");

return;

}

if(password!=confirm){

alert("Passwords do not match.");

return;

}

fetch("/change-password",{

method:"POST",

headers:{
"Content-Type":"application/x-www-form-urlencoded"
},

body:

"password="+encodeURIComponent(password)+

"&confirm_password="+encodeURIComponent(confirm)

})

.then(res=>res.json())

.then(data=>{

alert(data.message);

if(data.success){

window.location="/login";

}

})

.catch(()=>{

alert("Something went wrong.");

});

}

</script>

<script>

const actionBtn=document.getElementById("actionBtn");

function showLoading(text){

actionBtn.disabled=true;

actionBtn.innerHTML=`
<span
class="spinner-border spinner-border-sm me-2">
</span>
${text}
`;

}

function hideLoading(text,func){

actionBtn.disabled=false;

actionBtn.innerHTML=text;

actionBtn.onclick=func;

}

</script>

</body>

</html>
