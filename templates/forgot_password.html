<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
    content="width=device-width, initial-scale=1.0">

    <title>
        Forgot Password - RecrootEarn
    </title>

    <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    rel="stylesheet">

    <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>

body{
    margin:0;
    min-height:100vh;
    overflow-x:hidden;
    background:
    linear-gradient(
    135deg,
    #0f172a,
    #312e81,
    #4c1d95
    );
    font-family:Arial;
    display:flex;
    justify-content:center;
    align-items:center;
}

/* MAIN BOX */

.forgot-box{
    width:500px;
    background:white;
    border-radius:30px;
    padding:50px;
    box-shadow:
    0 25px 60px rgba(0,0,0,0.35);
    animation:fadeIn 1s ease;
    position:relative;
    overflow:hidden;
}

/* GLOW */

.forgot-box::before{
    content:'';
    position:absolute;
    width:200px;
    height:200px;
    background:
    radial-gradient(
    rgba(124,58,237,0.25),
    transparent
    );
    top:-80px;
    right:-80px;
}

/* LOGO */

.logo{
    text-align:center;
    font-size:42px;
    font-weight:900;
    margin-bottom:10px;
    color:#111827;
}

.logo span{
    color:#7c3aed;
}

.logo-sub{
    text-align:center;
    color:#6b7280;
    margin-bottom:40px;
}

/* TITLE */

.page-title{
    text-align:center;
    font-size:34px;
    font-weight:800;
    margin-bottom:40px;
    color:#111827;
}

/* INPUT */

.input-box{
    position:relative;
    margin-bottom:25px;
}

.input-box i{
    position:absolute;
    left:18px;
    top:50%;
    transform:translateY(-50%);
    color:#6b7280;
}

.input-box input{
    width:100%;
    height:65px;
    border-radius:18px;
    border:2px solid #e5e7eb;
    padding-left:55px;
    font-size:16px;
    transition:0.4s;
}

.input-box input:focus{
    outline:none;
    border-color:#7c3aed;
    box-shadow:
    0 0 0 5px rgba(124,58,237,0.12);
}

/* BUTTON */

.verify-btn{
    width:100%;
    height:65px;
    border:none;
    border-radius:18px;
    background:
    linear-gradient(
    135deg,
    #4f46e5,
    #9333ea
    );
    color:white;
    font-size:18px;
    font-weight:800;
    transition:0.4s;
    margin-top:10px;
    box-shadow:
    0 15px 30px rgba(124,58,237,0.3);
}

.verify-btn:hover{
    transform:translateY(-3px);
    box-shadow:
    0 20px 40px rgba(124,58,237,0.45);
}

/* BACK */

.back-link{
    text-align:center;
    margin-top:25px;
}

.back-link a{
    color:#4f46e5;
    text-decoration:none;
    font-weight:700;
}

/* ANIMATION */

@keyframes fadeIn{

    from{
        opacity:0;
        transform:translateY(40px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }

}

</style>

</head>

<body>

<div class="forgot-box">

    <div class="logo">

        RECROOT<span>EARN</span>

    </div>

    <div class="logo-sub">

        Secure Password Recovery

    </div>

    <div class="page-title">

        Forgot Password

    </div>

    <form method="POST">

        <div class="input-box">

            <i class="fas fa-envelope"></i>

            <input
            type="email"
            name="email"
            placeholder="Registered Email"
            required>

        </div>

        <div class="input-box">

            <i class="fas fa-phone"></i>

            <input
            type="text"
            name="mobile"
            placeholder="Registered Mobile Number"
            required>

        </div>

        <button class="verify-btn">

            Verify Account

        </button>

    </form>

    <div class="back-link">

        <a href="/login">

            ← Back to Login

        </a>

    </div>

</div>

</body>

</html>
