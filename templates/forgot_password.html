<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>

Forgot Password

</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
rel="stylesheet">

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

min-height:100vh;

display:flex;

justify-content:center;

align-items:center;

padding:20px;

background:
linear-gradient(
135deg,
#0057b8,
#0074e8,
#39d11f
);

font-family:Arial,sans-serif;

}

.forgot-card{

width:100%;
max-width:520px;

background:#fff;

border-radius:30px;

padding:45px;

box-shadow:
0 20px 60px rgba(0,0,0,.25);

animation:fadeIn .5s ease;

}

.logo{

text-align:center;

margin-bottom:15px;

}

.logo img{

width:220px;

max-width:100%;

}

.subtitle{

text-align:center;

color:#6b7280;

font-size:15px;

margin-bottom:25px;

}

.title{

text-align:center;

font-size:34px;

font-weight:800;

color:#111827;

margin-bottom:10px;

}

.desc{

text-align:center;

color:#6b7280;

margin-bottom:30px;

line-height:1.6;

}

.form-group{

margin-bottom:20px;

}

.form-label{

font-weight:600;

margin-bottom:8px;

color:#111827;

}

.input-box{

position:relative;

}

.input-box i{

position:absolute;

left:18px;

top:50%;

transform:translateY(-50%);

color:#94a3b8;

}

.form-control{

height:56px;

padding-left:50px;

border-radius:15px;

border:1px solid #d1d5db;

background:#fafafa;

font-size:15px;

}

.form-control:focus{

border-color:#0074e8;

box-shadow:
0 0 0 4px rgba(0,116,232,.15);

background:#fff;

outline:none;

}

.verify-btn{

width:100%;

height:56px;

border:none;

border-radius:15px;

background:
linear-gradient(
135deg,
#0057b8,
#0074e8
);

color:#fff;

font-size:18px;

font-weight:700;

margin-top:10px;

}

.verify-btn:hover{

transform:translateY(-2px);

}

#mobileStatus{

font-weight:600;

margin-top:10px;

}

#otpStatus{

display:none;

margin-top:15px;

}

.back-link{

margin-top:25px;

text-align:center;

}

.back-link a{

text-decoration:none;

font-weight:700;

color:#0d63c9;

}

.back-link a:hover{

text-decoration:underline;

}

@keyframes fadeIn{

from{

opacity:0;

transform:translateY(20px);

}

to{

opacity:1;

transform:translateY(0);

}

}

@media(max-width:768px){

.forgot-card{

padding:25px;

border-radius:24px;

}

.logo img{

width:170px;

}

.title{

font-size:28px;

}

}

</style>

</head>

<body>

<div class="forgot-card">

<div class="logo">

<img
src="{{ url_for('static', filename='images/logo.png') }}">

</div>

<div class="subtitle">

Recruit • Connect • Earn

</div>

<div class="title">

Forgot Password

</div>

<div class="desc">

Verify your registered mobile number to continue.

</div>

<form>

<div class="form-group">

<label class="form-label">

Registered Mobile Number

</label>

<div class="input-box">

<i class="fas fa-phone"></i>

<input

type="tel"

id="mobile"

class="form-control"

maxlength="10"

placeholder="Enter Registered Mobile Number"

inputmode="numeric"

oninput="
this.value=this.value.replace(/[^0-9]/g,'');
if(this.value.length>0 && !/^[6-9]/.test(this.value)){
this.value='';
}
this.value=this.value.slice(0,10);
"

required>

</div>

<small
id="mobileStatus">
</small>

<input
type="hidden"
id="msg91AccessToken">

<input
type="hidden"
id="mobileVerified"
value="0">

<div
id="otpStatus"
class="alert alert-success">

</div>

<button

type="button"

id="verifyMobileBtn"

class="verify-btn">

Verify Mobile Number

</button>

</form>

<div class="back-link">

<a href="/login">

<i class="fas fa-arrow-left"></i>

Back to Login

</a>

</div>

</div>

<script>

var configuration={

widgetId:"36676a676343313137323133",

tokenAuth:"546033TFUN4xUNi6a436063P1",

identifier:"",

exposeMethods:false,

success:function(data){

document.getElementById("msg91AccessToken").value=

data.accessToken || data.token || "";

document.getElementById("mobileVerified").value="1";

document.getElementById("verifyMobileBtn").disabled=true;

document.getElementById("mobile").readOnly=true;

document.getElementById("otpStatus").style.display="block";

document.getElementById("otpStatus").innerHTML=

"✅ Mobile Number Verified Successfully";

fetch("/forgot-password-success",{

method:"POST",

headers:{

"Content-Type":"application/json"

},

body:JSON.stringify({

mobile:document.getElementById("mobile").value

})

})

.then(res=>res.json())

.then(data=>{

if(data.success){

setTimeout(function(){

window.location="/change-password";

},1000);

}else{

alert(data.message || "No account found with this mobile number.");

document.getElementById("verifyMobileBtn").disabled=false;

document.getElementById("mobile").readOnly=false;

}

});

},

failure:function(error){

console.log(error);

alert("OTP Verification Failed.");

}

};

</script>

<script
src="https://verify.msg91.com/otp-provider.js">
</script>

<script>

document.getElementById("verifyMobileBtn").onclick=function(){

    var mobile=document.getElementById("mobile").value.trim();

    if(mobile.length!=10){

        alert("Enter valid mobile number.");

        return;

    }

    fetch("/check-forgot-mobile?mobile="+mobile)

    .then(r=>r.json())

    .then(data=>{

        if(!data.exists){

            document.getElementById("mobileStatus").innerHTML=
            "❌ No account found with this mobile number";

            document.getElementById("mobileStatus").style.color="red";

            return;

        }

        document.getElementById("mobileStatus").innerHTML=
        "✅ Mobile number found";

        document.getElementById("mobileStatus").style.color="green";

        configuration.identifier="91"+mobile;

        initSendOTP(configuration);

    })

    .catch(()=>{

        alert("Unable to verify mobile number.");

    });

};

</script>

<script>

document.getElementById("mobile").addEventListener("keypress",function(e){

    if(e.key==="Enter"){

        e.preventDefault();

        document.getElementById("verifyMobileBtn").click();

    }

});

</script>

</body>

</html>
