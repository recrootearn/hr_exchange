<!DOCTYPE html>
<html>
<head>

<title>RecrootEarn</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    background:linear-gradient(135deg,#2563eb,#4f46e5);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:sans-serif;
}

.box{
    width:95%;
    max-width:450px;
    background:white;
    border-radius:25px;
    padding:40px 25px;
    text-align:center;
    box-shadow:0 10px 30px rgba(0,0,0,0.15);
}

.logo{
    width:160px;
    margin-bottom:20px;
}

.title{
    font-size:28px;
    font-weight:700;
    margin-bottom:10px;
}

.subtitle{
    color:#666;
    margin-bottom:35px;
}

.btn-role{
    width:100%;
    padding:16px;
    font-size:18px;
    font-weight:600;
    border-radius:14px;
    margin-bottom:15px;
}

</style>

</head>

<body>

<div class="box">

    <img
    src="/static/logo.png"
    class="logo">

    <div class="title">
        Welcome to RecrootEarn
    </div>

    <div class="subtitle">
        Choose how you want to continue
    </div>

    <a href="/login"
    class="btn btn-primary btn-role">

        Login as HR / Company

    </a>

    <a href="/candidate-login"
    class="btn btn-success btn-role">

        Login as Candidate

    </a>

</div>

</body>
</html>
