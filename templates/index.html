<!DOCTYPE html>
<html lang="en">

<head>

<title>RecrootEarn</title>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;

    background:
    linear-gradient(135deg,#0b5ed7,#2563eb,#4f46e5);

    font-family:'Segoe UI',sans-serif;
}

.box{

    width:100%;
    max-width:460px;

    background:rgba(255,255,255,0.97);

    backdrop-filter:blur(10px);

    border-radius:30px;

    padding:40px 28px;

    text-align:center;

    box-shadow:
    0 15px 40px rgba(0,0,0,0.15);
}

.logo{
    width:220px;
    max-width:100%;
    height:auto;
    margin-bottom:18px;
}

.subtitle{

    font-size:18px;

    color:#6b7280;

    font-weight:500;

    text-align:center;

    margin-bottom:35px;
}

.btn-role{

    width:100%;

    padding:17px;

    border:none;

    border-radius:18px;

    font-size:18px;

    font-weight:700;

    text-decoration:none;

    display:block;

    transition:.25s;
}

.btn-hr{

    background:#0b5ed7;

    color:white;

    box-shadow:
    0 8px 20px rgba(11,94,215,.25);
}

.btn-hr:hover{

    transform:translateY(-2px);

    color:white;

    background:#0952bd;
}

.btn-candidate{

    background:#16a34a;

    color:white;

    margin-top:16px;

    box-shadow:
    0 8px 20px rgba(22,163,74,.25);
}

.btn-candidate:hover{

    transform:translateY(-2px);

    color:white;

    background:#15803d;
}

.footer-text{

    margin-top:28px;

    color:#9ca3af;

    font-size:13px;
}

@media(max-width:768px){

    .box{
        padding:35px 22px;
        border-radius:28px;
    }

    .logo{
        width:200px;
    }

    .subtitle{
        font-size:17px;
    }

    .btn-role{
        font-size:17px;
    }
}

</style>

</head>

<body>

<div class="box">

    <img
    class="logo"
    src="{{ url_for('static', filename='images/logo.png') }}"
    alt="RecrootEarn">

    <div class="subtitle">
        Choose how you want to continue
    </div>

    <a href="/login"
       class="btn-role btn-hr">

       Login as HR / Company

    </a>

    <a href="/candidate-login"
       class="btn-role btn-candidate">

       Login as Candidate

    </a>

    <div class="footer-text">
        Recruit • Connect • Earn
    </div>

</div>

<script>

if (performance.getEntriesByType("navigation")[0].type === "reload") {
    window.location.href = "/splash?next=/home";
}

</script>

</body>

</html>
