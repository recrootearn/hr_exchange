<!DOCTYPE html>
<html lang="en">

<head>

<title>RecrootEarn</title>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
:root{
    --blue:#0b5ed7;
    --blue2:#2563eb;
    --green:#16a34a;
    --ink:#14213d;
    --muted:#667085;
}

*{margin:0;padding:0;box-sizing:border-box;}

html,body{
    min-height:100%;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:18px;
    overflow-x:hidden;
    font-family:Inter,"Segoe UI",Arial,sans-serif;
    background:
        radial-gradient(circle at 12% 15%,rgba(255,255,255,.20),transparent 25%),
        radial-gradient(circle at 88% 85%,rgba(255,255,255,.16),transparent 28%),
        linear-gradient(135deg,#064db7 0%,#0b6fe8 48%,#5146e5 100%);
    position:relative;
}

body::before,
body::after{
    content:"";
    position:fixed;
    border-radius:50%;
    pointer-events:none;
    background:rgba(255,255,255,.08);
}
body::before{
    width:320px;height:320px;
    top:-180px;right:-100px;
}
body::after{
    width:250px;height:250px;
    bottom:-150px;left:-80px;
}

.box{
    width:100%;
    max-width:480px;
    position:relative;
    z-index:1;
    background:rgba(255,255,255,.97);
    border:1px solid rgba(255,255,255,.8);
    border-radius:28px;
    padding:30px 28px 24px;
    text-align:center;
    box-shadow:0 25px 70px rgba(5,24,65,.28);
    animation:cardIn .45s ease-out;
}

@keyframes cardIn{
    from{opacity:0;transform:translateY(12px) scale(.985);}
    to{opacity:1;transform:none;}
}

.logo-wrap{
    width:94px;
    height:94px;
    margin:0 auto 15px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:24px;
    background:#fff;
    box-shadow:0 10px 26px rgba(11,94,215,.13);
}

.logo{
    width:210px;
    max-width:82vw;
    height:auto;
    display:block;
    margin:auto;
}

.welcome{
    font-size:12px;
    font-weight:800;
    text-transform:uppercase;
    letter-spacing:1.4px;
    color:var(--blue);
    margin-bottom:6px;
}

.title{
    color:var(--ink);
    font-size:27px;
    line-height:1.15;
    font-weight:850;
    letter-spacing:-.5px;
    margin-bottom:8px;
}

.subtitle{
    font-size:14px;
    line-height:1.5;
    color:var(--muted);
    font-weight:500;
    margin:0 auto 23px;
    max-width:320px;
}

.role-list{
    display:grid;
    gap:11px;
}

.btn-role{
    width:100%;
    min-height:68px;
    padding:12px 15px;
    border:none;
    border-radius:16px;
    font-size:16px;
    font-weight:800;
    text-decoration:none;
    display:flex;
    align-items:center;
    text-align:left;
    gap:13px;
    transition:transform .18s ease,box-shadow .18s ease,background .18s ease;
}

.btn-role:hover{
    transform:translateY(-2px);
    text-decoration:none;
}

.role-icon{
    width:42px;
    height:42px;
    flex:0 0 42px;
    border-radius:13px;
    display:grid;
    place-items:center;
    font-size:20px;
}

.role-copy{
    flex:1;
    min-width:0;
}

.role-title{
    display:block;
    line-height:1.2;
}

.role-desc{
    display:block;
    font-size:11px;
    font-weight:600;
    opacity:.78;
    margin-top:4px;
}

.role-arrow{
    font-size:20px;
    opacity:.7;
}

.btn-hr,
.btn-candidate{
    background:#fff;
    color:#172033;
    border:1px solid #e2e8f0;
    box-shadow:0 7px 18px rgba(15,23,42,.055);
}

.btn-hr:hover,
.btn-candidate:hover{
    color:#172033;
    background:#fff;
    transform:translateY(-1px);
}

.btn-hr .role-icon{
    background:#eaf2ff;
    color:#0b5ed7;
}

.btn-candidate .role-icon{
    background:#eaf2ff;
    color:#0b5ed7;
}

/* Selected / clicked role */
.btn-hr.active,
.btn-candidate.active{
    background:linear-gradient(135deg,#0b5ed7,#2563eb);
    border-color:#0b5ed7;
    color:#fff;
    box-shadow:0 10px 24px rgba(11,94,215,.24);
    transform:translateY(-1px);
}

.btn-hr.active:hover,
.btn-candidate.active:hover{
    background:linear-gradient(135deg,#0954c4,#1f58d7);
    color:#fff;
}

.btn-hr.active .role-icon,
.btn-candidate.active .role-icon{
    background:rgba(255,255,255,.16);
    color:#fff;
}

.btn-hr.active .role-arrow,
.btn-candidate.active .role-arrow{
    color:#fff;
}

.footer-text{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:9px;
    margin-top:21px;
    padding-top:17px;
    border-top:1px solid #edf0f5;
    color:#98a2b3;
    font-size:11px;
    font-weight:700;
    letter-spacing:.4px;
}

.footer-dot{
    width:4px;height:4px;border-radius:50%;
    background:#c5ccd7;
}

@media(max-width:520px){
    body{padding:10px;}
    .box{
        max-width:100%;
        border-radius:23px;
        padding:25px 17px 20px;
    }
    .logo-wrap{
        width:82px;height:82px;
        border-radius:21px;
        margin-bottom:13px;
    }
    .logo{width:190px;}
    .title{font-size:24px;}
    .subtitle{font-size:13px;margin-bottom:19px;}
    .btn-role{min-height:64px;font-size:15px;border-radius:14px;}
}

@media(max-height:650px){
    .box{padding-top:20px;padding-bottom:17px;}
    .logo-wrap{width:68px;height:68px;margin-bottom:9px;}
    .title{font-size:23px;}
    .subtitle{margin-bottom:15px;}
    .btn-role{min-height:57px;}
    .footer-text{margin-top:14px;padding-top:12px;}
}
</style>

</head>

<body>

<div class="box">

    <div class="logo-wrap">
        <img
        class="logo"
        src="{{ url_for('static', filename='images/header_logo.png') }}"
        alt="RecrootEarn">
    </div>

    <div class="welcome">Welcome to RecrootEarn</div>

    <div class="title">
        How do you want to continue?
    </div>

    <div class="subtitle">
        Choose your account type to continue to the right login.
    </div>

    <div class="role-list">

        <a href="/login" class="btn-role btn-hr">
            <span class="role-icon">🏢</span>
            <span class="role-copy">
                <span class="role-title">Login as Business</span>
                <span class="role-desc">Hire, Build Your Store & Promote</span>
            </span>
            <span class="role-arrow">›</span>
        </a>

        <a href="/candidate-login" class="btn-role btn-candidate">
            <span class="role-icon">👤</span>
            <span class="role-copy">
                <span class="role-title">Login as Candidate</span>
                <span class="role-desc">Find opportunities,build your profile & Shop from store</span>
            </span>
            <span class="role-arrow">›</span>
        </a>

    </div>

    <div class="footer-text">
        <span>Recruit</span>
        <span class="footer-dot"></span>
        <span>Connect</span>
        <span class="footer-dot"></span>
        <span>Earn</span>
    </div>

</div>

<script>
document.querySelectorAll(".btn-role").forEach(function(button){
    button.addEventListener("click", function(){
        document.querySelectorAll(".btn-role").forEach(function(item){
            item.classList.remove("active");
        });
        this.classList.add("active");
    });
});
</script>

<script>

if (performance.getEntriesByType("navigation")[0].type === "reload") {
    window.location.href = "/splash?next=/home";
}

</script>

</body>

</html>
