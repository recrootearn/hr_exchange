{% extends 'base.html' %}

{% block content %}

<style>

.leads-container{
    padding-bottom:100px;
}

.swipe-tabs{
    display:flex;
    gap:14px;
    margin-bottom:20px;
}

.swipe-tabs button{

    border:none;

    padding:14px 24px;

    border-radius:18px;

    font-weight:700;

    background:white;

    box-shadow:0 4px 14px rgba(0,0,0,0.08);

    transition:0.3s;
}

.swipe-tabs button.active-tab{

    background:linear-gradient(
    135deg,
    #2563eb,
    #7c3aed
    );

    color:white;
}

.lead-section{
    display:none;
}

.active-section{
    display:block;
}

</style>

<div class="container-fluid leads-container">

    <!-- TABS -->

    <div class="swipe-tabs">

        <button
        id="locked-tab"
        class="active-tab"
        onclick="showLocked()">

            <i class="fas fa-lock"></i>

            Locked

        </button>

        <button
        id="unlocked-tab"
        onclick="showUnlocked()">

            <i class="fas fa-lock-open"></i>

            Unlocked

        </button>

    </div>

    <!-- LOCKED -->

    <div
    id="locked-section"
    class="lead-section active-section">

        {% include 'locked.html' %}

    </div>

    <!-- UNLOCKED -->

    <div
    id="unlocked-section"
    class="lead-section">

        {% include 'unlocked.html' %}

    </div>

</div>

<script>

function showLocked(){

    document
    .getElementById("locked-section")
    .classList.add("active-section");

    document
    .getElementById("unlocked-section")
    .classList.remove("active-section");

    document
    .getElementById("locked-tab")
    .classList.add("active-tab");

    document
    .getElementById("unlocked-tab")
    .classList.remove("active-tab");

}

function showUnlocked(){

    document
    .getElementById("unlocked-section")
    .classList.add("active-section");

    document
    .getElementById("locked-section")
    .classList.remove("active-section");

    document
    .getElementById("unlocked-tab")
    .classList.add("active-tab");

    document
    .getElementById("locked-tab")
    .classList.remove("active-tab");

}

</script>

{% endblock %}
