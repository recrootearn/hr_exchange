{% extends 'base.html' %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-5">

        <div class="stats-card">

            <h3 class="mb-4 text-center">
                Set New Password
            </h3>

            <form method="POST">

                <div class="mb-3">

                    <label>
                        New Password
                    </label>

                    <input type="password"
                           name="password"
                           class="form-control"
                           required>

                </div>

                <button class="btn btn-primary w-100">

                    Update Password

                </button>

            </form>

        </div>

    </div>

</div>

{% endblock %}
