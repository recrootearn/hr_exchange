<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Buy Credits</title>

<script src="https://checkout.razorpay.com/v1/checkout.js"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{

    background:#f5f6fb;

    display:flex;

    justify-content:center;

    align-items:center;

    min-height:100vh;

    padding:20px;

}

.payment-card{

    width:100%;

    max-width:430px;

    background:#ffffff;

    border-radius:30px;

    padding:30px 20px;

    box-shadow:0 15px 40px rgba(0,0,0,.08);

}

.logo{

    text-align:center;

    font-size:42px;

    font-weight:900;

    color:#111827;

}

.logo span{

    color:#7c3aed;

}

.subtitle{

    text-align:center;

    color:#6b7280;

    margin-top:10px;

    font-size:18px;

}

.amount-card{

    margin-top:30px;

    background:#f8f8fc;

    border-radius:25px;

    padding:35px 20px;

    text-align:center;

}

.amount{

    font-size:70px;

    font-weight:900;

    color:#111827;

}

.credit-text{

    margin-top:10px;

    color:#6b7280;

    font-size:20px;

}

.title{

    margin-top:35px;

    margin-bottom:20px;

    font-size:20px;

    font-weight:700;

    color:#111827;

}

.pay-option{

    display:flex;

    align-items:center;

    gap:18px;

    border:2px solid #e5e7eb;

    border-radius:22px;

    padding:18px;

    margin-bottom:18px;

    cursor:pointer;

    transition:.25s;

    background:white;

}

.pay-option:hover{

    transform:translateY(-2px);

    border-color:#7c3aed;

    box-shadow:0 12px 30px rgba(124,58,237,.12);

}

.pay-option.active{

    border-color:#7c3aed;

    background:#faf5ff;

}

.icon{

    width:60px;

    height:60px;

    border-radius:50%;

    background:#f3f4f6;

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:30px;

    flex-shrink:0;

}

.method-title{

    font-size:18px;

    font-weight:700;

    color:#111827;

}

.method-sub{

    color:#6b7280;

    margin-top:4px;

    font-size:15px;

}

.continue-btn{

    width:100%;

    height:60px;

    border:none;

    border-radius:18px;

    margin-top:20px;

    background:linear-gradient(135deg,#2563eb,#7c3aed);

    color:white;

    font-size:22px;

    font-weight:700;

    cursor:pointer;

    transition:.25s;

}

.continue-btn:hover{

    transform:translateY(-2px);

    box-shadow:0 15px 30px rgba(124,58,237,.30);

}

.secure{

    margin-top:22px;

    text-align:center;

    color:#6b7280;

    font-size:15px;

}

@media(max-width:480px){

.payment-card{

    border-radius:0;

    min-height:100vh;

    padding:25px 18px;

    box-shadow:none;

}

.logo{

    font-size:34px;

}

.amount{

    font-size:58px;

}

.credit-text{

    font-size:18px;

}

.title{

    font-size:18px;

}

.method-title{

    font-size:17px;

}

.method-sub{

    font-size:14px;

}

.icon{

    width:55px;

    height:55px;

    font-size:28px;

}

}

</style>

</head>

<body>

<div class="payment-card">

    <div class="logo">
        RECROOT<span>EARN</span>
    </div>

    <div class="subtitle">
        Secure Credit Purchase
    </div>

    <div class="amount-card">
        <div class="amount">
            ₹{{ amount }}
        </div>

        <div class="credit-text">
            {{ credits }} Credits
        </div>
    </div>

    <div class="title">
        Choose Payment Method
    </div>

    <div class="pay-option active" onclick="selectMethod('upi',this)">

        <div class="icon">🟣</div>

        <div>

            <div class="method-title">
                PhonePe / Google Pay / Paytm
            </div>

            <div class="method-sub">
                Pay instantly using any UPI App
            </div>

        </div>

    </div>

    <div class="pay-option" onclick="selectMethod('card',this)">

        <div class="icon">💳</div>

        <div>

            <div class="method-title">
                Debit / Credit Card
            </div>

            <div class="method-sub">
                Visa • Mastercard • RuPay
            </div>

        </div>

    </div>

    <div class="pay-option" onclick="selectMethod('netbanking',this)">

        <div class="icon">🏦</div>

        <div>

            <div class="method-title">
                Net Banking
            </div>

            <div class="method-sub">
                All major Indian banks
            </div>

        </div>

    </div>

    <button class="continue-btn" id="continueBtn">
        Continue →
    </button>

    <div class="secure">
        🔒 Powered by Razorpay
    </div>

</div>

<script>

let selectedMethod = "upi";

function selectMethod(method, element){

    selectedMethod = method;

    document.querySelectorAll(".pay-option").forEach(function(item){
        item.classList.remove("active");
    });

    element.classList.add("active");
}

var options = {

    key: "{{ razorpay_key }}",

    amount: "{{ order['amount'] }}",

    currency: "INR",

    name: "RecrootEarn",

    description: "Credit Purchase",

    image: "https://recrootearn.com/static/logo.png",

    order_id: "{{ order['id'] }}",

    prefill: {},

    notes: {
        payment_method: selectedMethod
    },

    theme: {
        color: "#7c3aed"
    },

    handler: function (response){

        window.location.href =
            "/payment-success?" +
            "payment_id=" + response.razorpay_payment_id +
            "&order_id=" + response.razorpay_order_id +
            "&signature=" + response.razorpay_signature;
    }
};

document.getElementById("continueBtn").addEventListener("click", function(e){

    e.preventDefault();

    options.notes.payment_method = selectedMethod;

    var rzp = new Razorpay(options);

    rzp.open();

});

</script>

</body>
</html>
