<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Buy Credits</title>

<script src="https://checkout.razorpay.com/v1/checkout.js"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#ffffff;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding:20px;
}

.payment-card{

    width:100%;
    max-width:420px;

    background:#1565C0;

    border-radius:30px;

    padding:35px 25px;

    text-align:center;

    box-shadow:0 15px 40px rgba(0,0,0,.15);
}

.logo{

    display:flex;
    justify-content:center;
    align-items:center;

    font-size:clamp(30px,8vw,46px);

    font-weight:900;

    margin-bottom:20px;

    line-height:1;

    white-space:nowrap;
}

.recroot{
    color:white;
}

.earn{
    color:#22C55E;
}

.subtitle{

    color:#EAF4FF;

    font-size:18px;

    margin-bottom:40px;
}

.amount{

    font-size:clamp(48px,12vw,64px);

    font-weight:900;

    color:white;

    margin-bottom:12px;
}

.credit-text{

    color:#EAF4FF;

    font-size:18px;

    margin-bottom:35px;
}

.pay-btn{

    width:100%;

    height:60px;

    border:none;

    border-radius:16px;

    background:#22C55E;

    color:white;

    font-size:22px;

    font-weight:800;

    cursor:pointer;

    transition:.3s;
}

.pay-btn:hover{

    background:#16A34A;

    transform:translateY(-2px);
}

.secure{

    margin-top:20px;

    color:#EAF4FF;

    font-size:15px;
}

</style>

</head>

<body>

<div class="payment-card">

    <div class="logo">
        <span class="recroot">RECROOT</span><span class="earn">EARN</span>
    </div>

    <div class="subtitle">
        Secure Credit Purchase
    </div>

    <div class="amount">
        ₹{{ amount }}
    </div>

    <div class="credit-text">
        Buy {{ credits }} Credits
    </div>

    <button id="rzp-button" class="pay-btn">
        Pay Securely
    </button>

    <div class="secure">
        🔒 Secured by Razorpay
    </div>

</div>

<script>

var options = {

    "key":"{{ razorpay_key }}",

    "amount":"{{ order['amount'] }}",

    "currency":"INR",

    "name":"RecrootEarn",

    "description":"Credit Purchase",

    "image":"https://recrootearn.com/static/logo.png",

    "order_id":"{{ order['id'] }}",

    "webview_intent":true,

    "config":{
        "display":{
            "blocks":{
                "upi":{
                    "name":"Pay via UPI / GPay / PhonePe",
                    "instruments":[
                        {"method":"upi"}
                    ]
                }
            },
            "sequence":[
                "block.upi",
                "block.banks",
                "block.cards"
            ]
        }
    },

    "handler":function(response){

        window.location.href="/payment-success?"
        +"payment_id="+response.razorpay_payment_id
        +"&order_id="+response.razorpay_order_id
        +"&signature="+response.razorpay_signature;

    },

    "theme":{
        "color":"#1565C0"
    }

};

var rzp1=new Razorpay(options);

document.getElementById("rzp-button").onclick=function(e){

    rzp1.open();

    e.preventDefault();

};

</script>

</body>
</html>
