<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Buy Credits</title>

<script src="https://checkout.razorpay.com/v1/checkout.js"></script>

<style>

body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:
    linear-gradient(
    135deg,
    #0f172a,
    #1e1b4b,
    #581c87
    );
    font-family:Arial;
}

.payment-card{

    width:90%;
    max-width:420px;

    background:white;

    border-radius:30px;

    padding:40px;

    text-align:center;

    box-shadow:
    0 20px 60px rgba(0,0,0,0.3);
}

.logo{

    font-size:36px;
    font-weight:900;
    margin-bottom:10px;
    color:#111827;
}

.logo span{
    color:#7c3aed;
}

.subtitle{
    color:#6b7280;
    margin-bottom:30px;
}

.amount{

    font-size:48px;
    font-weight:900;
    color:#111827;

    margin-bottom:8px;
}

.credit-text{

    color:#6b7280;
    margin-bottom:30px;
}

.pay-btn{

    width:100%;
    height:60px;

    border:none;

    border-radius:18px;

    background:
    linear-gradient(
    135deg,
    #2563eb,
    #7c3aed
    );

    color:white;

    font-size:20px;

    font-weight:800;

    cursor:pointer;

    transition:0.3s;
}

.pay-btn:hover{

    transform:translateY(-3px);

    box-shadow:
    0 15px 35px rgba(124,58,237,0.35);
}

.secure{

    margin-top:18px;
    color:#6b7280;
    font-size:14px;
}

.amount-card{
    background:#f8fafc;
    border-radius:20px;
    padding:20px;
    margin-bottom:25px;
}

.title{
    text-align:left;
    font-size:18px;
    color:#111827;
    margin-bottom:15px;
}

.pay-option{
    display:flex;
    align-items:center;
    gap:15px;
    background:#ffffff;
    border:2px solid #e5e7eb;
    border-radius:18px;
    padding:18px;
    margin-bottom:14px;
    cursor:pointer;
    transition:0.25s;
}

.pay-option:hover{
    border-color:#7c3aed;
    transform:translateY(-2px);
    box-shadow:0 10px 25px rgba(124,58,237,.15);
}

.pay-option.active{
    border-color:#7c3aed;
    background:#f3e8ff;
}

.icon{
    width:52px;
    height:52px;
    border-radius:50%;
    background:#f3f4f6;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:26px;
}

.continue-btn{
    width:100%;
    height:60px;
    margin-top:20px;
    border:none;
    border-radius:18px;
    background:linear-gradient(135deg,#2563eb,#7c3aed);
    color:#fff;
    font-size:20px;
    font-weight:700;
    cursor:pointer;
}

</style>

</head>

<body>

<div class="payment-card">

    <div class="logo">
        RECROOT<span>EARN</span>
    </div>

    <div class="subtitle">
        Secure Credit Purchase
    </div>

    <div class="amount-card">
        <div class="amount">₹{{ amount }}</div>
        <div class="credit-text">
            {{ credits }} Credits
        </div>
    </div>

    <h3 class="title">
        Choose Payment Method
    </h3>

    <div class="pay-option upi" onclick="payUPI()">
        <div class="icon">🟣</div>
        <div>
            <b>PhonePe / Google Pay / Paytm</b><br>
            <small>Pay instantly using any UPI App</small>
        </div>
    </div>

    <div class="pay-option" onclick="payCard()">
        <div class="icon">💳</div>
        <div>
            <b>Debit / Credit Card</b><br>
            <small>Visa • Mastercard • RuPay</small>
        </div>
    </div>

    <div class="pay-option" onclick="payNetbanking()">
        <div class="icon">🏦</div>
        <div>
            <b>Net Banking</b><br>
            <small>All major Indian banks</small>
        </div>
    </div>

    <button class="continue-btn">
        Continue →
    </button>

    <div class="secure">
        🔒 Powered by Razorpay
    </div>

</div>

<script>

var options = {

    "key": "{{ razorpay_key }}",

    "amount": "{{ order['amount'] }}",

    "currency": "INR",

    "name": "RecrootEarn",

    "description": "Credit Purchase",

    "image": "https://recrootearn.com/static/logo.png",

    "order_id": "{{ order['id'] }}",

    "handler": function (response){

        window.location.href =
        "/payment-success?"
        + "payment_id=" + response.razorpay_payment_id
        + "&order_id=" + response.razorpay_order_id
        + "&signature=" + response.razorpay_signature;

    },

    "theme": {
        "color": "#7c3aed"
    }

};

var rzp1 = new Razorpay(options);

document.getElementById('rzp-button').onclick = function(e){

    rzp1.open();

    e.preventDefault();

}

var selectedMethod = "upi";

document.querySelectorAll(".pay-option").forEach(function(item){
    item.addEventListener("click",function(){

        document.querySelectorAll(".pay-option").forEach(function(i){
            i.classList.remove("active");
        });

        this.classList.add("active");

        if(this.innerText.includes("UPI"))
            selectedMethod="upi";

        else if(this.innerText.includes("Card"))
            selectedMethod="card";

        else
            selectedMethod="netbanking";
    });
});

function openPayment(){

    options.method = selectedMethod;

    var rzp = new Razorpay(options);
    rzp.open();
}

document.querySelector(".continue-btn").onclick=function(e){
    openPayment();
    e.preventDefault();
}

</script>

</body>

</html>
