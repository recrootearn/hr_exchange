<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Buy Credits</title>

<script src="https://checkout.razorpay.com/v1/checkout.js"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#ffffff;
    font-family:Arial,Helvetica,sans-serif;
}

.payment-card{

    width:90%;
    max-width:420px;

    background:#1565C0;

    border-radius:30px;

    padding:40px;

    text-align:center;

    box-shadow:0 15px 40px rgba(0,0,0,.15);
}

.logo{

    font-size:40px;
    font-weight:900;
    color:#ffffff;
    margin-bottom:10px;
}

.logo span{
    color:#22C55E;
}

.subtitle{

    color:#EAF4FF;
    margin-bottom:30px;
    font-size:16px;
}

.amount{

    font-size:50px;
    font-weight:900;
    color:#ffffff;
    margin-bottom:8px;
}

.credit-text{

    color:#EAF4FF;
    margin-bottom:30px;
    font-size:18px;
}

.pay-btn{

    width:100%;
    height:60px;

    border:none;

    border-radius:16px;

    background:#22C55E;

    color:#ffffff;

    font-size:20px;

    font-weight:800;

    cursor:pointer;

    transition:.3s;
}

.pay-btn:hover{

    background:#16A34A;

    transform:translateY(-2px);

    box-shadow:0 10px 25px rgba(34,197,94,.35);
}

.secure{

    margin-top:20px;

    color:#EAF4FF;

    font-size:14px;
}

</style>

</head>

<body>

<div class="payment-card">

    <div class="logo">
        RECROOT<span>EARN</span>
    </div>

    <div class="subtitle">
        Secure Credit Purchase
    </div>

    <div class="amount">
        ₹{{ amount }}
    </div>

    <div class="credit-text">
        Buy {{ credits }} Credits
    </div>

    <button
        id="rzp-button"
        class="pay-btn">

        Pay Securely

    </button>

    <div class="secure">
        🔒 Secured by Razorpay
    </div>

</div>

<script>

var options = {

    "key":"{{ razorpay_key }}",

    "amount":"{{ order['amount'] }}",

    "currency":"INR",

    "name":"RecrootEarn",

    "description":"Credit Purchase",

    "image":"https://recrootearn.com/static/logo.png",

    "order_id":"{{ order['id'] }}",

    "webview_intent":true,

    "config":{
        "display":{
            "blocks":{
                "upi":{
                    "name":"Pay via UPI / GPay / PhonePe",
                    "instruments":[
                        {
                            "method":"upi"
                        }
                    ]
                }
            },
            "sequence":[
                "block.upi",
                "block.banks",
                "block.cards"
            ]
        }
    },

    "handler":function(response){

        window.location.href=
        "/payment-success?"
        +"payment_id="+response.razorpay_payment_id
        +"&order_id="+response.razorpay_order_id
        +"&signature="+response.razorpay_signature;
    },

    "theme":{
        "color":"#1565C0"
    }

};

var rzp1=new Razorpay(options);

document.getElementById("rzp-button").onclick=function(e){

    rzp1.open();

    e.preventDefault();

};

</script>

</body>

</html>
