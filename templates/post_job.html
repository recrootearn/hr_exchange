{% extends "base.html" %}

{% block content %}

<style>

.post-job-card{
    max-width:800px;
    margin:auto;
    background:white;
    border-radius:24px;
    padding:30px;
    box-shadow:0 10px 30px rgba(0,0,0,.08);
}

.post-job-title{
    text-align:center;
    font-size:30px;
    font-weight:700;
    margin-bottom:25px;
}

.form-control{
    border-radius:14px !important;
    padding:14px !important;
}

.upload-box{
    border:2px dashed #2563eb;
    border-radius:18px;
    padding:35px;
    text-align:center;
    cursor:pointer;
    transition:.3s;
    color:#2563eb;
    font-weight:600;
}

.upload-box:hover{
    background:#f8fbff;
}

.submit-btn{
    width:100%;
    height:55px;
    border:none;
    border-radius:14px;
    font-weight:700;
    color:white;
    font-size:17px;
    background:linear-gradient(
        135deg,
        #2563eb,
        #4f46e5
    );
}

#preview-container{
    display:flex;
    gap:12px;
    flex-wrap:wrap;
    margin-top:20px;
}

.img-box{
    width:120px;
    height:120px;
    position:relative;
}

.img-box img{
    width:100%;
    height:100%;
    object-fit:cover;
    border-radius:14px;
    border:1px solid #e5e7eb;
}

.remove-btn{
    position:absolute;
    top:-8px;
    right:-8px;
    width:28px;
    height:28px;
    border-radius:50%;
    background:#ef4444;
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    font-weight:bold;
    font-size:16px;
}

.image-count{
    margin-top:10px;
    font-size:14px;
    color:#6b7280;
}

</style><div class="post-job-card"><div class="post-job-title">
    Create Job Post
</div>

<form
    method="POST"
    enctype="multipart/form-data">

    <div class="mb-3">

        <label class="form-label">
            Job Title
        </label>

        <input
            type="text"
            name="job_title"
            class="form-control"
            required>

    </div>

    <div class="mb-3">

        <label class="form-label">
            Location
        </label>

        <input
            type="text"
            name="location"
            class="form-control"
            required>

    </div>

    <div class="mb-3">

        <label class="form-label">
            Salary
        </label>

        <input
            type="text"
            name="salary"
            class="form-control"
            required>

    </div>

    <div class="form-group">
        <label>Incentive (Optional)</label>
        <input type="text" name="incentive" class="form-control" placeholder="Example: ₹500 per joining">
    </div>

    <div class="form-group">
        <label>Job Timing</label>
        <input type="text" name="job_timing" class="form-control" placeholder="10:00 AM - 7:00 PM">
    </div>

    <div class="form-group">
        <label>Working Days</label>

        <select name="working_days" class="form-control" required>

            <option value="">Select Working Days</option>

            <option value="Monday - Friday">
                Monday - Friday
            </option>

            <option value="Monday - Saturday">
                Monday - Saturday
            </option>

            <option value="Flexible Days">
                Flexible Days
            </option>

        </select>

    </div>

    <div class="form-group">

        <label>Job Type</label>

        <select
        name="job_type"
        class="form-control"
        required>

            <option value="">
                Select Job Type
            </option>

            <option value="Work From Office">
                🏢 Work From Office
            </option>

            <option value="Work From Home">
                🏠 Work From Home
            </option>

        </select>

    </div>

    <div class="form-group">

        <label>Employment Type</label>

        <select
        name="employment_type"
        class="form-control"
        required>

            <option value="">
                Select Employment Type
            </option>

            <option value="Full Time">
                Full Time
            </option>

            <option value="Part Time">
                Part Time
            </option>

            <option value="Internship">
                Internship
            </option>

            <option value="Freelance">
                Freelance
            </option>

            <option value="Contract">
                Contract
            </option>

        </select>

    </div>

    <div class="form-group mb-3">

    <label class="fw-bold">
    🎓 Education Required
    </label>

    <select
    name="education"
    class="form-control">

    <option value="">
    Select Education
    </option>

    <option value="10th Pass">
    10th Pass
    </option>

    <option value="12th Pass">
    12th Pass
    </option>

    <option value="Diploma">
    Diploma
    </option>

    <option value="Graduate">
    Graduate
    </option>

    <option value="Post Graduate">
    Post Graduate
    </option>

    <option value="Any Graduate">
    Any Graduate
    </option>

    </select>

    </div>

    <div class="form-group mb-3">

    <label class="fw-bold">
    👤 Gender Preference
    </label>

    <select
    name="gender"
    class="form-control">

    <option value="Both">
    Both
    </option>

    <option value="Male">
    Male
    </option>

    <option value="Female">
    Female
    </option>

    </select>

    </div>

    <div class="form-group">

    <label>Eligibility</label>

    <select
    id="eligibility"
    name="eligibility"
    class="form-control"
    required>

    <option value="">
    Select Eligibility
    </option>

    <option value="Fresher">
    Fresher
    </option>

    <option value="Experience">
    Experience
    </option>

    </select>

    </div>

    <div
    class="form-group"
    id="experience-box"
    style="display:none;">

    <label>Experience Required</label>

    <select
    name="experience_required"
    class="form-control">

    <option value="">
    Select Experience
    </option>

    <option value="Less than 6 Months">
    Less than 6 Months
    </option>

    <option value="More than 6 Months">
    More than 6 Months
    </option>

    </select>

    </div>

    <div class="form-group">
        <label>Interview From Date</label>
        <input type="date" name="interview_from" class="form-control">
    </div>

    <div class="form-group">
        <label>Interview To Date</label>
        <input type="date" name="interview_to" class="form-control">
    </div>

    <div class="form-group">
        <label>Interview Time</label>
        <input type="text" name="interview_time" class="form-control" placeholder="10:00 AM - 4:00 PM">
    </div>

    <div class="form-group">
        <label>Interview Instructions</label>
        <textarea name="interview_instructions" class="form-control" rows="4" placeholder="Carry resume, dress formally, etc."></textarea>
    </div>

    <div class="mb-3">

        <label class="form-label">
            Job Description
        </label>

        <textarea
            name="description"
            rows="6"
            class="form-control"
            required></textarea>

    </div>

    <div class="mb-4">

        <label class="form-label">
            Job Posters / Company Images
        </label>

        <input
            type="file"
            id="images"
            name="images"
            multiple
            accept="image/*"
            hidden>

        <label
            for="images"
            class="upload-box">

            <i class="fas fa-images fa-2x"></i>

            <br><br>

            Click To Upload Multiple Images

        </label>

        <div class="image-count">
            You can upload multiple posters.
        </div>

        <div id="preview-container"></div>

    </div>

    <button
        type="submit"
        class="submit-btn">

        Post Job

    </button>

</form>

</div><script>

const imageInput = document.getElementById("images");

let selectedFiles = [];

imageInput.addEventListener("change", function(){

    Array.from(this.files).forEach(file=>{

        const exists = selectedFiles.some(f=>

            f.name===file.name &&
            f.size===file.size &&
            f.lastModified===file.lastModified

        );

        if(!exists){

            selectedFiles.push(file);

        }

    });

    updateInputFiles();

    renderPreview();

});

function updateInputFiles(){

    const dt = new DataTransfer();

    selectedFiles.forEach(file=>{

        dt.items.add(file);

    });

    imageInput.files = dt.files;

}

function renderPreview(){

    const container =
    document.getElementById("preview-container");

    container.innerHTML="";

    selectedFiles.forEach((file,index)=>{

        const reader = new FileReader();

        reader.onload=function(e){

            container.innerHTML += `

            <div class="img-box">

                <img src="${e.target.result}">

                <span
                    class="remove-btn"
                    onclick="removeImage(${index})">

                    ×

                </span>

            </div>

            `;

        };

        reader.readAsDataURL(file);

    });

}

function removeImage(index){

    selectedFiles.splice(index,1);

    updateInputFiles();

    renderPreview();

}

document
.getElementById("eligibility")
.addEventListener("change", function(){

    if(this.value=="Experience"){

        document.getElementById(
            "experience-box"
        ).style.display="block";

    }else{

        document.getElementById(
            "experience-box"
        ).style.display="none";

    }

});

</script>{% endblock %}
