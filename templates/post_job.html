{% extends "base.html" %}

{% block content %}

<style>

.post-job-card{
    max-width:800px;
    margin:auto;
    background:white;
    border-radius:24px;
    padding:30px;
    box-shadow:0 10px 30px rgba(0,0,0,.08);
}

.post-job-title{
    text-align:center;
    font-size:30px;
    font-weight:700;
    margin-bottom:25px;
}

.form-control{
    border-radius:14px !important;
    padding:14px !important;
}

.upload-box{
    border:2px dashed #2563eb;
    border-radius:18px;
    padding:35px;
    text-align:center;
    cursor:pointer;
    transition:.3s;
    color:#2563eb;
    font-weight:600;
}

.upload-box:hover{
    background:#f8fbff;
}

.submit-btn{
    width:100%;
    height:55px;
    border:none;
    border-radius:14px;
    font-weight:700;
    color:white;
    font-size:17px;
    background:linear-gradient(
        135deg,
        #2563eb,
        #4f46e5
    );
}

#preview-container{
    display:flex;
    gap:12px;
    flex-wrap:wrap;
    margin-top:20px;
}

.img-box{
    width:120px;
    height:120px;
    position:relative;
}

.img-box img{
    width:100%;
    height:100%;
    object-fit:cover;
    border-radius:14px;
    border:1px solid #e5e7eb;
}

.remove-btn{
    position:absolute;
    top:-8px;
    right:-8px;
    width:28px;
    height:28px;
    border-radius:50%;
    background:#ef4444;
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    font-weight:bold;
    font-size:16px;
}

.image-count{
    margin-top:10px;
    font-size:14px;
    color:#6b7280;
}

</style><div class="post-job-card"><div class="post-job-title">
    🚀 Create Job Post
</div>

<form
    method="POST"
    enctype="multipart/form-data">

    <div class="mb-3">

        <label class="form-label">
            Job Title
        </label>

        <input
            type="text"
            name="job_title"
            class="form-control"
            required>

    </div>

    <div class="mb-3">

        <label class="form-label">
            Location
        </label>

        <input
            type="text"
            name="location"
            class="form-control"
            required>

    </div>

    <div class="mb-3">

        <label class="form-label">
            Salary
        </label>

        <input
            type="text"
            name="salary"
            class="form-control"
            required>

    </div>

    <div class="mb-3">

        <label class="form-label">
            Job Description
        </label>

        <textarea
            name="description"
            rows="6"
            class="form-control"
            required></textarea>

    </div>

    <div class="mb-4">

        <label class="form-label">
            Job Posters / Company Images
        </label>

        <input
            type="file"
            id="images"
            name="images"
            multiple
            accept="image/*"
            hidden>

        <label
            for="images"
            class="upload-box">

            <i class="fas fa-images fa-2x"></i>

            <br><br>

            Click To Upload Multiple Images

        </label>

        <div class="image-count">
            You can upload multiple posters.
        </div>

        <div id="preview-container"></div>

    </div>

    <button
        type="submit"
        class="submit-btn">

        Post Job

    </button>

</form>

</div><script>

let selectedFiles=[];

document
.getElementById('images')
.addEventListener('change',function(e){

    selectedFiles=[
        ...selectedFiles,
        ...e.target.files
    ];

    renderPreview();

});

function renderPreview(){

    let container=
    document.getElementById(
        'preview-container'
    );

    container.innerHTML='';

    selectedFiles.forEach((file,index)=>{

        let reader=new FileReader();

        reader.onload=function(ev){

            container.innerHTML += `

            <div class="img-box">

                <img src="${ev.target.result}">

                <span
                    class="remove-btn"
                    onclick="removeImage(${index})">

                    ×

                </span>

            </div>

            `;

        };

        reader.readAsDataURL(file);

    });

}

function removeImage(index){

    selectedFiles.splice(index,1);

    renderPreview();

}

</script>{% endblock %}
