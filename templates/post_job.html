            name="location"
            class="form-control"
            required>

            <option value="">
                Select City
            </option>

            <option>Indore</option>
            <option>Bhopal</option>
            <option>Jabalpur</option>
            <option>Gwalior</option>
            <option>Ujjain</option>
            <option>Katni</option>
            <option>Satna</option>
            <option>Rewa</option>
            <option>Sagar</option>
            <option>Dewas</option>
            <option>Ratlam</option>
            <option>Khandwa</option>
            <option>Burhanpur</option>
            <option>Chhindwara</option>
            <option>Delhi</option>
            <option>Mumbai</option>
            <option>Pune</option>
            <option>Ahmedabad</option>
            <option>Surat</option>
            <option>Jaipur</option>
            <option>Lucknow</option>
            <option>Kanpur</option>
            <option>Patna</option>
            <option>Ranchi</option>
            <option>Raipur</option>
            <option>Hyderabad</option>
            <option>Bengaluru</option>
            <option>Chennai</option>
            <option>Kolkata</option>

        </select>

    </div>

    <div class="col-md-6 mb-3">

        <label class="form-label">
            🏢 Office Address
        </label>

        <input
            type="text"
            name="office_address"
            class="form-control"
            placeholder="Example: Vijay Nagar, Scheme 54">

    </div>

</div>

<div class="row">

    <div class="col-md-6 mb-3">

        <label class="form-label">
            💰 Salary
        </label>

        <input
            type="text"
            name="salary"
            class="form-control"
            placeholder="Example: ₹20,000"
            required>

    </div>

    <div class="col-md-6 mb-3">

        <label class="form-label">
            🎁 Incentive (Optional)
        </label>

        <input
            type="text"
            name="incentive"
            class="form-control"
            placeholder="Example: ₹500 per joining">

    </div>

</div>

<div class="row">

    <div class="col-md-6 mb-3">

        <label class="form-label">
            🕘 Working From
        </label>

        <input

            class="form-control"
            required>

    </div>

    <div class="col-md-6 mb-3">

        <label class="form-label">
            🕕 Working To
        </label>

        <input
            type="time"
            name="working_to"
            class="form-control"
            required>

</div>

<div class="row">

</div>

<div class="mb-3">

        💼 Employment Type

    <select
        name="employment_type"
        class="form-control"
        required>

        <option value="">

        </option>

        <option value="Full Time">
            Full Time
        </option>

        <option value="Part Time">
            Part Time
        </option>

        <option value="Internship">
            Internship
        </option>

        <option value="Freelance">
            Freelance
        </option>

        <option value="Contract">
            Contract
        </option>

<div class="row">

    <div class="col-md-6 mb-3">

        <label class="form-label">
            🎓 Education Required

            name="education"

            </option>

            <option value="Graduate">
                Graduate

            <option value="Any Graduate">

<h5 class="mb-3">

📅 Interview Details

</h5>

            Interview From Date

            type="date"
            name="interview_from"
            class="form-control">

    </div>

    <div class="col-md-6 mb-3">

        <label class="form-label">
            Interview To Date
        </label>

        <input
            type="date"
            name="interview_to"
            class="form-control">

    </div>

</div>

<div class="row">

    <div class="col-md-6 mb-3">

        <label class="form-label">
            🕘 Interview From Time
        </label>

        <input
            type="time"
            name="interview_time_from"
            class="form-control">

    </div>

    <div class="col-md-6 mb-3">

        <label class="form-label">
            🕕 Interview To Time
        </label>

        <input
            type="time"
            name="interview_time_to"
            class="form-control">

    </div>

</div>

<div class="mb-4">

    <label class="form-label">
        📝 Interview Instructions
    </label>

    <textarea
        name="interview_instructions"
        rows="4"
        class="form-control"
        placeholder="Example: Carry Resume, Aadhaar Card, Formal Dress"></textarea>

</div>

<div class="mb-3">

    <label class="form-label">
        📝 Job Description
    </label>

    <textarea
        name="description"
        rows="6"
        class="form-control"
        placeholder="Describe job role, responsibilities, benefits and requirements..."
        required></textarea>

</div>

<div class="mb-4">

    <label class="form-label">
        🖼 Job Posters / Company Images
    </label>

    <input
        type="file"
        id="images"
        name="images"
        multiple
        accept="image/*"
        hidden>

    <label
        for="images"
        class="upload-box">

        <i class="fas fa-images fa-2x"></i>

        <br><br>

        Click To Upload Multiple Images

    </label>

    <div class="image-count">

        Upload multiple images if required.

    </div>

    <div id="preview-container"></div>

</div>

<button
    type="submit"
    class="submit-btn">

    🚀 Post Job

</button>

</form>

</div>

<script src="https://cdn.jsdelivr.net/npm/tom-select/dist/js/tom-select.complete.min.js"></script>

<script>

// =======================
// Search + Add City
// =======================

new TomSelect("#location",{

    create:true,

    persist:false,

    createOnBlur:true,

    sortField:"text",

    placeholder:"Search or Add City",

    render:{

        option_create:function(data,escape){

            return '<div class="create">➕ Add "<strong>'+escape(data.input)+'</strong>"</div>';

        }

    }

});

// =======================
// Multiple Image Preview
// =======================

const imageInput=document.getElementById("images");

let selectedFiles=[];

imageInput.addEventListener("change",function(){

Array.from(this.files).forEach(file=>{

const exists=selectedFiles.some(f=>

f.name===file.name&&
f.size===file.size&&
f.lastModified===file.lastModified

);

if(!exists){

selectedFiles.push(file);

}

});

updateInputFiles();

renderPreview();

});

function updateInputFiles(){

const dt=new DataTransfer();

selectedFiles.forEach(file=>{

dt.items.add(file);

});

imageInput.files=dt.files;

}

function renderPreview(){

const container=document.getElementById("preview-container");

container.innerHTML="";

selectedFiles.forEach((file,index)=>{

const reader=new FileReader();

reader.onload=function(e){

container.innerHTML+=`

<div class="img-box">

<img src="${e.target.result}">

<span
class="remove-btn"
onclick="removeImage(${index})">

×

</span>

</div>

`;

};

reader.readAsDataURL(file);

});

}

function removeImage(index){

selectedFiles.splice(index,1);

updateInputFiles();

renderPreview();

}

// =======================
// Experience Show/Hide
// =======================

document
.getElementById("eligibility")
.addEventListener("change",function(){

document.getElementById("experience-box").style.display=

this.value==="Experience"

? "block"

: "none";

});

</script>

{% endblock %}
