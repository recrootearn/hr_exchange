{% extends "base.html" %}

{% block content %}

<link href="https://cdn.jsdelivr.net/npm/tom-select/dist/css/tom-select.bootstrap5.min.css" rel="stylesheet">

<style>

body{
    background:#eef3fb;
}

.post-job-wrapper{
    max-width:850px;
    margin:20px auto 100px;
    padding:12px;
}

.post-job-card{

    background:#fff;

    border-radius:24px;

    overflow:hidden;

    box-shadow:0 15px 40px rgba(0,0,0,.08);

}

.post-header{

    background:linear-gradient(135deg,#2563eb,#1d4ed8);

    color:#fff;

    padding:32px 20px;

    text-align:center;

}

.post-header h2{

    font-size:32px;

    font-weight:800;

    margin:0;

}

.post-header p{

    margin-top:8px;

    opacity:.9;

}

.form-section{

    padding:22px;

    border-bottom:1px solid #eef2f7;

}

.section-title{

    font-size:22px;

    font-weight:700;

    color:#111827;

    margin-bottom:18px;

    display:flex;

    align-items:center;

    gap:10px;

}

.form-label{

    font-weight:700;

    color:#374151;

    margin-bottom:8px;

}

.form-control,
.form-select{

    min-height:56px;

    border-radius:16px !important;

    border:1px solid #d7dce5;

    font-size:16px;

    padding:14px 16px !important;

}

.form-control:focus,
.form-select:focus{

    border-color:#2563eb;

    box-shadow:0 0 0 .2rem rgba(37,99,235,.15);

}

textarea.form-control{

    min-height:150px;

    resize:none;

}

.ts-control{

    min-height:56px;

    border-radius:16px !important;

    border:1px solid #d7dce5 !important;

    padding:10px 12px !important;

}

.ts-dropdown{

    border-radius:14px;

    overflow:hidden;

}

.create{

    color:#2563eb;

    font-weight:700;

}

.upload-box{

    border:2px dashed #2563eb;

    border-radius:18px;

    padding:35px;

    text-align:center;

    cursor:pointer;

    transition:.25s;

    color:#2563eb;

    font-weight:700;

}

.upload-box:hover{

    background:#f7faff;

}

#preview-container{

    display:flex;

    flex-wrap:wrap;

    gap:12px;

    margin-top:18px;

}

.img-box{

    width:110px;

    height:110px;

    position:relative;

}

.img-box img{

    width:100%;

    height:100%;

    object-fit:cover;

    border-radius:14px;

}

.remove-btn{

    position:absolute;

    top:-8px;

    right:-8px;

    width:28px;

    height:28px;

    border-radius:50%;

    background:#ef4444;

    color:#fff;

    display:flex;

    align-items:center;

    justify-content:center;

    cursor:pointer;

    font-weight:bold;

}

.submit-btn{

    width:100%;

    height:58px;

    border:none;

    border-radius:18px;

    background:linear-gradient(135deg,#2563eb,#1d4ed8);

    color:#fff;

    font-size:18px;

    font-weight:700;

}

@media(max-width:768px){

.post-job-wrapper{

margin:0 0 90px;

padding:0;

}

.post-job-card{

border-radius:0;

box-shadow:none;

}

.post-header{

padding:28px 16px;

}

.form-section{

padding:18px;

}

}

</style>

<div class="post-job-wrapper">

<div class="post-job-card">

<div class="post-header">

<h2>🚀 Create Job Post</h2>

<p>Reach thousands of candidates across India.</p>

</div>

<form method="POST" enctype="multipart/form-data">

<div class="form-section">

<div class="section-title">

📋 Basic Information

</div>

<!-- ===========================
Basic Information
=========================== -->

<div class="row g-3">

    <div class="col-12">

        <label class="form-label">

            💼 Job Title

        </label>

        <input
            type="text"
            name="job_title"
            class="form-control"
            placeholder="Example: Sales Executive"
            required>

    </div>

    <div class="col-md-6">

        <label class="form-label">

            🌍 Job Location

        </label>

        <select
            id="location"
            name="location"
            class="form-select"
            required>

            <option value="">Select City</option>

            <option>Indore</option>
            <option>Bhopal</option>
            <option>Jabalpur</option>
            <option>Gwalior</option>
            <option>Ujjain</option>
            <option>Katni</option>
            <option>Satna</option>
            <option>Rewa</option>
            <option>Sagar</option>
            <option>Dewas</option>
            <option>Ratlam</option>
            <option>Khandwa</option>
            <option>Burhanpur</option>
            <option>Chhindwara</option>
            <option>Delhi</option>
            <option>Mumbai</option>
            <option>Pune</option>
            <option>Ahmedabad</option>
            <option>Surat</option>
            <option>Jaipur</option>
            <option>Lucknow</option>
            <option>Kanpur</option>
            <option>Patna</option>
            <option>Ranchi</option>
            <option>Raipur</option>
            <option>Hyderabad</option>
            <option>Bengaluru</option>
            <option>Chennai</option>
            <option>Kolkata</option>

        </select>

    </div>

    <div class="col-md-6">

        <label class="form-label">

            🏢 Office Address

        </label>

        <input
            type="text"
            name="office_address"
            class="form-control"
            placeholder="Example: Vijay Nagar, Scheme 54">

    </div>

</div>

</div>

<!-- ===========================
Salary & Benefits
=========================== -->

<div class="form-section">

<div class="section-title">

💰 Salary & Benefits

</div>

<div class="row g-3">

    <div class="col-md-6">

        <label class="form-label">

            💵 Monthly Salary

        </label>

        <input
            type="text"
            name="salary"
            class="form-control"
            placeholder="₹20,000"
            required>

    </div>

    <div class="col-md-6">

        <label class="form-label">

            🎁 Incentive (Optional)

        </label>

        <input
            type="text"
            name="incentive"
            class="form-control"
            placeholder="₹500 per joining">

    </div>

</div>

</div>

<!-- ===========================
Working Details
=========================== -->

<div class="form-section">

<div class="section-title">

🕒 Working Details

</div>

<div class="row g-3">

    <div class="col-md-6">

        <label class="form-label">

            🕘 Working From

        </label>

        <input
            type="time"
            name="working_from"
            class="form-control"
            required>

    </div>

    <div class="col-md-6">

        <label class="form-label">

            🕕 Working To

        </label>

        <input
            type="time"
            name="working_to"
            class="form-control"
            required>

    </div>

    <div class="col-md-6">

        <label class="form-label">

            📅 Working Days

        </label>

        <select
            name="working_days"
            class="form-select"
            required>

            <option value="">Select Working Days</option>

            <option>Monday - Friday</option>

            <option>Monday - Saturday</option>

            <option>Flexible Days</option>

        </select>

    </div>

    <div class="col-md-6">

        <label class="form-label">

            💼 Job Type

        </label>

        <select
            name="job_type"
            class="form-select"
            required>

            <option value="">Select Job Type</option>

            <option value="Work From Office">
                🏢 Work From Office
            </option>

            <option value="Work From Home">
                🏠 Work From Home
            </option>

        </select>

    </div>

</div>

</div>

<!-- ===========================
Candidate Requirements
=========================== -->

<div class="form-section">

<div class="section-title">

👨‍💼 Candidate Requirements

</div>

<div class="row g-3">

<div class="col-md-6">

<label class="form-label">

💼 Employment Type

</label>

<select
name="employment_type"
class="form-select"
required>

<option value="">Select Employment Type</option>

<option value="Full Time">Full Time</option>

<option value="Part Time">Part Time</option>

<option value="Internship">Internship</option>

<option value="Freelance">Freelance</option>

<option value="Contract">Contract</option>

</select>

</div>

<div class="col-md-6">

<label class="form-label">

🎓 Education Required

</label>

<select
name="education"
class="form-select">

<option value="">Select Education</option>

<option value="10th Pass">10th Pass</option>

<option value="12th Pass">12th Pass</option>

<option value="Diploma">Diploma</option>

<option value="Graduate">Graduate</option>

<option value="Post Graduate">Post Graduate</option>

<option value="Any Graduate">Any Graduate</option>

</select>

</div>

<div class="col-md-6">

<label class="form-label">

👤 Gender Preference

</label>

<select
name="gender"
class="form-select">

<option value="Both">Both</option>

<option value="Male">Male</option>

<option value="Female">Female</option>

</select>

</div>

<div class="col-md-6">

<label class="form-label">

⭐ Eligibility

</label>

<select
id="eligibility"
name="eligibility"
class="form-select"
required>

<option value="">Select Eligibility</option>

<option value="Fresher">Fresher</option>

<option value="Experience">Experienced</option>

</select>

</div>

<div
class="col-12"
id="experience-box"
style="display:none;">

<label class="form-label">

💼 Experience Required

</label>

<select
name="experience_required"
class="form-select">

<option value="">Select Experience</option>

<option>Less than 6 Months</option>

<option>6 Months - 1 Year</option>

<option>1 - 2 Years</option>

<option>2 - 3 Years</option>

<option>3 - 5 Years</option>

<option>5+ Years</option>

</select>

</div>

</div>

</div>

<!-- ===========================
Interview Details
=========================== -->

<div class="form-section">

<div class="section-title">

📅 Interview Details

</div>

<div class="row g-3">

<div class="col-md-6">

<label class="form-label">

📅 Interview From Date

</label>

<input
type="date"
name="interview_from"
class="form-control">

</div>

<div class="col-md-6">

<label class="form-label">

📅 Interview To Date

</label>

<input
type="date"
name="interview_to"
class="form-control">

</div>

<div class="col-md-6">

<label class="form-label">

🕘 Interview From Time

</label>

<input
type="time"
name="interview_time_from"
class="form-control">

</div>

<div class="col-md-6">

<label class="form-label">

🕕 Interview To Time

</label>

<input
type="time"
name="interview_time_to"
class="form-control">

</div>

<div class="col-12">

<label class="form-label">

📝 Interview Instructions

</label>

<textarea
name="interview_instructions"
class="form-control"
rows="4"
placeholder="Example: Carry Resume, Aadhaar Card, Formal Dress, Passport Size Photo etc."></textarea>

</div>

</div>

</div>

<!-- ===========================
Job Description
=========================== -->

<div class="form-section">

<div class="section-title">

📝 Job Description

</div>

<textarea
name="description"
class="form-control"
rows="7"
placeholder="Describe job role, responsibilities, requirements, benefits etc."
required></textarea>

</div>

<!-- ===========================
Company Images
=========================== -->

<div class="form-section">

<div class="section-title">

🖼 Job Posters / Company Images

</div>

<input
type="file"
id="images"
name="images"
multiple
accept="image/*"
hidden>

<label
for="images"
class="upload-box">

<i class="fas fa-cloud-upload-alt fa-3x mb-3"></i>

<h5>

Upload Images

</h5>

<p class="mb-0">

Click to select multiple images

</p>

</label>

<div id="preview-container"></div>

</div>

<div class="form-section">

<button
type="submit"
class="submit-btn">

🚀 Publish Job

</button>

</div>

</form>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/tom-select/dist/js/tom-select.complete.min.js"></script>

<script>

// ============================
// Search + Add City
// ============================

new TomSelect("#location",{

    create:function(input){

        return{

            value:input,

            text:input

        };

    },

    persist:false,

    createOnBlur:true,

    sortField:"text",

    maxOptions:1000,

    placeholder:"Search or Add City",

    render:{

        option_create:function(data,escape){

            return '<div class="create">➕ Add "<strong>'+escape(data.input)+'</strong>"</div>';

        }

    }

});

// ============================
// Multiple Image Preview
// ============================

const imageInput=document.getElementById("images");

let selectedFiles=[];

imageInput.addEventListener("change",function(){

Array.from(this.files).forEach(file=>{

const exists=selectedFiles.some(f=>

f.name===file.name &&
f.size===file.size &&
f.lastModified===file.lastModified

);

if(!exists){

selectedFiles.push(file);

}

});

updateInputFiles();

renderPreview();

});

function updateInputFiles(){

const dt=new DataTransfer();

selectedFiles.forEach(file=>{

dt.items.add(file);

});

imageInput.files=dt.files;

}

function renderPreview(){

const container=document.getElementById("preview-container");

container.innerHTML="";

selectedFiles.forEach((file,index)=>{

const reader=new FileReader();

reader.onload=function(e){

container.innerHTML+=`

<div class="img-box">

<img src="${e.target.result}">

<div
class="remove-btn"
onclick="removeImage(${index})">

×

</div>

</div>

`;

};

reader.readAsDataURL(file);

});

}

function removeImage(index){

selectedFiles.splice(index,1);

updateInputFiles();

renderPreview();

}

// ============================
// Experience Required
// ============================

document
.getElementById("eligibility")
.addEventListener("change",function(){

document.getElementById("experience-box").style.display=

this.value==="Experience"

? "block"

: "none";

});

</script>

{% endblock %}
