<!-- =========================
profile.html
========================= -->

{% extends 'base.html' %}

{% block content %}

<div class="card-box">

    <div class="text-center">

        <img src="/static/uploads/{{ current_user.profile_photo }}"
        style="
        width:130px;
        height:130px;
        border-radius:50%;
        object-fit:cover;
        border:4px solid #2563eb;
        ">

        <h3 class="mt-3">
            {{ current_user.first_name }}
            {{ current_user.last_name }}
        </h3>

        <p class="text-muted">
            {{ current_user.company }}
        </p>

    </div>

    <hr>

    <div class="row">

        <div class="col-md-6">

            <label class="mb-1">
                First Name
            </label>

            <input type="text"
            class="form-control mb-3"
            value="{{ current_user.first_name }}"
            readonly>

            <label class="mb-1">
                Last Name
            </label>

            <input type="text"
            class="form-control mb-3"
            value="{{ current_user.last_name }}"
            readonly>

            <label class="mb-1">
                Mobile Number
            </label>

            <input type="text"
            class="form-control mb-3"
            value="{{ current_user.mobile }}"
            readonly>

        </div>

        <div class="col-md-6">

            <label class="mb-1">
                Company Name
            </label>

            <input type="text"
            class="form-control mb-3"
            value="{{ current_user.company }}"
            readonly>

            <label class="mb-1">
                HR Type
            </label>

            <input type="text"
            class="form-control mb-3"
            value="{{ current_user.hr_type }}"
            readonly>

            <label class="mb-1">
                Trust Score
            </label>

            <input type="text"
            class="form-control mb-3"
            value="{{ current_user.trust_score }}"
            readonly>

        </div>

    </div>

    <a href="/edit-profile"
    class="btn btn-primary mt-3">

        Edit Profile

    </a>

</div>

{% endblock %}
