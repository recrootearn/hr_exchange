<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Create Account - RecrootEarn</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
rel="stylesheet">

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    min-height:100vh;

    background:
    linear-gradient(
    135deg,
    #0f172a,
    #1e1b4b,
    #581c87
    );

    font-family:Arial,sans-serif;

    display:flex;
    justify-content:center;
    align-items:center;

    padding:40px;

    overflow-x:hidden;
    overflow-y:auto;
}

/* CARD */

.register-box{

    width:100%;
    max-width:700px;

    background:rgba(255,255,255,0.08);

    backdrop-filter:blur(20px);

    border:1px solid rgba(255,255,255,0.15);

    border-radius:30px;

    padding:50px;

    box-shadow:
    0 20px 60px rgba(0,0,0,0.4);

    animation:fadeIn 1s ease;
}

/* LOGO */

.logo{

    text-align:center;

    font-size:42px;

    font-weight:900;

    margin-bottom:10px;

    color:white;

    word-break:break-word;
}

.logo span{
    color:#a855f7;
}

.subtitle{

    text-align:center;

    color:#cbd5e1;

    margin-bottom:40px;

    font-size:18px;
}

/* TITLE */

.title{

    text-align:center;

    font-size:38px;

    font-weight:800;

    color:white;

    margin-bottom:40px;
}

/* FORM */

.form-group{
    margin-bottom:22px;
}

.form-label{
    color:white;
    margin-bottom:10px;
    font-weight:600;
}

.input-box{
    position:relative;
}

.input-box i{

    position:absolute;

    left:18px;

    top:50%;

    transform:translateY(-50%);

    color:#94a3b8;

    z-index:2;
}

.form-control{

    height:60px;

    border:none;

    border-radius:16px;

    background:rgba(255,255,255,0.12);

    color:white;

    padding-left:50px;

    font-size:16px;

    width:100%;
}

.form-control::placeholder{
    color:#cbd5e1;
}

.form-control:focus{

    background:rgba(255,255,255,0.18);

    color:white;

    box-shadow:
    0 0 0 4px rgba(168,85,247,0.25);

    border:none;
}

.form-control[type="file"]{
    padding-top:16px;
}

/* SELECT */

select.form-control{
    padding-left:20px;
}

/* BUTTON */

.register-btn{

    width:100%;

    height:65px;

    border:none;

    border-radius:18px;

    background:
    linear-gradient(
    135deg,
    #6366f1,
    #a855f7
    );

    color:white;

    font-size:20px;

    font-weight:800;

    margin-top:15px;

    transition:0.4s;

    box-shadow:
    0 15px 35px rgba(168,85,247,0.35);
}

.register-btn:hover{

    transform:translateY(-4px);

    box-shadow:
    0 20px 45px rgba(168,85,247,0.45);
}

/* LOGIN */

.login-link{

    text-align:center;

    margin-top:30px;

    color:#e2e8f0;
}

.login-link a{

    color:#a855f7;

    font-weight:700;

    text-decoration:none;
}

/* ANIMATION */

@keyframes fadeIn{

    from{
        opacity:0;
        transform:translateY(30px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }

}

/* MOBILE RESPONSIVE */

@media (max-width:768px){

    body{
        padding:15px;
        align-items:flex-start;
    }

    .register-box{

        width:100%;
        max-width:100%;

        padding:25px;

        border-radius:24px;

        margin-top:20px;
        margin-bottom:20px;
    }

    .logo{

        font-size:28px;

        line-height:1.3;
    }

    .subtitle{

        font-size:15px;

        margin-bottom:25px;
    }

    .title{

        font-size:28px;

        margin-bottom:30px;

        line-height:1.4;
    }

    .form-control{

        height:55px;

        font-size:15px;
    }

    .register-btn{

        height:58px;

        font-size:18px;
    }

}

</style>

</head>

<body>

<div class="register-box">

    <div class="logo">

        RECROOT<span>EARN</span>

    </div>

    <div class="subtitle">

        Connect. Recruit. Earn.

    </div>

    <div class="title">

        Create HR Account

    </div>

    <form method="POST" enctype="multipart/form-data">

        <div class="form-group">

            <label class="form-label">First Name</label>

            <div class="input-box">

                <i class="fas fa-user"></i>

                <input
                type="text"
                name="first_name"
                class="form-control"
                placeholder="Enter First Name"
                required>

            </div>

        </div>

        <div class="form-group">

            <label class="form-label">Last Name</label>

            <div class="input-box">

                <i class="fas fa-user"></i>

                <input
                type="text"
                name="last_name"
                class="form-control"
                placeholder="Enter Last Name"
                required>

            </div>

        </div>

        <div class="form-group">

            <label class="form-label">Mobile Number</label>

            <div class="input-box">

                <i class="fas fa-phone"></i>

                <input
                type="text"
                name="mobile"
                class="form-control"
                placeholder="Enter Mobile Number"
                required>

            </div>

        </div>

        <div class="form-group">

            <label class="form-label">Email</label>

            <div class="input-box">

                <i class="fas fa-envelope"></i>

                <input
                type="email"
                name="email"
                class="form-control"
                placeholder="Enter Email"
                required>

            </div>

        </div>

        <div class="form-group">

            <label class="form-label">Company Name</label>

            <div class="input-box">

                <i class="fas fa-building"></i>

                <input
                type="text"
                name="company"
                class="form-control"
                placeholder="Enter Company Name"
                required>

            </div>

        </div>

        <div class="form-group">

            <label class="form-label">HR Type</label>

            <select
            name="hr_type"
            class="form-control"
            required>

                <option value="Consultancy HR">
                    Consultancy HR
                </option>

                <option value="Company HR">
                    Company HR
                </option>

            </select>

        </div>

        <div class="form-group">

            <label class="form-label">Username</label>

            <div class="input-box">

                <i class="fas fa-at"></i>

                <input
                type="text"
                name="username"
                class="form-control"
                placeholder="Create Username"
                required>

            </div>

        </div>

        <div class="form-group">

            <label class="form-label">

                Profile Photo (Optional)

            </label>

            <div class="input-box">

                <i class="fas fa-image"></i>

                <input
                type="file"
                name="photo"
                class="form-control">

            </div>

        </div>

<div class="form-group">

    <label class="form-label">
        Referral Code (Optional)
    </label>

    <input
    type="text"
    name="referral_code"
    class="form-control"
    value="{{ request.args.get('ref','') }}"
    placeholder="Referral Code (Optional)">

</div>+

<div class="form-group">

    <label class="form-label">Password</label>

    <div class="input-box">

        <i class="fas fa-lock"></i>

        <input
        type="password"
        name="password"
        class="form-control"
        placeholder="Create Password"
        required>

    </div>

</div>

<!-- TERMS & PRIVACY -->

<div style="
background:#f8fafc;
border:1px solid #e5e7eb;
border-radius:14px;
padding:15px;
margin-top:15px;
margin-bottom:20px;
font-size:14px;
line-height:1.6;
">

    <input
    type="checkbox"
    id="agree"
    required
    style="margin-right:8px;">

    <label for="agree">

        I agree to the

        <a href="/terms"
           target="_blank"
           style="font-weight:600;">
            Terms & Conditions
        </a>

        and

        <a href="/privacy"
           target="_blank"
           style="font-weight:600;">
            Privacy Policy
        </a>

        of RecrootEarn and confirm that the information provided by me is accurate.

    </label>

</div>

<button class="register-btn">

    Create Account

</button>

</form>

<div class="login-link">

    Already have an account?

    <a href="/login">

        Login

    </a>

</div>

</div>

</body>

</html>
