<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Create Account - RecrootEarn</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
rel="stylesheet">

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    min-height:100vh;

    background:
    linear-gradient(
    135deg,
    #0057b8,
    #0074e8,
    #39d11f
    );

    font-family:Arial,sans-serif;

    display:flex;
    justify-content:center;
    align-items:center;

    padding:40px;

    overflow-x:hidden;
    overflow-y:auto;
}

/* CARD */

.register-box{

    width:100%;
    max-width:700px;

    background:white;

    backdrop-filter:blur(20px);

    border:none;

    border-radius:30px;

    padding:50px;

    box-shadow:
    0 20px 60px rgba(0,0,0,0.4);

    animation:fadeIn 1s ease;
}

/* LOGO */

.logo{
    text-align:center;
    margin-bottom:15px;
}

.logo img{
    width:240px;
    max-width:100%;
    height:auto;
}

.subtitle{

    text-align:center;

    color:#6b7280;

    margin-bottom:40px;

    font-size:18px;
}

/* TITLE */

.title{

    text-align:center;

    font-size:38px;

    font-weight:800;

    color:#111827;

    margin-bottom:40px;
}

/* FORM */

.form-group{
    margin-bottom:22px;
}

.form-label{
    color:#111827;
    margin-bottom:10px;
    font-weight:600;
}

.input-box{
    position:relative;
}

.input-box i{

    position:absolute;

    left:18px;

    top:50%;

    transform:translateY(-50%);

    color:#94a3b8;

    z-index:2;
}

.form-control{

    height:56px;

    border:1px solid #d1d5db;

    border-radius:14px;

    background:#fafafa;

    color:#111827;

    padding-left:50px;

    font-size:15px;

    width:100%;
}

.form-control::placeholder{
    color:#cbd5e1;
}

.form-control:focus{

    background:#ffffff;

    color:#111827;

    border-color:#0074e8;

    box-shadow:
    0 0 0 4px rgba(0,116,232,0.15);

    outline:none;
}

.form-control[type="file"]{
    padding-top:16px;
}

/* SELECT */

select.form-control{
    padding-left:20px;
}

/* BUTTON */

.register-btn{

    width:100%;

    height:54px;

    border:none;

    border-radius:14px;

    background:
    linear-gradient(
        135deg,
        #0057b8,
        #0074e8
    );

    color:white;

    font-size:18px;

    font-weight:700;

    margin-top:15px;
}

.register-btn:hover{

    transform:translateY(-4px);

    box-shadow:
    0 15px 35px rgba(0,116,232,0.35);
}

/* LOGIN */

.login-link{

    text-align:center;

    margin-top:30px;

    color:#6b7280;
}

.login-link a{

    color:#0d63c9;

    font-weight:700;

    text-decoration:none;
}

/* ANIMATION */

@keyframes fadeIn{

    from{
        opacity:0;
        transform:translateY(30px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }

}

/* MOBILE RESPONSIVE */

@media (max-width:768px){

    body{
        padding:15px;
        align-items:flex-start;
    }

    .register-box{

        width:100%;
        max-width:100%;

        padding:25px;

        border-radius:24px;

        margin-top:20px;
        margin-bottom:20px;
    }

    .logo img{
    width:180px;
    height:auto;
}

    .subtitle{

        font-size:15px;

        margin-bottom:25px;
    }

    .title{

        font-size:28px;

        margin-bottom:30px;

        line-height:1.4;
    }

    .form-control{

        height:55px;

        font-size:15px;
    }

    .register-btn{

        height:58px;

        font-size:18px;
    }

}

</style>

</head>

<body>

<div class="register-box">

    <div class="logo">
    <img src="{{ url_for('static', filename='images/logo.png') }}">
</div>

<div class="subtitle">
    Recruit • Connect • Earn
</div>

    <div class="title">

        Create HR Account

    </div>

    <form method="POST" enctype="multipart/form-data">

        <div class="form-group">

            <label class="form-label">First Name</label>

            <div class="input-box">

                <i class="fas fa-user"></i>

                <input
                type="text"
                name="first_name"
                class="form-control"
                placeholder="Enter First Name"
                required>

            </div>

        </div>

        <div class="form-group">

            <label class="form-label">Last Name</label>

            <div class="input-box">

                <i class="fas fa-user"></i>

                <input
                type="text"
                name="last_name"
                class="form-control"
                placeholder="Enter Last Name"
                required>

            </div>

        </div>

        <div class="form-group">

            <label class="form-label">Mobile Number</label>

            <div class="input-box">

                <i class="fas fa-phone"></i>

                <input
                type="tel"
                name="mobile"
                class="form-control"
                maxlength="10"
                inputmode="numeric"
                placeholder="Enter Mobile Number"
                required
                oninput="
                this.value=this.value.replace(/[^0-9]/g,'');
                if(this.value.length>0 && !/^[6-9]/.test(this.value)){
                    this.value='';
                }
                this.value=this.value.slice(0,10);
                ">

                <small id="mobileStatus"></small>

                <div class="mt-2">

                    <button
                        type="button"
                        id="sendOtpBtn"
                        class="btn btn-primary w-100">
                        Send OTP
                    </button>

                </div>

                <div id="otpSection" style="display:none;" class="mt-3">

                    <input
                        type="text"
                        id="otp"
                        class="form-control"
                        maxlength="6"
                        placeholder="Enter OTP">

                    <button
                        type="button"
                        id="verifyOtpBtn"
                        class="btn btn-success w-100 mt-2">
                        Verify OTP
                    </button>

                    <button
                        type="button"
                        id="resendOtpBtn"
                        class="btn btn-link w-100 mt-2"
                        style="display:none;">
                        Resend OTP
                    </button>

                    <small id="otpMessage"></small>

                </div>  
  
            </div>

        </div>

        <div class="form-group">

            <label class="form-label">Email</label>

            <div class="input-box">

                <i class="fas fa-envelope"></i>

                <input
                type="email"
                name="email"
                class="form-control"
                placeholder="Enter Email"
                required>

                <small id="emailStatus"></small>
            </div>

        </div>

        <div class="form-group">

            <label class="form-label">Company Name</label>

            <div class="input-box">

                <i class="fas fa-building"></i>

                <input
                type="text"
                name="company"
                class="form-control"
                placeholder="Enter Company Name"
                required>

            </div>

        </div>

        <div class="form-group">

            <label class="form-label">Company City</label>

            <div class="input-box">

                <i class="fas fa-location-dot"></i>

                <input
                type="text"
                name="company_city"
                class="form-control"
                placeholder="Enter Company City"
                required>

            </div>

        </div>

        <div class="form-group">

            <label class="form-label">Full Company Address</label>

            <div class="input-box">

                <i class="fas fa-building"></i>

                <textarea
                name="full_company_address"
                class="form-control"
                rows="4"
                placeholder="Enter Complete Company Address"
                required></textarea>

            </div>

        </div>

        <div class="form-group">

            <label class="form-label">Company Website (Optional)</label>

            <div class="input-box">

                <i class="fas fa-globe"></i>

                <input
                type="text"
                name="company_website"
                class="form-control"
                placeholder="https://company.com">

            </div>

        </div>

        <div class="form-group">

            <label class="form-label">HR Type</label>

            <select
            name="hr_type"
            class="form-control"
            required>

                <option value="Consultancy HR">
                    Consultancy HR
                </option>

                <option value="Company HR">
                    Company HR
                </option>

            </select>

        </div>

        <div class="form-group">

            <label class="form-label">Username</label>

            <div class="input-box">

                <i class="fas fa-at"></i>

                <input
                type="text"
                name="username"
                class="form-control"
                placeholder="Create Username"
                style="text-transform:uppercase;"
                oninput="this.value=this.value.toUpperCase().replace(/\s/g,'')"
                required>

                <small id="usernameStatus"></small>
            </div>

        </div>

        <div class="form-group">

            <label class="form-label">

                Profile Photo (Optional)

            </label>

            <div class="input-box">

                <i class="fas fa-image"></i>

                <input
                type="file"
                name="photo"
                class="form-control">

            </div>

        </div>

        <div class="form-group">

        <label class="form-label">
        MSME Certificate (Optional)
        </label>

        <input
        type="file"
        name="msme_certificate"
        accept=".pdf,.doc,.docx,.jpg,.jpeg,.png"
        class="form-control">

        </div>

        <div class="form-group">

        <label class="form-label">
        Gumasta Certificate (Optional)
        </label>

        <input
        type="file"
        name="gumasta_certificate"
        accept=".pdf,.doc,.docx,.jpg,.jpeg,.png"
        class="form-control">

        </div>

<div class="form-group">

    <label class="form-label">
        Referral Code (Optional)
    </label>

    <input
    type="text"
    name="referral_code"
    class="form-control"
    value="{{ request.args.get('ref','') }}"
    placeholder="Referral Code (Optional)">

</div>

<div class="form-group">

    <label class="form-label">Password</label>

    <div class="input-box">

        <i class="fas fa-lock"></i>

        <input
        type="password"
        name="password"
        class="form-control"
        placeholder="Create Password"
        required>

    </div>

</div>

<!-- TERMS & PRIVACY -->

<div style="
background:#f8fafc;
border:1px solid #e5e7eb;
border-radius:14px;
padding:15px;
margin-top:15px;
margin-bottom:20px;
font-size:14px;
line-height:1.6;
">

    <input
    type="checkbox"
    id="agree"
    required
    style="margin-right:8px;">

    <label for="agree">

        I agree to the

        <a href="/terms"
           target="_blank"
           style="font-weight:600;">
            Terms & Conditions
        </a>

        and

        <a href="/privacy"
           target="_blank"
           style="font-weight:600;">
            Privacy Policy
        </a>

        of RecrootEarn and confirm that the information provided by me is accurate.

    </label>

</div>

<button
    type="submit"
    class="register-btn"
    id="registerBtn"
    disabled>

    Create Account

</button>

</form>

<div class="login-link">

    Already have an account?

    <a href="/login">

        Login

    </a>

</div>

</div>

<script>

document.querySelector('input[name="photo"]').addEventListener(
'change',
function(e){

    let file = e.target.files[0];

    if(!file) return;

    let reader = new FileReader();

    reader.onload = function(event){

        let img = new Image();

        img.onload = function(){

            let canvas =
            document.createElement('canvas');

            let maxSize = 800;

            let width = img.width;
            let height = img.height;

            if(width > height){

                if(width > maxSize){
                    height *= maxSize / width;
                    width = maxSize;
                }

            }else{

                if(height > maxSize){
                    width *= maxSize / height;
                    height = maxSize;
                }

            }

            canvas.width = width;
            canvas.height = height;

            let ctx = canvas.getContext('2d');

            ctx.drawImage(
                img,
                0,
                0,
                width,
                height
            );

            canvas.toBlob(function(blob){

                let compressedFile =
                new File(
                    [blob],
                    file.name,
                    {
                        type:'image/jpeg'
                    }
                );

                let dt =
                new DataTransfer();

                dt.items.add(compressedFile);

                document.querySelector(
                    'input[name="photo"]'
                ).files = dt.files;

            },'image/jpeg',0.8);

        };

        img.src = event.target.result;

    };

    reader.readAsDataURL(file);

});

</script>

<script>

document.querySelector('[name="username"]').addEventListener('blur', function(){

    fetch('/check-username?username=' + this.value.toUpperCase())

    .then(r => r.json())

    .then(data => {

        const s = document.getElementById('usernameStatus');

        if(data.exists){

            s.innerHTML = '❌ Username already taken';
            s.style.color = 'red';

        }else{

            s.innerHTML = '✅ Username available';
            s.style.color = 'green';

        }

    });

});

document.querySelector('[name="mobile"]').addEventListener('blur', function(){

    fetch('/check-mobile?mobile=' + this.value)

    .then(r => r.json())

    .then(data => {

        const s = document.getElementById('mobileStatus');

        if(data.exists){

            s.innerHTML = '❌ Mobile already registered';
            s.style.color = 'red';

        }else{

            s.innerHTML = '✅ Mobile available';
            s.style.color = 'green';

        }

    });

});

document.querySelector('input[name="email"]').addEventListener('blur', function () {

    fetch('/check-email?email=' + encodeURIComponent(this.value))

    .then(r => r.json())

    .then(data => {

        const s = document.getElementById('emailStatus');

        if(data.exists){

            s.innerHTML = "❌ Email already registered";
            s.style.color = "red";

        }else{

            s.innerHTML = "✅ Email available";
            s.style.color = "green";

        }

    });

});

</script>

<script>
document.querySelector('input[name="mobile"]').addEventListener("input", function () {

    this.value = this.value.replace(/\D/g, "");

    if (this.value.length === 1 && !/[6-9]/.test(this.value)) {
        this.value = "";
    }

    if (this.value.length > 10) {
        this.value = this.value.slice(0, 10);
    }

});
</script>

<script>

const sendBtn = document.getElementById("sendOtpBtn");
const verifyBtn = document.getElementById("verifyOtpBtn");
const resendBtn = document.getElementById("resendOtpBtn");

const registerBtn = document.getElementById("registerBtn");

sendBtn.onclick = function(){

    fetch("/send-otp",{

        method:"POST",

        headers:{
            "Content-Type":"application/x-www-form-urlencoded"
        },

        body:"mobile="+
        document.getElementById("mobile").value

    })

    .then(r=>r.json())

    .then(data=>{

        document.getElementById("otpMessage").innerHTML=data.message;

        if(data.success){

            document.getElementById("otpSection").style.display="block";

            resendBtn.style.display="block";

        }

    });

};

verifyBtn.onclick=function(){

    fetch("/verify-otp",{

        method:"POST",

        headers:{
            "Content-Type":"application/x-www-form-urlencoded"
        },

        body=

        "mobile="+
        document.getElementById("mobile").value+

        "&otp="+
        document.getElementById("otp").value

    })

    .then(r=>r.json())

    .then(data=>{

        document.getElementById("otpMessage").innerHTML=data.message;

        if(data.success){

            registerBtn.disabled=false;

            sendBtn.disabled=true;

            verifyBtn.disabled=true;

        }

    });

};

resendBtn.onclick=function(){

    fetch("/resend-otp",{

        method:"POST",

        headers:{
            "Content-Type":"application/x-www-form-urlencoded"
        },

        body:"mobile="+
        document.getElementById("mobile").value

    })

    .then(r=>r.json())

    .then(data=>{

        document.getElementById("otpMessage").innerHTML=data.message;

    });

};

</script>

</body>

</html>
