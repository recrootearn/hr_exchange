<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Create Account - RecrootEarn</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
rel="stylesheet">

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    min-height:100vh;

    background:
    linear-gradient(
    135deg,
    #0057b8,
    #0074e8,
    #39d11f
    );

    font-family:Arial,sans-serif;

    display:flex;
    justify-content:center;
    align-items:center;

    padding:40px;

    overflow-x:hidden;
    overflow-y:auto;
}

/* CARD */

.register-box{

    width:100%;
    max-width:700px;

    background:white;

    backdrop-filter:blur(20px);

    border:none;

    border-radius:30px;

    padding:50px;

    box-shadow:
    0 20px 60px rgba(0,0,0,0.4);

    animation:fadeIn 1s ease;
}

/* LOGO */

.logo{
    text-align:center;
    margin-bottom:15px;
}

.logo img{
    width:240px;
    max-width:100%;
    height:auto;
}

.subtitle{

    text-align:center;

    color:#6b7280;

    margin-bottom:40px;

    font-size:18px;
}

/* TITLE */

.title{

    text-align:center;

    font-size:38px;

    font-weight:800;

    color:#111827;

    margin-bottom:40px;
}

/* FORM */

.form-group{
    margin-bottom:22px;
}

.form-label{
    color:#111827;
    margin-bottom:10px;
    font-weight:600;
}

.input-box{
    position:relative;
}

.input-box i{

    position:absolute;

    left:18px;

    top:50%;

    transform:translateY(-50%);

    color:#94a3b8;

    z-index:2;
}

.form-control{

    height:56px;

    border:1px solid #d1d5db;

    border-radius:14px;

    background:#fafafa;

    color:#111827;

    padding-left:50px;

    font-size:15px;

    width:100%;
}

.form-control::placeholder{
    color:#cbd5e1;
}

.form-control:focus{

    background:#ffffff;

    color:#111827;

    border-color:#0074e8;

    box-shadow:
    0 0 0 4px rgba(0,116,232,0.15);

    outline:none;
}

.form-control[type="file"]{
    padding-top:16px;
}

/* SELECT */

select.form-control{
    padding-left:20px;
}

/* BUTTON */

.register-btn{

    width:100%;

    height:54px;

    border:none;

    border-radius:14px;

    background:
    linear-gradient(
        135deg,
        #0057b8,
        #0074e8
    );

    color:white;

    font-size:18px;

    font-weight:700;

    margin-top:15px;
}

.register-btn:hover{

    transform:translateY(-4px);

    box-shadow:
    0 15px 35px rgba(0,116,232,0.35);
}

/* LOGIN */

.login-link{

    text-align:center;

    margin-top:30px;

    color:#6b7280;
}

.login-link a{

    color:#0d63c9;

    font-weight:700;

    text-decoration:none;
}

/* ANIMATION */

@keyframes fadeIn{

    from{
        opacity:0;
        transform:translateY(30px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }

}

/* MOBILE RESPONSIVE */

@media (max-width:768px){

    body{
        padding:15px;
        align-items:flex-start;
    }

    .register-box{

        width:100%;
        max-width:100%;

        padding:25px;

        border-radius:24px;

        margin-top:20px;
        margin-bottom:20px;
    }

    .logo img{
    width:180px;
    height:auto;
}

    .subtitle{

        font-size:15px;

        margin-bottom:25px;
    }

    .title{

        font-size:28px;

        margin-bottom:30px;

        line-height:1.4;
    }

    .form-control{

        height:55px;

        font-size:15px;
    }

    .register-btn{

        height:58px;

        font-size:18px;
    }

}

</style>

</head>

<body>

<div class="register-box">

    <div class="logo">
    <img src="{{ url_for('static', filename='images/logo.png') }}">
</div>

<div class="subtitle">
    Recruit • Connect • Earn
</div>

    <div class="title">

        Create HR Account

    </div>

    <form method="POST" enctype="multipart/form-data">

        <div class="form-group">

            <div class="form-group">

    <label class="form-label">Mobile Number</label>

    <div class="input-box">

        <i class="fas fa-phone"></i>

        <input
            type="tel"
            id="mobile"
            name="mobile"
            class="form-control"
            maxlength="10"
            inputmode="numeric"
            placeholder="Enter Mobile Number"
            required
            oninput="
                this.value=this.value.replace(/[^0-9]/g,'');
                if(this.value.length>0 && !/^[6-9]/.test(this.value)){
                    this.value='';
                }
                this.value=this.value.slice(0,10);
            ">

    </div>

    <button
        type="button"
        id="verifyMobileBtn"
        class="btn btn-primary w-100 mt-2">

        Verify Mobile Number

    </button>

    <small
        id="mobileStatus"
        class="d-block mt-2">
    </small>

    <div
        id="otpStatus"
        class="alert alert-success mt-2"
        style="display:none;">

    </div>

    <input
        type="hidden"
        id="msg91AccessToken"
        name="msg91AccessToken">

    <input
        type="hidden"
        id="mobileVerified"
        value="0">

</div>

<div class="form-group">

    <label class="form-label">
        Referral Code (Optional)
    </label>

    <input
    type="text"
    name="referral_code"
    class="form-control"
    value="{{ request.args.get('ref','') }}"
    placeholder="Referral Code (Optional)">

</div>

<div class="form-group">

    <label class="form-label">Password</label>

    <div class="input-box">

        <i class="fas fa-lock"></i>

        <input
        type="password"
        name="password"
        class="form-control"
        placeholder="Create Password"
        required>

    </div>

</div>

<!-- TERMS & PRIVACY -->

<div style="
background:#f8fafc;
border:1px solid #e5e7eb;
border-radius:14px;
padding:15px;
margin-top:15px;
margin-bottom:20px;
font-size:14px;
line-height:1.6;
">

    <input
    type="checkbox"
    id="agree"
    required
    style="margin-right:8px;">

    <label for="agree">

        I agree to the

        <a href="/terms"
           target="_blank"
           style="font-weight:600;">
            Terms & Conditions
        </a>

        and

        <a href="/privacy"
           target="_blank"
           style="font-weight:600;">
            Privacy Policy
        </a>

        of RecrootEarn and confirm that the information provided by me is accurate.

    </label>

</div>

<button
    type="submit"
    class="register-btn"
    id="registerBtn"
    disabled>

    Create Account

</button>

</form>

<div class="login-link">

    Already have an account?

    <a href="/login">

        Login

    </a>

</div>

</div>

<script>

document.querySelector('input[name="photo"]').addEventListener(
'change',
function(e){

    let file = e.target.files[0];

    if(!file) return;

    let reader = new FileReader();

    reader.onload = function(event){

        let img = new Image();

        img.onload = function(){

            let canvas =
            document.createElement('canvas');

            let maxSize = 800;

            let width = img.width;
            let height = img.height;

            if(width > height){

                if(width > maxSize){
                    height *= maxSize / width;
                    width = maxSize;
                }

            }else{

                if(height > maxSize){
                    width *= maxSize / height;
                    height = maxSize;
                }

            }

            canvas.width = width;
            canvas.height = height;

            let ctx = canvas.getContext('2d');

            ctx.drawImage(
                img,
                0,
                0,
                width,
                height
            );

            canvas.toBlob(function(blob){

                let compressedFile =
                new File(
                    [blob],
                    file.name,
                    {
                        type:'image/jpeg'
                    }
                );

                let dt =
                new DataTransfer();

                dt.items.add(compressedFile);

                document.querySelector(
                    'input[name="photo"]'
                ).files = dt.files;

            },'image/jpeg',0.8);

        };

        img.src = event.target.result;

    };

    reader.readAsDataURL(file);

});

</script>

<script>

document.querySelector('[name="mobile"]').addEventListener('blur', function(){

    fetch('/check-mobile?mobile=' + this.value)

    .then(r => r.json())

    .then(data => {

        const s = document.getElementById('mobileStatus');

        if(data.exists){

            s.innerHTML = '❌ Mobile already registered';
            s.style.color = 'red';

        }else{

            s.innerHTML = '✅ Mobile available';
            s.style.color = 'green';

        }

    });

});

</script>

<script>

var configuration = {

    widgetId: "36676a676343313137323133",

    tokenAuth: "546033TFUN4xUNi6a436063P1",

    identifier: "",

    exposeMethods: false,

    success: function(data){

        console.log(data);

        document.getElementById("msg91AccessToken").value =
            data.accessToken || data.token || "";

        document.getElementById("mobileVerified").value = "1";

        document.getElementById("registerBtn").disabled = false;

        document.getElementById("verifyMobileBtn").disabled = true;

        document.getElementById("mobile").readOnly = true;

        document.getElementById("otpStatus").style.display="block";

        document.getElementById("otpStatus").innerHTML =
        "✅ Mobile Number Verified Successfully";

    },

    failure: function(error){

        console.log(error);

        alert("OTP Verification Failed.");

    }

};

</script>

<script
src="https://verify.msg91.com/otp-provider.js">
</script>

<script>

document.getElementById("verifyMobileBtn").onclick = function () {

    var mobile = document.getElementById("mobile").value.trim();

    if (mobile.length != 10) {
        alert("Enter valid mobile number.");
        return;
    }

    // First check if number already exists
    fetch('/check-mobile?mobile=' + mobile)
    .then(r => r.json())
    .then(data => {

        if (data.exists) {

            document.getElementById("mobileStatus").innerHTML =
                "❌ Mobile already registered";

            document.getElementById("mobileStatus").style.color = "red";

            return;
        }

        document.getElementById("mobileStatus").innerHTML =
            "✅ Mobile available";

        document.getElementById("mobileStatus").style.color = "green";

        configuration.identifier = "91" + mobile;

        initSendOTP(configuration);

    });

};

</script>

</body>

</html>
