<!DOCTYPE html>
<html>

<head>

<title>Welcome - RecrootEarn</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
rel="stylesheet">

<style>

body{

    min-height:100vh;

    display:flex;

    justify-content:center;

    align-items:center;

    background:
    linear-gradient(
    135deg,
    #0f172a,
    #1e1b4b,
    #581c87
    );

    font-family:Arial;
}

.success-box{

    background:white;

    padding:60px;

    border-radius:30px;

    text-align:center;

    box-shadow:
    0 20px 60px rgba(0,0,0,0.4);

    animation:fadeIn 1s ease;
}

.success-box h1{

    font-size:48px;

    font-weight:900;

    margin-bottom:20px;
}

.success-box p{

    font-size:20px;

    color:#6b7280;

    margin-bottom:35px;
}

.login-btn{

    padding:18px 40px;

    border:none;

    border-radius:16px;

    background:
    linear-gradient(
    135deg,
    #6366f1,
    #a855f7
    );

    color:white;

    font-size:18px;

    font-weight:800;

    text-decoration:none;
}

@keyframes fadeIn{

    from{
        opacity:0;
        transform:translateY(40px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }

}

</style>

</head>

<body>

<div class="success-box">

    <h1>

        Welcome to RecrootEarn 🎉

    </h1>

    <p>

        Your HR account has been created successfully.

    </p>

    <a href="/login" class="login-btn">

        Login Now

    </a>

</div>

</body>

</html>
