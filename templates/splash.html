<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>RecrootEarn</title>

<style>

html,
body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#0B5ED7;
}

.video-container{
    width:100vw;
    height:100vh;

    display:flex;
    align-items:center;
    justify-content:center;

    background:#0B5ED7;
}

video{

    max-width:100%;
    max-height:100%;

    width:auto;
    height:auto;

    display:block;

}

</style>

</head>

<body>

<div class="video-container">

    <video
        id="intro"
        autoplay
        controls
        playsinline>

        <source
            src="{{ url_for('static', filename='videos/intro.mp4') }}"
            type="video/mp4">

    </video>

</div>

<script>

const video = document.getElementById("intro");

video.onended = function(){

    window.location.href = "/home";

};

</script>

</body>

</html>
