<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>RECROOTEARN</title>

<style>

html,
body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#0B5ED7;
}

#intro{
    position:fixed;
    top:0;
    left:0;

    width:100%;
    height:100%;

    object-fit:contain;

    background:#0B5ED7;
}

</style>

</head>

<body>

<video
    id="intro"
    autoplay
    muted
    playsinline>

    <source
        src="{{ url_for('static', filename='intro.mp4') }}"
        type="video/mp4">

</video>

<script>

const video = document.getElementById("intro");

video.onended = function(){

    window.location.href = "/home";

};

</script>

</body>
</html>
