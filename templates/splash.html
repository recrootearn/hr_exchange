<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>RecrootEarn</title>

<style>

html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#0B5ED7;

    opacity:1;
    transition:opacity .5s ease;
}

.splash{
    width:100vw;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#0B5ED7;
    overflow:hidden;
}

#intro{
    width:100%;
    height:100%;
    object-fit:contain;

    /* Hide until ready (prevents WebView play icon) */
    opacity:0;
    transition:opacity .2s ease;
}

/* MOBILE ONLY */

@media (max-width:768px){

    #intro{
        width:100%;
        height:100%;
        object-fit:contain;

        transform:translateY(-9%);
    }

}

</style>

</head>

<body>

<div class="splash">

    <video
        id="intro"
        autoplay
        muted
        playsinline
        webkit-playsinline
        preload="auto"
        disablePictureInPicture
        controlslist="nodownload nofullscreen noremoteplayback">

        <source
            src="{{ url_for('static', filename='videos/intro.mp4') }}"
            type="video/mp4">

    </video>

</div>

<script>

const video = document.getElementById("intro");

/* Make sure controls never appear */
video.controls = false;
video.muted = true;
video.playsInline = true;

/* Show video only when it can play */
video.oncanplay = function () {
    video.style.opacity = "1";
    video.play().catch(() => {});
};

/* Existing functionality preserved */
video.onended = function(){

    document.body.style.opacity = "0";

    setTimeout(function(){

        window.location.href = "/home";

    },500);

};

</script>

</body>
</html>
