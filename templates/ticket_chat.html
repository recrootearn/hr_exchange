{% extends 'base.html' %}

{% block content %}

<h2 class="mb-4">

    Support Ticket Chat

</h2>

<div class="card p-4">

    <h5>
        {{ ticket.subject }}
    </h5>

    <hr>

    {% for r in replies %}

    <div class="mb-3">

        <b>{{ r.sender }}</b>

        <br>

        {{ r.message }}

        <br>

        <small class="text-muted">
            {{ r.created_at }}
        </small>

    </div>

    <hr>

    {% endfor %}

    <form method="POST">

        <textarea
        name="message"
        class="form-control"
        placeholder="Type message..."
        required></textarea>

        <button
        class="btn btn-primary mt-3">

            Send

        </button>

    </form>

</div>

{% endblock %}
