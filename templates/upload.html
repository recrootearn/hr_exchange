{% extends 'base.html' %}

{% block content %}

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

.content{

    min-height:100vh;

    background:
    linear-gradient(
    135deg,
    #0f172a,
    #1e1b4b,
    #581c87
    );

    padding:25px;

    display:flex;
    justify-content:center;
    align-items:flex-start;
}

/* MAIN CARD */

.upload-box{

    width:100%;
    max-width:850px;

    background:rgba(255,255,255,0.08);

    backdrop-filter:blur(20px);

    border:1px solid rgba(255,255,255,0.12);

    border-radius:32px;

    padding:40px;

    box-shadow:
    0 20px 60px rgba(0,0,0,0.35);

    animation:fadeIn 0.7s ease;
}

/* HEADER */

.upload-title{

    font-size:42px;

    font-weight:900;

    color:white;

    margin-bottom:10px;

    text-align:center;
}

.upload-subtitle{

    color:#cbd5e1;

    text-align:center;

    margin-bottom:35px;

    font-size:16px;
}

/* GRID */

.form-grid{

    display:grid;

    grid-template-columns:repeat(2,1fr);

    gap:22px;
}

/* FORM */

.form-group{
    margin-bottom:20px;
}

.form-label{

    color:white;

    margin-bottom:10px;

    display:block;

    font-weight:600;

    font-size:15px;
}

.input-box{
    position:relative;
}

.input-box i{

    position:absolute;

    top:50%;

    left:18px;

    transform:translateY(-50%);

    color:#94a3b8;

    font-size:16px;
}

.form-control,
.form-select{

    width:100%;

    height:62px;

    border:none;

    border-radius:18px;

    background:rgba(255,255,255,0.12);

    color:white;

    padding-left:52px;

    font-size:16px;
}

.form-select{
    padding-left:18px;
}

textarea.form-control{

    height:140px;

    padding-top:18px;

    resize:none;
}

.form-control::placeholder{
    color:#cbd5e1;
}

.form-control:focus,
.form-select:focus{

    background:rgba(255,255,255,0.18);

    color:white;

    box-shadow:
    0 0 0 4px rgba(168,85,247,0.25);

    border:none;
}

/* FULL WIDTH */

.full-width{
    grid-column:1/-1;
}

/* BUTTON */

.upload-btn{

    width:100%;

    height:68px;

    border:none;

    border-radius:22px;

    background:
    linear-gradient(
    135deg,
    #2563eb,
    #9333ea
    );

    color:white;

    font-size:20px;

    font-weight:800;

    margin-top:10px;

    transition:0.4s;

    box-shadow:
    0 15px 40px rgba(147,51,234,0.35);
}

.upload-btn:hover{

    transform:translateY(-4px);

    box-shadow:
    0 20px 50px rgba(147,51,234,0.45);
}

/* MOBILE */

@media(max-width:768px){

    .content{
        padding:14px;
    }

    .upload-box{

        padding:22px;

        border-radius:24px;
    }

    .upload-title{

        font-size:30px;

        line-height:1.2;
    }

    .upload-subtitle{

        font-size:14px;

        margin-bottom:28px;
    }

    .form-grid{

        grid-template-columns:1fr;

        gap:0;
    }

    .form-control,
    .form-select{

        height:58px;

        font-size:15px;
    }

    textarea.form-control{
        height:120px;
    }

    .upload-btn{

        height:60px;

        font-size:18px;
    }

}

/* ANIMATION */

@keyframes fadeIn{

    from{
        opacity:0;
        transform:translateY(30px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }

}

</style>

<div class="upload-box">

    <div class="upload-title">
        Upload Candidate
    </div>

    <div class="upload-subtitle">
        Add candidate details and start earning 🚀
    </div>

    <form method="POST" enctype="multipart/form-data">

        <div class="form-grid">

            <!-- NAME -->

            <div class="form-group">

                <label class="form-label">
                    Candidate Name
                </label>

                <div class="input-box">

                    <i class="fas fa-user"></i>

                    <input
                    type="text"
                    name="name"
                    class="form-control"
                    placeholder="Enter Candidate Name"
                    required>

                </div>

            </div>

            <!-- PHONE -->

            <div class="form-group">

                <label class="form-label">
                    Mobile Number
                </label>

                <div class="input-box">

                    <i class="fas fa-phone"></i>

                    <input
                    type="text"
                    name="phone"
                    class="form-control"
                    placeholder="Enter Mobile Number"
                    required>

                </div>

            </div>

            <!-- CITY -->

            <div class="form-group">

                <label class="form-label">
                    City
                </label>

                <div class="input-box">

                    <i class="fas fa-location-dot"></i>

                    <input
                    type="text"
                    name="city"
                    class="form-control"
                    placeholder="Enter City"
                    required>

                </div>

            </div>

            <!-- CATEGORY -->

            <div class="form-group">

                <label class="form-label">
                    Category
                </label>

                <select
                name="category"
                class="form-select"
                required>

                    <option value="">
                        Select Category
                    </option>

                    <option>
                        IT
                    </option>

                    <option>
                        BPO
                    </option>

                    <option>
                        Sales
                    </option>

                    <option>
                        Telecaller
                    </option>

                    <option>
                        HR
                    </option>

                </select>

            </div>

            <!-- EXPERIENCE -->

            <div class="form-group">

                <label class="form-label">
                    Experience
                </label>

                <select
                name="experience"
                class="form-select"
                required>

                    <option>
                        Fresher
                    </option>

                    <option>
                        Experienced
                    </option>

                </select>

            </div>

            <!-- DESIGNATION -->

            <div class="form-group">

                <label class="form-label">
                    Designation
                </label>

                <div class="input-box">

                    <i class="fas fa-briefcase"></i>

                    <input
                    type="text"
                    name="designation"
                    class="form-control"
                    placeholder="Enter Designation"
                    required>

                </div>

            </div>

            <!-- RESUME -->

            <div class="form-group full-width">

                <label class="form-label">
                    Upload Resume
                </label>

                <input
                type="file"
                name="resume"
                class="form-control">

            </div>

            <!-- ABOUT -->

            <div class="form-group full-width">

                <label class="form-label">
                    Candidate Description
                </label>

                <textarea
                name="about"
                class="form-control"
                placeholder="Write candidate details..."></textarea>

            </div>

            <!-- BUTTON -->

            <div class="full-width">

                <button class="upload-btn">

                    Upload Candidate

                </button>

            </div>

        </div>

    </form>

</div>

{% endblock %}
